<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

     GitHub: sync, Apple Pay inbox, price file · CoinGecko: crypto prices · Frankfurter: ECB exchange rates
     jsDelivr + projectnaptha: the reading tools for screenshots and PDFs and their language data -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval' blob: https://cdn.jsdelivr.net; worker-src 'self' blob: https://cdn.jsdelivr.net; connect-src 'self' https://api.github.com https://gist.githubusercontent.com https://raw.githubusercontent.com https://api.coingecko.com https://api.frankfurter.app https://api.frankfurter.dev https://cdn.jsdelivr.net https://tessdata.projectnaptha.com; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self'">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ledgerline">
<meta name="theme-color" content="#F2F4F3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F1720" media="(prefers-color-scheme: dark)">
<meta name="referrer" content="no-referrer">
<title>Ledgerline</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%2316212E'/><path d='M14 44h36M14 34h24M14 24h14' stroke='%233DBA8D' stroke-width='6' stroke-linecap='round'/></svg>">
<link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' fill='%2316212E'/><path d='M14 44h36M14 34h24M14 24h14' stroke='%233DBA8D' stroke-width='6' stroke-linecap='round'/></svg>">
<style>
:root{
  --paper:#F2F4F3; --surface:#FFFFFF; --surface-2:#E7ECEA; --ink:#16212E; --muted:#5B6775; --line:#D6DCDF;
  --pine:#1F7A5C; --pine-soft:#DCEFE7; --crimson:#C62F3E; --crimson-soft:#F8E1E3; --amber:#A36C00; --amber-soft:#F6EBD3;
  --cobalt:#3346C9; --cobalt-soft:#E3E6FA; --fixed:#55626F; --pot:#B7791F; --halo:#FFFFFF;
  --font:-apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --display:-apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  color-scheme:light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#0F1720; --surface:#17212C; --surface-2:#1F2B38; --ink:#E8EDF2; --muted:#96A3B1; --line:#2A3644;
    --pine:#3DBA8D; --pine-soft:#173A31; --crimson:#F0606C; --crimson-soft:#40202A; --amber:#E7B13A; --amber-soft:#3A2F17;
    --cobalt:#8794FF; --cobalt-soft:#232B55; --fixed:#8C99A7; --pot:#E0A84A; --halo:#17212C; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0F1720; --surface:#17212C; --surface-2:#1F2B38; --ink:#E8EDF2; --muted:#96A3B1; --line:#2A3644;
  --pine:#3DBA8D; --pine-soft:#173A31; --crimson:#F0606C; --crimson-soft:#40202A; --amber:#E7B13A; --amber-soft:#3A2F17;
  --cobalt:#8794FF; --cobalt-soft:#232B55; --fixed:#8C99A7; --pot:#E0A84A; --halo:#17212C; color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.45;font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--cobalt)}
:focus-visible{outline:2px solid var(--cobalt);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.app{display:grid;grid-template-columns:minmax(0,1fr);min-height:100vh}
.app>div,.grid>*{min-width:0}
.rail{display:none}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--paper) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);display:flex;align-items:center;gap:12px;padding:12px 18px;border-bottom:1px solid var(--line)}
.brand{font-family:var(--display);font-weight:800;letter-spacing:-.03em;font-size:20px;display:flex;align-items:center;gap:8px}
.brand svg{width:22px;height:22px}
.sync-pill{margin-left:auto;font-size:13px;color:var(--muted);background:none;border:1px solid var(--line);border-radius:999px;padding:4px 10px;cursor:pointer;display:flex;align-items:center;gap:6px}
.sync-pill .dot{width:7px;height:7px;border-radius:50%;background:var(--muted)}
.sync-pill.ok .dot{background:var(--pine)} .sync-pill.err .dot{background:var(--crimson)} .sync-pill.busy .dot{background:var(--amber)}
main{padding:18px 16px 110px;max-width:1120px;width:100%;margin:0 auto}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabbar button{flex:1;background:none;border:0;padding:9px 2px 8px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;min-width:0;color:var(--muted);cursor:pointer}
.tabbar button svg{width:22px;height:22px}
.tabbar button[aria-current="page"]{color:var(--ink);font-weight:700}
.tabbar button[aria-current="page"] svg{color:var(--cobalt)}
@media (min-width:1024px){
  .app{grid-template-columns:232px minmax(0,1fr)}
  .rail{display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh;padding:22px 14px;border-right:1px solid var(--line);background:var(--surface)}
  .rail .brand{padding:0 10px 18px}
  .rail button{display:flex;align-items:center;gap:10px;background:none;border:0;border-radius:8px;padding:10px 12px;cursor:pointer;color:var(--muted);font-size:15px;text-align:left}
  .rail button svg{width:20px;height:20px}
  .rail button:hover{background:var(--surface-2);color:var(--ink)}
  .rail button[aria-current="page"]{background:var(--ink);color:var(--paper);font-weight:600}
  .rail .rail-foot{margin-top:auto;font-size:12px;color:var(--muted);padding:0 10px}
  .tabbar{display:none} .topbar .brand{display:none}
  main{padding:26px 34px 60px}
}

h1{font-family:var(--display);font-size:clamp(26px,4vw,36px);letter-spacing:-.025em;line-height:1.1;margin:0;font-weight:800}
h2{font-family:var(--display);font-size:18px;letter-spacing:-.01em;margin:0 0 4px;font-weight:700}
h3{font-size:15px;margin:0 0 6px;font-weight:700}
.sub{color:var(--muted);font-size:14px;margin:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px}
.panel+.panel,.grid+.panel,.panel+.grid,.grid+.grid,.kpis+.panel,.kpis+.grid,.tips+.panel,.kpis+.tips{margin-top:16px}
.panel-head{display:flex;align-items:baseline;gap:8px 12px;flex-wrap:wrap;margin-bottom:12px}
.panel-head .right{margin-left:auto}
.grid{display:grid;gap:16px}
.grid>.panel,.grid>div>.panel:first-child{margin-top:0}
.grid>div>.panel+.panel{margin-top:16px}
@media (min-width:700px){.g2{grid-template-columns:1fr 1fr}.g-wide{grid-template-columns:1.4fr 1fr}}
@media (min-width:900px){.g3{grid-template-columns:repeat(3,1fr)}}
.page-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.page-head .right{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.scroll-x{overflow-x:auto;-webkit-overflow-scrolling:touch}
.chart svg{display:block;width:100%;height:auto}
.chart.min600 svg{min-width:600px}
.muted{color:var(--muted)} .pos{color:var(--pine)} .neg{color:var(--crimson)} .warn{color:var(--amber)}
.small{font-size:13px}
.empty{padding:22px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:12px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 14px;cursor:pointer;font-weight:600;font-size:14px;white-space:nowrap;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.btn.danger{color:var(--crimson);border-color:color-mix(in srgb,var(--crimson) 40%,var(--line))}
.btn.ghost{border-color:transparent;background:none}
.btn.icon{padding:8px;border-radius:50%;width:38px;height:38px}
.btn svg{width:18px;height:18px}
.btn:disabled{opacity:.5;cursor:not-allowed}
label.field{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--muted);font-weight:500}
label.check{display:flex;gap:8px;align-items:center;font-size:14px;cursor:pointer}
label.check input{width:18px;height:18px;accent-color:var(--cobalt)}
.input,select.input{width:100%;border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:10px 12px;font-size:16px;color:var(--ink);min-width:0}
.input:focus{outline:2px solid var(--cobalt);outline-offset:0;border-color:transparent}
.input.money{text-align:right}
.seg{display:inline-flex;background:var(--surface-2);border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;border-radius:8px;padding:7px 12px;font-size:14px;cursor:pointer;color:var(--muted);font-weight:600}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(10,20,30,.12)}
.seg.pot button[aria-pressed="true"][data-fund="savings"],.seg.pot button[aria-pressed="true"][data-dest="savings"]{color:var(--pot)}
.month-nav{display:flex;align-items:center;gap:6px}
.month-nav .label{min-width:150px;text-align:center;font-weight:700;font-size:17px}
.form-grid{display:grid;gap:10px;grid-template-columns:1fr 1fr}
@media (max-width:520px){.form-grid{grid-template-columns:1fr}}

.hero{position:relative;padding:22px 20px 20px;border-radius:20px;background:var(--surface);border:1px solid var(--line);overflow:hidden}
.hero .label{font-size:15px;color:var(--muted);font-weight:600}
.figure{font-family:var(--display);display:flex;align-items:baseline;gap:2px;font-weight:800;letter-spacing:-.045em;line-height:.95;margin:8px 0 4px;font-size:clamp(64px,15vw,112px)}
.figure .cur{font-size:.42em;font-weight:700;letter-spacing:-.02em;margin-right:4px;align-self:flex-start;margin-top:.12em;color:var(--muted)}
.figure .dec{font-size:.36em;font-weight:700;letter-spacing:-.01em;color:var(--muted)}
.hero.s-over-today .figure,.hero.s-overdrawn .figure,.hero.s-unrecoverable .figure{color:var(--crimson)}
.hero.s-tight .figure{color:var(--amber)}
.hero-meta{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:14px;color:var(--muted)}
.hero-meta b{color:var(--ink);font-weight:700}
.odds{display:flex;align-items:center;gap:12px;margin-top:16px}
.odds .ring{flex:none;width:52px;height:52px}
.odds .t{font-size:14px;color:var(--muted);line-height:1.35}
.odds .t b{color:var(--ink);font-size:16px}
.runway{margin-top:16px;display:grid;gap:7px}
.runway .row{display:grid;grid-template-columns:86px 1fr 56px;align-items:center;gap:10px;font-size:13px;color:var(--muted)}
.runway .track{height:10px;border-radius:5px;background:var(--surface-2);overflow:hidden;position:relative}
.runway .fill{position:absolute;inset:0 auto 0 0;border-radius:5px}
.runway .row span:last-child{text-align:right;color:var(--ink);font-weight:600}
.status{margin-top:16px;padding:12px 14px;border-radius:12px;font-size:15px;line-height:1.4;display:flex;gap:10px;align-items:flex-start}
.status svg{flex:none;width:20px;height:20px;margin-top:1px}
.status.on-track,.status.good{background:var(--pine-soft)} .status.on-track svg,.status.good svg{color:var(--pine)}
.status.tight,.status.warn{background:var(--amber-soft)} .status.tight svg,.status.warn svg{color:var(--amber)}
.status.over-today,.status.overdrawn,.status.unrecoverable,.status.bad{background:var(--crimson-soft)} .status.over-today svg,.status.overdrawn svg,.status.unrecoverable svg,.status.bad svg{color:var(--crimson)}
.status.neutral,.status.info{background:var(--surface-2)} .status.info svg{color:var(--cobalt)}

.safety{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px 4px 4px;cursor:pointer;font-size:13px;color:var(--muted)}
.safety svg{width:30px;height:30px}
.safety b{color:var(--ink)}

.qa{display:grid;gap:12px}
.qa-row{display:grid;grid-template-columns:1fr 130px;gap:10px}
.qa .big{font-size:18px;padding:13px 14px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 11px;font-size:13px;cursor:pointer;font-weight:600;color:var(--ink)}
.chip .sw{width:9px;height:9px;border-radius:50%}
.chip[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--paper)}
.chip .conf{font-weight:500;opacity:.7;font-size:12px}
.guess-note{font-size:12px;color:var(--muted)}
.qa-foot{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.qa-foot .btn.primary{margin-left:auto;padding:12px 20px;font-size:15px}
.fund-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:13px;color:var(--muted)}

.tx-list{display:flex;flex-direction:column}
.tx-day{font-size:13px;font-weight:700;color:var(--muted);padding:12px 2px 4px;display:flex;justify-content:space-between}
.tx{display:grid;grid-template-columns:10px 1fr auto;gap:12px;align-items:center;padding:10px 4px;border:0;border-bottom:1px solid var(--line);cursor:pointer;background:none;text-align:left;width:100%}
.tx:hover{background:var(--surface-2)}
.tx .sw{width:10px;height:10px;border-radius:3px}
.tx .name{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tx .meta{font-size:12px;color:var(--muted)}
.tx .amt{font-weight:700;text-align:right}
.tx .amt.in{color:var(--pine)} .tx .amt.inv{color:var(--cobalt)} .tx .amt.pot{color:var(--pot)}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:1px 6px;border-radius:5px;background:color-mix(in srgb,var(--pot) 18%,transparent);color:var(--pot);margin-left:6px;vertical-align:1px}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media (min-width:700px){.kpis{grid-template-columns:repeat(3,1fr)}.kpis.k4{grid-template-columns:repeat(4,1fr)}}
@media (min-width:1360px){.kpis.k6{grid-template-columns:repeat(6,1fr)}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.kpi .k{font-size:13px;color:var(--muted)}
.kpi .v{font-family:var(--display);font-size:22px;font-weight:800;letter-spacing:-.02em;margin-top:2px}
.kpi .d{font-size:12px;color:var(--muted);margin-top:2px}
.cat-rows{display:grid;gap:9px}
/* donut and list side by side only when the list keeps at least 260 px; otherwise the list goes below the chart */
.cat-split{display:flex;flex-wrap:wrap;gap:18px;align-items:center}
.cat-split > .chart{flex:0 0 170px;margin:0 auto}
.cat-split > :not(.chart){flex:1 1 260px;min-width:260px}
@media (max-width:360px){.cat-split > :not(.chart){min-width:0;flex-basis:100%}}
.cat-row{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center;font-size:14px}
.cat-row .bar{grid-column:1/-1;height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden;display:flex}
.cat-row .bar i{display:block;height:100%}
.cat-row .nm{display:flex;align-items:center;gap:8px;font-weight:600}
.cat-row .nm .sw{width:9px;height:9px;border-radius:50%}
.cat-row .vv{font-weight:700}
.cat-row .vv small{color:var(--muted);font-weight:500;margin-left:6px}

.tips{display:grid;gap:10px}
@media (min-width:700px){.tips{grid-template-columns:repeat(3,1fr)}}
.tip{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:12px;font-size:14px;line-height:1.4;background:var(--surface);border:1px solid var(--line)}
.tip svg{flex:none;width:18px;height:18px;margin-top:1px}
.tip.good svg{color:var(--pine)} .tip.warn svg{color:var(--amber)} .tip.info svg{color:var(--cobalt)}

.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .dow{font-size:11px;color:var(--muted);text-align:center;padding-bottom:2px}
.cal button.day{aspect-ratio:1/1;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:4px;display:flex;flex-direction:column;justify-content:space-between;cursor:pointer;font-size:11px;min-width:0;overflow:hidden;text-align:left}
.cal .day .n{font-weight:700;font-size:12px}
.cal .day .s{font-size:10px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal .day.under{background:var(--pine-soft);border-color:transparent}
.cal .day.over{background:var(--crimson-soft);border-color:transparent}
.cal .day.today{outline:2px solid var(--cobalt);outline-offset:-2px}
.cal .day.sel{border-color:var(--ink);border-width:2px}
.cal .day.future .n{color:var(--muted)}
.day-detail{margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted);margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}

details.plan>summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:10px}
details.plan>summary::-webkit-details-marker{display:none}
details.plan>summary .chev{margin-left:auto;transition:transform .2s}
details.plan[open]>summary .chev{transform:rotate(180deg)}
.rows{display:grid;gap:8px;margin:8px 0 4px}
.erow{display:grid;grid-template-columns:1fr 64px 110px 38px;gap:8px;align-items:center}
.erow.sav,.erow.fx{grid-template-columns:1fr 1fr 64px 110px 38px}
.erow.fx.annual{grid-template-columns:1fr 1fr 96px 110px 38px}
.erow.cat{grid-template-columns:34px 1fr 96px auto 38px}
.erow .input{padding:8px 10px;font-size:15px}
.erow input[type=color]{width:34px;height:34px;border:0;padding:0;background:none;border-radius:8px;cursor:pointer}
.col-head{display:grid;font-size:12px;color:var(--muted);gap:8px}
.col-head span.r{text-align:right}
.plan-sec{padding:14px 0;border-bottom:1px solid var(--line)}
.plan-sec:last-child{border-bottom:0;padding-bottom:0}
.plan-total{font-size:13px;color:var(--muted);text-align:right;margin-top:4px}
@media (max-width:560px){
  .erow.sav,.erow.fx{grid-template-columns:1fr 56px 100px 38px}.erow.fx.annual{grid-template-columns:1fr 84px 100px 38px}
  .erow.sav .acc,.erow.fx .acc{grid-column:1/-1;grid-row:2}
  .col-head.wide{display:none}
  .erow.cat{grid-template-columns:34px minmax(0,1fr) 38px}.erow.cat .limit{grid-column:2/3;grid-row:2}.erow.cat .potflag{grid-column:2/3;grid-row:3}
}

table.t{width:100%;border-collapse:collapse;font-size:14px;min-width:640px}
table.t th{text-align:right;font-weight:600;color:var(--muted);font-size:12px;padding:8px 10px;border-bottom:1px solid var(--line)}
table.t td{text-align:right;padding:9px 10px;border-bottom:1px solid var(--line)}
table.t th:first-child,table.t td:first-child{text-align:left}
table.t tr.total td{font-weight:800;border-bottom:0}
table.t tr.click{cursor:pointer} table.t tr.click:hover td{background:var(--surface-2)}
table.t td .nm{font-weight:600} table.t td .mt{font-size:12px;color:var(--muted)}

dialog{border:0;border-radius:18px;padding:0;background:var(--surface);color:var(--ink);width:min(520px,calc(100vw - 24px));max-height:calc(100vh - 40px)}
dialog.wide{width:min(680px,calc(100vw - 24px))}
dialog::backdrop{background:rgba(8,14,22,.55)}
.dlg{padding:20px;display:grid;gap:14px}
.dlg-foot{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.dlg-foot .btn.danger{margin-right:auto}
.dlg-sec{border-top:1px solid var(--line);padding-top:14px;display:grid;gap:10px}

/* ---------- collapsible boxes ---------- */

.dlg .facts .f{flex-wrap:wrap;gap:4px 12px}
.dlg .facts .f > :last-child{text-align:right;margin-left:auto}

.install-list{display:grid;gap:8px;margin-top:10px}
.inst{display:grid;gap:2px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;font-size:14px;line-height:1.5}
.inst.this{border-color:var(--pine);background:var(--pine-soft, rgba(31,122,92,.08))}

#updBar{position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 10px);z-index:70;display:flex;gap:8px;align-items:center;background:var(--ink);color:var(--surface);border-radius:14px;padding:8px 8px 8px 14px;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.2);max-width:calc(100vw - 24px)}
#updBar .btn.ghost{color:var(--surface)}
/* ---------- dialog titles keep their close button beside them ---------- */
.dlg > .panel-head{flex-wrap:nowrap;align-items:flex-start}
.dlg > .panel-head h2{min-width:0;flex:1 1 auto}
.dlg > .panel-head .btn.icon{flex:none}
/* ---------- income paid in advance ---------- */
.erow.inc .inc-next{grid-column:1/-1;margin:-2px 0 4px;font-size:13px;color:var(--muted)}
/* ---------- setup wizard rows: labelled fields ---------- */
.wiz-rows{display:grid;gap:12px;margin:4px 0 8px}
.wiz-row{display:grid;grid-template-columns:minmax(0,1fr) 130px 96px 34px;gap:8px;align-items:end;padding-bottom:12px;border-bottom:1px solid var(--line)}
.wf{display:grid;gap:4px;min-width:0}
.wf > span{font-size:12.5px;color:var(--muted);font-weight:600}
.wf-del{align-self:end;margin-bottom:4px}
@media (max-width:560px){
  .wiz-row{grid-template-columns:minmax(0,1fr) minmax(0,1fr) 34px}
  .wf-name{grid-column:1/3}.wf-del{grid-column:3;grid-row:1}
  .wf-amt{grid-column:1}.wf-day{grid-column:2}
}

   Text wraps between words. Only when a word really doesn't fit is it split at a syllable, with a hyphen,
   keeping at least 4 letters on each side (the browser's dictionary for the page language, German or English).
   Fonts are never made smaller just to avoid this. Addresses and codes may break anywhere. */
body{overflow-wrap:break-word;word-break:normal;-webkit-hyphens:auto;hyphens:auto;hyphenate-limit-chars:10 4 4;-webkit-hyphenate-limit-before:4;-webkit-hyphenate-limit-after:4}

code, .copyrow code, .mono{overflow-wrap:anywhere}
.btn{overflow-wrap:normal}
@media (max-width:400px){.paste-row{flex-direction:column}.paste-row > *{width:100%}}
/* ---------- 50/30/20 ---------- */
.split-bar{position:relative;display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--line);margin:6px 0 12px}

.split-bar b{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);opacity:.55}
.split-row{padding:8px 0;border-bottom:1px solid var(--line)}
.split-h{display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 12px;font-size:14px}
.split-h i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:0}
.split-items{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:4px;font-size:13px;color:var(--muted)}
.split-items em,.cat-all em{font-style:normal;font-size:11px;padding:0 5px;border-radius:5px;background:var(--surface-2);color:var(--muted)}
.split-cfg{margin-top:10px}.split-cfg summary{cursor:pointer;font-weight:600;font-size:14px}
.split-cfg-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:6px 14px;margin-top:8px}
.split-cfg-grid > b{grid-column:1/-1;margin-top:6px;font-size:13px}
.split-pick{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px}

.cat-all{display:grid;gap:6px;width:100%}

.ca > span:first-child{min-width:0}

.ca .small{text-align:right}

.qa-row.pay-row{display:flex;flex-wrap:wrap;gap:10px}

.qa-row.pay-row > .dmy, .qa-row.pay-row > input[type=date]{flex:0 0 176px}

.print-root .pk span{font-size:9px;color:#5B6775}
.print-root .two{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:start}
.print-root .three{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;align-items:start}
.print-root table{width:100%;border-collapse:collapse;font-size:10px}
.print-root th,.print-root td{text-align:right;padding:2.5px 4px;border-bottom:1px solid #E3E7E9}
.print-root th:first-child,.print-root td:first-child{text-align:left}
.print-root th{color:#5B6775;font-weight:600}

  html,body{background:#fff!important;padding:0!important;margin:0!important}

/* ---------- Year ---------- */
const wrappedReady = y => `${y}-12` < curMonth() || (String(y) === curMonth().slice(0, 4) && todayISO() >= `${y}-12-15`);
function viewYear() {
  const y = ui.year, keys = usedMonthsOfYear(y), agg = aggregate(keys), complete = `${y}-12` < curMonth();
  const fl = flowNodes(agg.flow), sk = keys.length ? sankeySVG(fl.nodes, fl.links, { height: fl.height }) : '';
  const rate = agg.income ? agg.saved / agg.income : 0, days = sum(agg.months, m => Math.min(m.N, m.cur));
  const rows = agg.months.map(cm => `<tr class="click" data-act="goto-month" data-key="${cm.key}"><td>${monthLabel(cm.key, 'long', false)}</td><td>${fmt(cm.income, { whole: true })}</td><td>${fmt(cm.fixed, { whole: true })}</td><td>${fmt(cm.saved, { whole: true })}</td><td>${fmt(cm.spent, { whole: true })}</td><td style="color:var(--pot)">${fmt(cm.drawn, { whole: true })}</td><td class="${cm.endBalance + (cm.cashGoal || 0) < 0 ? 'neg' : 'pos'}">${cm.closed ? fmt(cm.endBalance + (cm.cashGoal || 0), { whole: true, sign: true }) : '<span class="muted">open</span>'}</td><td>${cm.daysOver}</td></tr>`).join('');

  ${keys.length ? `
  ${wrappedReady(y) ? `<button class="wrapped-cta" data-act="wrapped" style="margin-bottom:16px">${ICONS.spark}<span><div class="t1">Your ${y} Wrapped</div><div class="t2">The year in money, story style.</div></span></button>` : ''}
  <div class="kpis k6">

    <div class="kpi"><div class="k">Spent from budget</div><div class="v">${fmt(agg.spent, { whole: true })}</div><div class="d">${fmt(agg.spent / Math.max(1, days))} a day</div></div>
    <div class="kpi"><div class="k">Paid from savings</div><div class="v" style="color:var(--pot)">${fmt(agg.drawn, { whole: true })}</div></div>
    <div class="kpi"><div class="k">Invested</div><div class="v pos">${fmt(agg.saved, { whole: true })}</div><div class="d">${(() => { const s = agg.months.map(savingsRate), sv = sum(s, x => x.saved), inc = sum(s, x => x.income), r = inc ? sv / inc : 0, g = goalFor(curMonth()); return `savings rate <b class="${r * 100 >= g - .05 ? 'pos' : 'warn'}">${pctTxt(r)}</b> · goal ${g}%`; })()}</div></div>
    <div class="kpi"><div class="k">Net to cash savings</div><div class="v" style="color:${agg.endBalance + (agg.cashGoal || 0) - agg.drawn < 0 ? 'var(--crimson)' : 'var(--pot)'}">${fmt(agg.endBalance + (agg.cashGoal || 0) - agg.drawn, { whole: true, sign: true })}</div><div class="d">goal savings and leftovers, minus savings spending</div></div>
  </div>
  <div class="panel"><div class="panel-head"><h2>Where the money went</h2><p class="sub">Every euro of the year so far, from where it came from to where it went.</p></div><div class="chart scroll-x min600">${sk}</div></div>

    <div class="legend">${(() => { const yc = {}; agg.months.forEach(m => { for (const [c, v] of Object.entries(m.flow?.billsMap || {})) yc[c] = (yc[c] || 0) + v; for (const [c, v] of Object.entries(m.byCat || {})) yc[c] = (yc[c] || 0) + v; }); return Object.entries(yc).sort((a, b) => b[1] - a[1]).slice(0, 7).map(([c]) => `<span><i style="background:${catById(c).color}"></i>${esc(catById(c).name)}</span>`).join('') + '<span><i style="background:#9AA3AD"></i>Other</span>'; })()}<span><i style="background:var(--pine)"></i>Invested</span><span><i style="background:var(--pot)"></i>Paid from savings</span><span><i style="background:var(--cobalt);height:3px"></i>Income</span></div></div>
  <div class="grid g2"><div class="panel"><div class="panel-head"><h2>Categories this year</h2></div>${catRows(agg.flow.byCat, agg.flow.byCatPot)}</div>

  : `<div class="empty">No months recorded in ${y}.</div>`}`;

function viewDebt() {

  return `<div class="page-head"><div><h1>Debt</h1><p class="sub">${fmt(total)} left to repay. Net worth ${fmt(w.net, { whole: true })} after debt, ${fmt(w.assets, { whole: true })} before.</p></div><div class="right"><button class="btn" data-act="debt-add">${ICONS.plus}Add a debt</button></div></div>
  ${ds.map(st => debtCard(st)).join('')}`;
}
function debtCard(st) {
  const fmtD = (v, o = {}) => fmt(v, { ...o, cur: st.d.cur || undefined });
  const d = st.d, sn = safetyNet(), chunks = st.needMonthly ? [3, 6, 12].filter(n => n <= st.monthsLeft).map(n => `${fmtD(st.needMonthly * n, { whole: true })} every ${n} months`) : [];
  const status = st.remaining <= 0 ? `<div class="status good">${ICONS.check}<span>Paid off. Well done.</span></div>`
    : st.needMonthly && !st.plan ? `<div class="status ${st.onTrack ? 'good' : 'warn'}">${st.onTrack ? ICONS.check : ICONS.info}<span>To be debt-free by ${fmtDate(d.target)}, you need ${fmtD(st.needMonthly)} a month on average${chunks.length ? `, for example ${chunks.join(' or ')}` : ''}. ${st.onTrack ? (st.ahead > 100 ? `You’re ${fmtD(st.ahead, { whole: true })} ahead of a steady schedule.` : 'You’re on schedule.') : `You’re ${fmtD(-st.ahead, { whole: true })} behind a steady schedule.`}${st.payoffMonth ? ` At your pace so far you’d finish around ${monthLabel(st.payoffMonth)}.` : ''}</span></div>`
    : st.plan && st.forecast.never ? `<div class="status bad">${ICONS.alert}<span>Your instalment of ${fmtD(st.plan.amount)} is less than the ${fmtD(st.forecast.monthlyInterest)} of interest added each month, so this debt keeps growing. Raise the instalment under Edit.</span></div>`
    : st.plan && st.forecast.payoffMonth ? `<div class="status good">${ICONS.check}<span>On your repayment plan you’re debt-free in ${monthLabel(st.forecast.payoffMonth)}. Extra one-off repayments bring that forward.</span></div>`
    : `<div class="status info">${ICONS.info}<span>Set a target date or a repayment plan under Edit to see when you’ll be debt-free${st.pace ? `. At your pace so far that’s around ${monthLabel(st.payoffMonth)}` : ''}.</span></div>`;
  return `<div class="grid g-wide">
    <div class="panel"><div class="panel-head"><h2>${esc(d.name)}</h2><span class="sub">${esc(d.note || '')}</span><button class="btn ghost right small" data-act="debt-edit" data-id="${d.id}">Edit</button></div>
      <div style="display:flex;gap:16px;flex-wrap:wrap;align-items:flex-end"><div><div class="sub">Left to repay</div><div style="font-family:var(--display);font-size:clamp(40px,8vw,60px);font-weight:800;letter-spacing:-.045em;line-height:1;color:#7A4E9E">${fmtD(st.remaining, { whole: st.remaining % 100 === 0 })}</div></div>
        <div class="sub" style="padding-bottom:6px">of ${fmtD(st.original, { whole: true })}, ${Math.round(st.pct * 100)}% paid off</div></div>
      <div class="comp" style="margin-top:14px"><i style="width:${(st.pct * 100).toFixed(2)}%;background:#7A4E9E"></i></div>
      ${status}
      ${debtTerms(st)}
      <div class="chart" style="margin-top:14px">${debtChart(st)}</div>
      <div class="legend"><span><i style="background:#7A4E9E;height:3px"></i>Balance</span>${st.plan && st.remaining > 0 ? '<span><i style="background:#7A4E9E;height:2px;opacity:.7"></i>With your repayment plan</span>' : ''}${d.target ? '<span><i style="background:var(--amber);height:2px"></i>Straight line to your target</span>' : ''}</div></div>
    <div><div class="panel"><h2>Record a repayment</h2>
      <div class="rows" style="margin-top:10px"><div class="qa-row pay-row"><input class="input money big" id="dpAmt-${d.id}" data-debt="${d.id}" inputmode="decimal" placeholder="0.00" aria-label="Amount"><input class="input" type="date" id="dpDate-${d.id}" value="${todayISO()}" aria-label="Date"></div>
        <div class="seg pot" role="group" id="dpFrom-${d.id}">${[['savings', 'From cash savings'], ['budget', 'From this month’s budget']].map(([v, l], i) => `<button data-act="dp-from" data-debt="${d.id}" data-dest="${v}" aria-pressed="${i === 0}">${l}</button>`).join('')}</div>
        <div id="dpPrev-${d.id}" class="facts"></div>
        <button class="btn primary" data-act="debt-pay" data-id="${d.id}">${ICONS.plus}Record repayment</button></div></div>
      <div class="panel"><h2>Repayments</h2>${st.pays.length ? txList([...st.pays].reverse(), false) : '<p class="sub">None yet. Each repayment you record lowers the balance and, if paid from savings, your cash savings.</p>'}</div></div>
  </div>`;
}
function debtTerms(st) {
  const fmtD = (v, o = {}) => fmt(v, { ...o, cur: st.d.cur || undefined });
  const f = st.forecast, rows = [];
  rows.push(['Interest', st.rate ? `${st.rate.toLocaleString('en-US', { maximumFractionDigits: 2 })}% a year, added monthly` : 'Interest-free']);
  if (st.rate && st.interestSoFar) rows.push(['Interest added since ' + fmtDate(st.d.base.date), fmtD(st.interestSoFar)]);
  if (st.plan) {
    rows.push(['Repayment plan', `${fmtD(st.plan.amount)} on the ${ord(st.plan.day || 1)} of each month, from ${monthLabel(st.plan.start || curMonth())}`]);
    if (st.next) rows.push(['Next instalment', `${fmtD(st.next.amount)} on ${fmtDate(st.next.iso)}`]);
    if (f.never) rows.push(['Heads up', `<span class="neg">The instalment doesn’t cover the ${fmtD(f.monthlyInterest)} monthly interest, so the balance would never go down.</span>`]);
    else if (f.months != null && st.remaining > 0) rows.push(['Paid off', `${monthLabel(f.payoffMonth)} (${f.months} instalment${f.months === 1 ? '' : 's'})${st.rate ? `, ${fmtD(f.interest)} more interest` : ''}`]);
  } else if (st.rate && st.remaining > 0) rows.push(['Costs you', `about ${fmtD(f.monthlyInterest)} a month in interest`]);
  return `<div class="facts" style="margin-top:12px">${rows.map(([k, v]) => `<div class="f"><span>${k}</span><span>${v}</span></div>`).join('')}</div>`;
}
function paintDebtPreview(id) {
  const box = $('#dpPrev-' + id); if (!box) return;
  const amt = parseAmount($('#dpAmt-' + id).value), from = $(`#dpFrom-${id} [aria-pressed="true"]`)?.dataset.dest || 'savings', st = debtStatus(state.debts[id]);
  if (!Number.isFinite(amt) || amt <= 0) { box.innerHTML = ''; return; }
  const sn = safetyNet(), rows = [['Left to repay', `${fmt(st.remaining)} → ${fmt(Math.max(0, st.remaining - amt))}`]];
  if (from === 'savings') { const after = sn.cash - amt, m = sn.need.total ? after / sn.need.total : 0; rows.push(['Cash savings', `${fmt(sn.cash)} → ${fmt(after)}`], ['Safety net', `${sn.months.toFixed(1)} → ${m.toFixed(1)} months`]); if (m < 1) rows.push(['Heads up', `<span class="warn">Less than a month of costs left in cash</span>`]); }
  else { const cm = computeMonth(curMonth()), left = cm.today ? cm.today.remAfter : cm.pool; rows.push(['Left in this month’s budget', `${fmt(left)} → ${fmt(left - amt)}`]); }
  if (amt > st.remaining) rows.push(['Note', `<span class="warn">More than the ${fmt(st.remaining)} left</span>`]);

}

<script>
'use strict';
/* =========================================================================
   Overview, savings rate, typical month, category trends and limits, Ways to save.
   ========================================================================= */
const pctTxt = r => `${Math.round(r * 1000) / 10}%`.replace('.0%', '%');
/* Average over up to the last 3 finished months (weighted by income), so one unusual month doesn't dominate. */
function avgSavingsRate(n = 3) {
  const st = state.settings.startMonth || curMonth(), rs = [];
  for (let i = 1; i <= 12 && rs.length < n; i++) { const k = addMonths(curMonth(), -i); if (k < st) break; if (state.months[k]) rs.push({ k, ...savingsRate(computeMonth(k)) }); }
  if (!rs.length) return null;
  const sv = sum(rs, r => r.saved), inc = sum(rs, r => r.income);
  const goal = goalFor(curMonth()), rate = inc ? sv / inc : 0;
  return { rate, months: rs.length, list: rs.reverse(), goal, met: rate * 100 >= goal - .05 };
}
function goalFor(key) { const g = [...(state.settings.savingsGoals || [])].filter(x => x.from <= key).sort((a, b) => a.from.localeCompare(b.from)).at(-1); return g ? Number(g.rate) || 0 : 20; }
/* Saved = plans + round-ups + debt repaid from income + what's left over (projected while the month is open) − spending paid from savings.
   All your accounts are one cash total, so the leftover is your cash saving. */
function savingsRate(cm) {
  const interest = sum(cm.tx.filter(t => t.type === 'in' && t.dest === 'savings'), t => t.amount);
  const ex = !cm.closed && cm.cur >= 1 ? expectedRest(cm) : null;
  const leftover = (cm.closed ? cm.endBalance : cm.cur < 1 ? cm.pool : cm.odds ? cm.odds.median : ex ? ex.end : 0) + (cm.cashGoal || 0);
  const income = cm.income + interest, debt = (cm.debtPlanned || 0) + (cm.debtBudget || 0);
  const saved = cm.planSaved + cm.roundUps + debt + leftover + interest - cm.drawn;
  const goal = goalFor(cm.key), rate = income > 0 ? saved / income : 0, target = Math.round(goal / 100 * income), met = saved >= target - 100;
  return { rate, saved, income, goal, target, met, gap: met ? 0 : target - saved, projected: !cm.closed, parts: { plans: cm.planSaved + cm.roundUps, debt, leftover, interest, drawn: cm.drawn } };
}
/* One-offs: single purchases far above your normal size (≥ €100 and ≥ 5× the month's median purchase). */
function oneOffs(cm) { const amts = cm.outs.filter(t => fundOf(t) === 'budget' && t.amount > 0).map(t => t.amount), med = median(amts) || 0; return cm.outs.filter(t => fundOf(t) === 'budget' && t.amount >= 10000 && t.amount >= med * 5); }
function typicalMonth() {
  const c = cache(); if (c.typ) return c.typ;
  const ck = curMonth(), st = state.settings.startMonth || ck, vals = [];
  for (let i = 1; i <= 6; i++) { const k = addMonths(ck, -i); if (k < st) break; if (!state.months[k]) continue; const cm = computeMonth(k); vals.push(cm.spent - sum(oneOffs(cm), t => t.amount)); }
  if (vals.length) return c.typ = { spend: Math.round(Math.max(median(vals), sum(vals) / vals.length)), months: vals.length, basis: 'finished months' };
  const cm = computeMonth(ck); if (cm.cur >= 7) { const ex = sum(oneOffs(cm), t => t.amount); return c.typ = { spend: Math.round((cm.spentElapsed - ex) / cm.cur * cm.N), months: 0, partial: true, oneOff: ex }; }
  return c.typ = { spend: Math.max(0, cm.pool), months: 0, budgetOnly: true };
}
/* Per category: projected month total vs your 3-month average, and vs an optional limit. */
function categoryTrends(cm) {
  const st = state.settings.startMonth || cm.key, prev = [1, 2, 3].map(i => addMonths(cm.key, -i)).filter(k => k >= st && state.months[k]).map(k => computeMonth(k));
  const scale = cm.closed ? 1 : cm.cur > 0 ? cm.N / Math.max(cm.cur, 7) : 0, out = {};
  const cats = new Set([...Object.keys(cm.byCat), ...state.settings.categories.filter(c => c.limit).map(c => c.id)]);
  for (const c of cats) {
    const spent = cm.byCat[c] || 0, proj = Math.round(spent * scale), avg = prev.length ? sum(prev, p => p.byCat[c] || 0) / prev.length : null, limit = catById(c).limit || null;
    let text = '', cls = '';
    if (limit) { text = proj > limit ? `on pace for ${fmt(proj, { whole: true })}` : `${fmt(Math.max(0, limit - spent), { whole: true })} left`; cls = proj > limit ? 'neg' : 'pos'; }
    else if (avg && avg >= 1000 && (cm.closed || cm.cur >= 10)) { const d = proj / avg - 1; if (Math.abs(d) >= .1) { text = `${d > 0 ? '+' : '−'}${Math.round(Math.abs(d) * 100)}% vs avg ${fmt(avg, { whole: true })}`; cls = d > .25 ? 'neg' : d < -.1 ? 'pos' : 'muted'; } }
    out[c] = { spent, proj, avg, limit, text, cls };
  }

}
/* Ways to save, from your own plan and entries. Donations, insurance and housing are never suggested. */
function waysToSave() {
  const out = [], p = state.months[curMonth()] || planFromRecurring(), kept = state.settings.waysKept || {}, seen = state.settings.billSeen || {};
  const bills = p.bills.filter(b => !['gifts', 'insurance', 'housing'].includes(groupOf(b)));

  if (el.dataset && el.dataset.goal) { const [i, f] = el.dataset.goal.split(':'), gs = [...(state.settings.savingsGoals || [])].sort((a, b) => a.from.localeCompare(b.from)); if (gs[+i]) { gs[+i][f] = f === 'rate' ? clamp(Number(el.value) || 0, 0, 100) : el.value || gs[+i].from; state.settings.savingsGoals = gs; touchSettings(); persist(); render(); } }
  if (el.dataset && el.dataset.limit) { const c = state.settings.categories.find(x => x.id === el.dataset.limit); if (c) { const v = parseAmount(el.value); c.limit = Number.isFinite(v) && v > 0 ? v : null; touchSettings(); persist(); render(); } }
});
</script>
<script>

/* =========================================================================

   ========================================================================= */
const LAYOUT_KEY = 'ledgerline:layout';
const Layout = { order: (() => { try { return JSON.parse(localStorage.getItem(LAYOUT_KEY) || '{}'); } catch { return {}; } })(), editing: false };
const saveLayout = () => { try { localStorage.setItem(LAYOUT_KEY, JSON.stringify(Layout.order)); } catch { } };
/* A stable name for a block: a box is named by its title; a row by the boxes inside it; anything else by its kind. */
function blockKey(el, i) {
  if (el.dataset.pkey) return el.dataset.pkey;
  const inner = [...el.querySelectorAll(':scope > .panel[data-pkey], :scope > div > .panel[data-pkey]')].map(p => p.dataset.pkey);
  if (inner.length) return 'row[' + inner.join('|') + ']';

const containers = () => { const main = $('#main'); return main ? [main, ...$$('#main > .grid, #main > .set-cols')] : []; };
function applyLayout() {

    kids.forEach((el, i) => { el.dataset.bkey = blockKey(el, i); });

    bar.addEventListener('click', ev => { ev.preventDefault(); ev.stopPropagation(); });
    const host = el.tagName === 'DETAILS' && el.querySelector(':scope > summary') ? el.querySelector(':scope > summary') : el;

  }
}
function saveOrder(parent) { Layout.order[parent.dataset.lkey] = [...parent.children].map(c => c.dataset.bkey).filter(Boolean); saveLayout(); }
function moveBlock(el, dir) {
  const parent = el.parentElement, sibs = [...parent.children].filter(c => c.dataset.bkey), i = sibs.indexOf(el), j = i + dir;
  if (j < 0 || j >= sibs.length) { toast(dir < 0 ? 'Already at the top.' : 'Already at the bottom.'); return; }
  if (dir < 0) parent.insertBefore(el, sibs[j]); else parent.insertBefore(el, sibs[j].nextSibling);
  saveOrder(parent); el.classList.add('moved'); setTimeout(() => el.classList.remove('moved'), 500);
  const r = el.getBoundingClientRect(); if (r.top < 80 || r.top > innerHeight - 120) window.scrollBy({ top: r.top - 120, behavior: 'smooth' });
}
function startDrag(e) {
  // During the drag only a placeholder moves; the box itself moves when you let go. Moving the element under a finger
  // makes Safari on iPhone cancel the gesture, which is why dragging used to stop after the first step there.
  e.preventDefault(); e.stopPropagation();
  const h = e.currentTarget, blk = h.closest('[data-bkey]'), parent = blk.parentElement;
  const isGrid = parent.classList.contains('grid') && getComputedStyle(parent).gridTemplateColumns.split(' ').length > 1;
  const ph = document.createElement('div'); ph.className = 'drop-ph' + (isGrid ? ' in-grid' : ''); ph.style.minHeight = Math.min(blk.offsetHeight, 90) + 'px';
  blk.classList.add('dragging'); parent.insertBefore(ph, blk.nextSibling);
  let raf = 0, lastY = e.clientY, lastX = e.clientX, done = false;

        const before = isGrid ? lastX < r.left + r.width / 2 : lastY < r.top + r.height / 2;
        const ref = before ? s : s.nextSibling; if (ref !== ph && ph.nextSibling !== (before ? s : s.nextSibling)) parent.insertBefore(ph, ref); break;
      }
    }
    if (!raf) raf = requestAnimationFrame(function scroll() { raf = 0; const m = 70; if (lastY < m) { window.scrollBy(0, -12); raf = requestAnimationFrame(scroll); } else if (lastY > innerHeight - m) { window.scrollBy(0, 12); raf = requestAnimationFrame(scroll); } });
  };
  const pmove = ev => { lastY = ev.clientY; lastX = ev.clientX; place(); };
  const tmove = ev => { const t = ev.touches[0]; if (!t) return; ev.preventDefault(); lastY = t.clientY; lastX = t.clientX; place(); };
  const up = () => {
    if (done) return; done = true;
    window.removeEventListener('pointermove', pmove); window.removeEventListener('pointerup', up); window.removeEventListener('pointercancel', up);
    window.removeEventListener('touchmove', tmove); window.removeEventListener('touchend', up); window.removeEventListener('touchcancel', up);
    cancelAnimationFrame(raf); parent.insertBefore(blk, ph); ph.remove(); blk.classList.remove('dragging');
    saveOrder(parent);
  };
  if (e.pointerType === 'touch') { window.addEventListener('touchmove', tmove, { passive: false }); window.addEventListener('touchend', up); window.addEventListener('touchcancel', up); }
  else { window.addEventListener('pointermove', pmove); window.addEventListener('pointerup', up); window.addEventListener('pointercancel', up); }
}
Object.assign(ACTIONS, {
  'layout-edit': () => { Layout.editing = true; render(); toast(L2('Drag ⠿ or use the arrows to move boxes. Tap Done when finished.', 'Zieh an ⠿ oder nutze die Pfeile, um Boxen zu verschieben. Tippe auf Fertig, wenn du fertig bist.')); },
  'layout-done': () => { Layout.editing = false; render(); },
  'layout-reset': () => { for (const k of Object.keys(Layout.order)) if (k.startsWith(ui.view + '::')) delete Layout.order[k]; saveLayout(); render(); },
});
</script>
<script>
'use strict';
/* =========================================================================
   Date fields always show day/month/year. A browser's built-in date box follows the
   computer's region setting (often month/day/year), so each one is shown as a text box
   in DD/MM/YYYY with a calendar button; the original box stays underneath and keeps the value.
   ========================================================================= */
const DATE_PROTO = Object.getOwnPropertyDescriptor(HTMLInputElement.prototype, 'value');
function parseDMY(t) {
  const m = /^\s*(\d{1,2})[./\-\s](\d{1,2})[./\-\s](\d{2}|\d{4})\s*$/.exec(t || ''); if (!m) return null;
  const d = +m[1], mo = +m[2], y = m[3].length === 2 ? 2000 + +m[3] : +m[3];
  const dt = new Date(y, mo - 1, d); if (dt.getMonth() !== mo - 1 || dt.getDate() !== d) return null;
  return `${y}-${pad2(mo)}-${pad2(d)}`;
}
function enhanceDate(inp) {
  if (inp.dataset.dmy) return; inp.dataset.dmy = '1';
  const wrap = document.createElement('span'); wrap.className = 'dmy';
  const txt = document.createElement('input'); txt.type = 'text'; txt.className = inp.className.replace(/\bbig\b/, ''); txt.inputMode = 'numeric'; txt.placeholder = 'DD/MM/YYYY'; txt.setAttribute('aria-label', inp.getAttribute('aria-label') || 'Date (day/month/year)'); txt.autocomplete = 'off';
  const cal = document.createElement('span'); cal.className = 'dmy-cal'; cal.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15.5" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>';
  inp.parentNode.insertBefore(wrap, inp); wrap.append(txt, cal); cal.appendChild(inp);
  inp.classList.add('dmy-native'); inp.tabIndex = -1;
  const show = () => { const v = DATE_PROTO.get.call(inp); txt.value = v ? fmtDate(v) : ''; };
  // keep the text box in step when code sets the date (e.g. "Yesterday" buttons)
  Object.defineProperty(inp, 'value', { configurable: true, get() { return DATE_PROTO.get.call(inp); }, set(v) { DATE_PROTO.set.call(inp, v); show(); } });
  show();
  inp.addEventListener('input', show); inp.addEventListener('change', show);
  txt.addEventListener('change', () => {
    const iso = parseDMY(txt.value);
    if (txt.value.trim() && !iso) { txt.classList.add('bad'); toast('Enter the date as day/month/year, e.g. 05/10/2026.'); return; }
    txt.classList.remove('bad'); DATE_PROTO.set.call(inp, iso || ''); show();
    inp.dispatchEvent(new Event('input', { bubbles: true })); inp.dispatchEvent(new Event('change', { bubbles: true }));
  });
}
const enhanceDates = root => (root.querySelectorAll ? root.querySelectorAll('input[type="date"]:not([data-dmy])') : []).forEach(enhanceDate);
new MutationObserver(ms => { for (const m of ms) for (const n of m.addedNodes) if (n.nodeType === 1) { if (n.matches?.('input[type="date"]')) enhanceDate(n); else enhanceDates(n); } }).observe(document.body, { childList: true, subtree: true });
enhanceDates(document);
</script>
<script>
'use strict';
/* =========================================================================
   Manual page. The same text is in MANUAL.md in the repository, so an AI assistant can read it too.
   ========================================================================= */
const MANUAL_MD = "# Ledgerline manual\n\n*Version 2026-10-08 · 77. This manual is updated together with every new version of the app; the version number in **Settings → Backup & export** should match.*\n\nLedgerline is your personal budget and wealth app. It is one web page (`index.html`) hosted on GitHub Pages, plus a small price updater that runs on GitHub. Your entries never leave your devices except as an encrypted sync file in your own GitHub account.\n\nThis manual has two parts. Sections 1 to 11 are step-by-step instructions for you. Section 12 is a technical description for an AI assistant or a developer who works on the app.\n\n## 1. What lives where\n\nYour GitHub repository (`aaron-sn01/ledgerline`) contains:\n\n- `index.html`: the whole app.\n- `MANUAL.md`: this manual.\n- `fetch_prices.py`: downloads ETF prices from Yahoo Finance.\n- `fetch_compositions.py`: downloads what each ETF holds (sectors and countries), once a month.\n- `tickers.json`: the list of ETFs the updater fetches.\n- `.github/workflows/update-prices.yml`: tells GitHub when to run the two scripts.\n- `prices.json` and `compositions.json`: written by the updater. Never edit these by hand.\n\nYour data (entries, plan, holdings, debts, settings) is stored inside the app on each device. If sync is on, an encrypted copy is kept in a private GitHub Gist. The app's code contains **no personal data**: a new device starts empty (with a welcome note) and gets your data when you connect sync or restore a backup. Because the repository is public, nothing personal should ever be written into `index.html` or the other files.\n\n## Installing the app\n\nLedgerline is a web page that you install like an app, so it opens full screen with its own icon:\n\n- **iPhone**: open the link in **Safari** → tap **Share** (the square with an arrow) → **Add to Home Screen** → **Add**. Open it from the new icon.\n- **iPad**: in **Safari**, tap **Share** at the top right → **Add to Home Screen** → **Add**.\n- **Mac**: in **Safari** (macOS 14 or later), menu **File → Add to Dock** → **Add**. In **Chrome**: **⋮** → **Cast, save and share** → **Create shortcut…**, tick **Open as window** → **Create**.\n- **Windows**: in **Edge**, **⋯** → **Apps** → **Install this site as an app** → **Install**. In **Chrome**: **⋮** → **Cast, save and share** → **Create shortcut…**, tick **Open as window** → **Create**. Then pin it to the taskbar from the Start menu.\n- **Android**: in **Chrome**, **⋮** → **Add to Home screen** (or **Install app**).\n\nThe installed app keeps its **own data**, separate from the same page in a browser tab. Set it up in the installed app, and use sync or a backup to move data between them. The same steps are under **Settings → Install the app**, which highlights the device you're on.\n\n**Do I need a GitHub account?** Only for sync between your own devices and for the Apple Pay automation. Everything else works without one; your data then simply lives on that one device (move it with **Download backup** and **Restore from backup**).\n\n## 2. Everyday use\n\n1. **Add spending** on the Today page: type a name and amount. Ledgerline suggests a category (it knows common shops and services in Germany, Austria, the UK, the UAE, Oman, Singapore and Canada); tap another one if it's wrong. It learns from every correction.\n2. **Import instead of typing**: tap **Import** and choose screenshots or PDF statements (Trade Republic, Scalable Capital, Sparkasse, comdirect, Wise, Finanzguru, flatex, Coinbase). Check the review list, untick what you don't want, then tap **Add selected**.\n   - **Trade Republic screenshots**: the transaction list (anything under \"Upcoming\" is skipped, because it hasn't happened yet; the weekly saveback and round-up entries are counted) or **one opened payment** (useful for a single purchase; its \"Benefits\" are left out, because Trade Republic pays saveback and round-ups together once a week and the list shows that weekly entry).\n   - **Sparkasse screenshots**: the account list, or **one opened payment** (\"Umsatzdetails\"): name, amount, booking date and reference are read. If it's one of your fixed costs (for example your phone bill from Telefonica, which is O2), it's recognised and skipped, because the plan already counts it.\n   - **Scalable Capital screenshots**: open a fund (\"Ihre Position\") for its exact share count; the Tagesgeld screen (\"Guthaben\") for its balance; the portfolio overview updates funds you already have from their value (it shows no share counts, so for new funds use the fund screen).\n   - **More screens**: Scalable transaction lists (plan purchases that match a plan in Ledgerline are recognised and skipped, with the shares bought shown; purchases from a plan Ledgerline doesn't know yet are shown unticked to add, and after two months of the same purchase the Overview suggests adding the plan; deposits and withdrawals are transfers; interest and dividends are counted), comdirect transaction lists and the comdirect account overview (balances, checked against \"Gesamt\"), the Sparkasse home screen, the **Wise** home screen (weekdays like \"Dienstag\" become the most recent such date; top-ups count as transfers), and **Finanzguru** (\"Alle Buchungen\"; its category is used for names Ledgerline doesn't know yet). Finanzguru already collects the payments of your connected banks, so import either Finanzguru or those banks for the same period: Ledgerline removes the duplicates it recognises and shows a note if you combine them.\n   - **Dark mode** screenshots work as well as light ones. Money in is also recognised by its colour (green or turquoise), so a minus sign the text recognition misses can't turn spending into income. Anything unclear (an unreadable amount or date) is marked in the review for you to check.\n   - **Matching funds by name** (screenshots carry no ISIN): Ledgerline compares the words that tell funds apart and ignores provider and share-class words (Core, UCITS ETF, Acc, EUR …); abbreviations like EM or WLD are understood. A rough match is enough (\"Core Stoxx Europe 600 EUR (A…\" = Amundi Core Stoxx Europe 600), but different indices stay apart (MSCI World ≠ Emerging Markets ≠ World Information Technology), and so does the same index from two different providers. If no holding fits, choose it yourself in the review.\n   - **Account balances**: a balance shown in a screenshot (Sparkasse \"Kontostand am\", Scalable \"Guthaben\") appears in the review under **Account balances**; tick it to save it as that account's balance (Cash savings → Update balance).\n   - **Duplicates**: an entry that's already in Ledgerline, or that appears in two of the files you import, is unticked with a note saying which entry it matches. Repeated purchases (several €3.00 tickets) are counted separately: each entry can only match one other, payments in the same file never count as duplicates, and different times of day (Apple Pay) mean different payments. If something is unticked wrongly, tick it.\n   - **Paste instead of saving**: take a screenshot, tap its thumbnail, then **Done → Copy and Delete**. In Ledgerline tap **Import → Paste screenshot** (if the iPhone asks, tap **Allow Paste**). If the button doesn't work, tap the dashed box next to it and choose **Paste**. On a Mac, ⌘V works while the Import window is open.\n3. **Browse days**: the app always opens on the Overview, also when you come back to it after more than 10 minutes (shorter trips to another app keep your place). On Today, use the arrows next to the date to see earlier or later days. New entries go on the day you're looking at.\n4. **Monthly review**: opens by itself after a month ends. Correct share counts and your cash total there.\n5. **Apple Pay, automatically**: set up the Shortcuts automation once (**Settings → Apple Pay automation**, steps below) and every Apple Pay payment you make at a card terminal (iPhone or Watch held to the reader) arrives in Ledgerline by itself, either for you to confirm or added straight away. Online and in-app Apple Pay isn't included.\n6. **Undo**: after deleting something or importing, an **Undo** button appears for a few seconds.\n7. **Help**: every box has a **?** next to its title that explains what it shows.\n8. **Tour**: **Settings → Backup & export → Take the tour** (or **More → Take the tour** on iPhone) walks through the app in 11 stops, including where to enter your fixed costs and the Apple Pay automation. \"Look around first\" in the setup wizard runs it on sample data; **Set up my own** clears the sample data and starts the setup.\n9. **Setup help for your AI**: on the Manual page and in **Settings → Backup & export**. A text to give ChatGPT, Claude or similar; it guides you through installing, sync and the Apple Pay automation one step at a time, and never asks for your token, passphrase or bank data.\n10. **What's new**: after each update, a short note lists the changes once.\n11. **Back up**: after each monthly review, go to **Settings → Backup & export → Download backup** and keep the file in iCloud Drive or similar.\n\n### Setting up the Apple Pay automation (iPhone, once)\n\n**You need:** iOS 17 or later, your card in Apple Wallet, and sync working on the iPhone (section 9). The same steps are in the app under **Settings → Apple Pay automation** (type \"Apple Pay\" in the Settings search box), with buttons to copy the two values you need. Keep that page open while you work in Shortcuts.\n\n**In Ledgerline**\n\n1. Go to **Settings → Apple Pay automation**. Choose **Ask me to confirm** or **Add straight away**.\n2. Note the two values there: the **web address** (ending in `/comments`) and the **Authorization** value (starting with `Bearer`). You'll copy each one when needed.\n\n**In the Shortcuts app**\n\n1. Open **Shortcuts** and tap **Automation** in the bar at the bottom (not \"Shortcuts\"). Tap **+** at the top right (or **New Automation**).\n2. A list of triggers appears (Time of Day, Alarm, Email, …). Scroll down and tap **Transaction**, the one with the Wallet icon (\"When I tap my card\"). If you see actions such as *Open Card*, *Request Payment* or *Send Payment* instead, you're adding an action to a shortcut, not creating an automation: close it and start again from the Automation tab.\n3. Under **Card**, select the card(s) you pay with. Leave Merchant and Category as they are. Choose **Run Immediately**; switch off **Notify When Run** if you prefer. Tap **Next**.\n4. Tap **New Blank Automation**, then **Add Action**. Search for **Get Contents of URL** and tap it.\n\n   *On newer iOS versions* the automation opens as a shortcut beginning with **\"When Any Card is tapped\"**, followed by Categories, Merchants and switches for **Automation** (leave on) and **Notify**. That is the right screen. Tap **Any Card** to pick your card if you like, then add the action with the **Search** box at the bottom. There, the payment details are called **Transaction** or **Shortcut Input**; use whichever appears in steps 10 and 11. When finished, tap the back arrow at the top left to save.\n5. Tap the blue word **URL** and paste the web address from Ledgerline.\n6. Tap the small arrow **›** next to it. Set **Method** to **POST**.\n7. Under **Headers**, tap **Add new header**. Key: `Authorization`. Text: paste the Authorization value from Ledgerline.\n8. Under **Request Body**, choose **JSON**, tap **Add new field → Text**, and type `body` as the key.\n9. In the value box type `ledgerline|` (on the iPhone keyboard the `|` is under **123 → #+=**).\n10. In the bar above the keyboard tap **Shortcut Input**. Tap the inserted bubble and choose **Amount**.\n11. Type `|`, insert **Shortcut Input** again, tap it and choose **Merchant**. The value now reads `ledgerline|Amount|Merchant`.\n12. Tap **Done**.\n13. Tap **▶** once. When iOS asks whether the shortcut may connect to **api.github.com**, tap **Allow** (or **Always Allow**). Without this, the automation fails silently when it runs on its own. The test run arrives without an amount; Ledgerline lists it as unreadable and removes it with one tap.\n\n**Online and in-app Apple Pay** don't trigger the automation: iOS only offers it for tapping your iPhone or Watch at a terminal. Add online purchases with quick-add, or let the monthly statement import catch them.\n\n**Test it**: pay for something small with Apple Pay at a shop terminal, then open Ledgerline. A banner shows the payment, or it's already added. Running the automation by hand doesn't work, because without a real payment there's no amount or shop.\n\n**Checking what arrived**: **Check for payments now** in Ledgerline shows the time of the last check, how many payments are waiting, and anything that arrived without an amount (with a sample of what came in). To test only the connection, tap ▶ in the automation: Shortcuts then shows GitHub's answer (a block of text with an `\"id\"` means it worked; \"Bad credentials\" or \"Not Found\" mean the token or address is wrong). A hand-run arrives without an amount, which Ledgerline lists as unreadable; remove it with one tap.\n\n**If nothing arrives**: in the **iPhone’s Settings app** (not Ledgerline’s) open **Apps → Wallet** and turn on **Mobile Data**; check the automation still says **Run Immediately**; use **Check for payments now** in Ledgerline; and if you ever replace your GitHub token, paste the new one into the automation as well. While a payment waits for Ledgerline it sits unencrypted on your sync file (amount and shop only), and it's deleted as soon as it's picked up.\n\n## Sharing Ledgerline with friends and family\n\nAnyone can use Ledgerline through your link (https://aaron-sn01.github.io/ledgerline/). Their data stays on their own devices; nobody sees anyone else's, including you.\n\n1. Send them the link: https://aaron-sn01.github.io/ledgerline/. They install it as described in **Installing the app** above (iPhone, iPad, Mac, Windows, Android).\n2. The **setup wizard** opens the first time: name, currency, monthly income, fixed costs, investment plans, cash and savings goal. Every step can be skipped; everything can be changed later in Settings (**Settings → Backup & export → Run the setup again** reopens it).\n3. For sync between their own devices and the Apple Pay automation, they need **their own** free GitHub account and token (sections 9 and 2); nobody can use someone else's. Without GitHub everything else works on one device.\n4. When you upload a new version, they get it automatically the next time they open the app. Their data is upgraded on first launch, like yours.\n5. ETF prices come from your `tickers.json`. If someone holds a fund that isn't listed, add it (section 5) or they enter its price by hand.\n\n### Banks Ledgerline doesn't know yet\n\nThe importer has dedicated readers for Trade Republic, Scalable Capital, Sparkasse, comdirect, Wise, Finanzguru, flatex and Coinbase, plus other bank lists with date headings. For any other bank it makes a best effort: every line with a date and an amount is offered in the review, marked \"layout not known yet: please check each line\". Check direction (spent or received), amount and name before adding. To get a proper reader for a bank, send a sample screenshot or PDF with personal details blacked out to whoever maintains the app; it's added in the next update, for everyone with that bank.\n\n### Privacy and security\n\n- **Stored on the device only**, in the browser's storage. There is no Ledgerline server or account; whoever shared the app can't see anyone's data.\n- **Not encrypted on the device itself**; it's protected by the device lock. Add Face ID, Touch ID or a PIN under **Settings → App lock** for extra protection.\n- **Sync is optional and end-to-end encrypted** with your passphrase before it reaches your own GitHub account. Lose the passphrase and the sync copy can't be recovered.\n- **Imports are read on the device**; files are never uploaded. The reading tools are downloaded once from public code servers (cdnjs, jsDelivr).\n- **Prices** come from a public GitHub file and CoinGecko. These requests contain no personal data, but like any web request they reveal your internet address.\n- **Apple Pay automation** (optional): amount and shop name wait unencrypted in your own GitHub sync file briefly, then are deleted.\n- **Backups are your job**: clearing browser data or removing the home-screen app deletes the data on that device.\n- **Trust**: the code is public. Updates come from whoever maintains the app.\n\nThe same text is shown in the setup wizard and under **Settings → Backup & export**.\n\n## 3. Updating the app to a new version\n\n1. Download the new `index.html`.\n2. In your repository, click **Add file → Upload files**, drop the file in (the name must be exactly `index.html`) and click **Commit changes**.\n3. Open the **Actions** tab and wait for **pages build and deployment** to show a green tick (1 to 2 minutes, longer if GitHub is busy).\n4. The app notices the new version by itself (when it opens, when you return to it, and every 30 minutes) and shows **New version available → Reload**. If it doesn't, press ⌘R on the Mac, or quit the app fully (⌘Q, or swipe it away on iPhone) and open it again. Never remove the app from the Dock or home screen to update it: that deletes its data on that device.\n\nYour data carries over automatically. New versions upgrade old data on first launch.\n\nTo change any other file (for example `tickers.json`): open the file on GitHub, click the **pencil** icon, edit, then **Commit changes**.\n\n## 4. Prices\n\n- ETF prices update every 2 hours on weekdays between 09:23 and 23:23 German time. Nothing updates at night or on weekends because exchanges are closed.\n- **Refresh prices** on the Wealth page checks for a newer price file; it can't make GitHub fetch new prices sooner.\n- To fetch now: **Actions → Update prices → Run workflow**. A run by hand also refreshes the ETF compositions.\n- Ethereum and other crypto prices come live from CoinGecko.\n- If a price shows \"—\": open **Settings → Price updater**, which lists any fund the last run failed for. Check that fund's Yahoo symbol in `tickers.json`.\n\n## 5. Adding a new investment\n\n### An ETF, stock or bond ETF with automatic prices\n\n1. Find its **Yahoo Finance symbol**. For Xetra listings it usually ends in `.DE` (for example `EUNL.DE`). Search the ISIN on finance.yahoo.com to find it.\n2. In Ledgerline: **Wealth → Add holding**. Choose **ETF or stock**, then enter the name, ISIN, Yahoo symbol, broker and number of shares. Pick the **asset class** (Stocks, Bonds, Real estate, and so on).\n3. On GitHub, edit `tickers.json` and add a line inside the list, separated from the others by a comma:\n\n   ```\n   { \"symbol\": \"VAGF.DE\", \"isin\": \"IE00BG47KH54\", \"name\": \"Vanguard Global Aggregate Bond\" }\n   ```\n\n4. Run the workflow by hand (section 4) so the price appears straight away.\n5. Optional, for the sector and country charts (stocks only): iShares and Xtrackers funds can get automatic compositions. Copy an existing iShares or Xtrackers entry in `tickers.json` and adjust it. Without this, the fund still counts in Asset types but shows as \"Not known\" in sectors and countries.\n\n### Crypto\n\n**Add holding → Crypto**, then enter the CoinGecko id (the word in the CoinGecko web address, for example `bitcoin`). Prices come automatically.\n\n### Anything without an automatic price (private equity, a pension, a property share)\n\n**Add holding → Other investment** or **Private equity**, and enter the price yourself. Update the price when you get a new statement, or import the statement.\n\n### A new asset class\n\nIn the holding dialog, choose **Asset class → + New asset class…** and type a name. It appears as its own slice in Asset types and gets a cautious default return assumption in the projection.\n\n### Savings plans\n\n**Settings → Recurring plan → Investment plans**: add the plan, link it to the holding and set the day of the month. Ledgerline then adds the shares automatically each month.\n\n## 6. Changing your plan and settings\n\n- **Income, fixed costs, annual costs, investment plans**: **Settings → Recurring plan**. A change there applies straight away to the current month and every month after it that's already prepared, item by item; whatever you changed for one month only (Month → Edit this month's plan) stays as it is. Past months never change. Set the real deduction day of each item; the cash outlook and the budget use it. To change one month only, use **Month → Edit this month's plan**.\n- **Plan suggestions from your imports**: when imported statements show an income or fixed cost arriving on a clearly different day than your plan says (more than a week apart, three months in a row, each time within a week of the same day), or at a steady different amount, the Overview suggests updating the plan: **Change** updates it from this month on, **Keep** leaves it and doesn't ask again for that day or amount. Day-to-day shifts from weekends and bank holidays are ignored.\n- **Share counts from savings plans**: Ledgerline estimates each plan purchase as plan amount ÷ that day's price. When an import shows the shares actually bought (Scalable transaction lists, broker statements), that exact number replaces the estimate for that month, so the share count in Wealth matches your broker.\n- **Regular payments not in your plan**: after three payments to (or from) the same name, with the same amount and a steady rhythm (every week, every two weeks or every month), the Overview offers to add it to the plan: as a fixed cost or an income, from next month (this month already has the payments as entries). The plan works month by month, so a weekly payment is added as its monthly equivalent (amount × 52 ÷ 12); the single payment is remembered so later imports still recognise it.\n- **Income paid in advance** (for example a stipend paid on the 29th for the following month): enter the real payment day and tick **Paid in advance**. It counts for the month it's meant for, Ledgerline expects it on that day of the month before, and from the moment it arrives it's kept aside for next month instead of being counted as savings. Imports recognise such a payment as next month's planned income. If the timing changes later, change the item and apply it from that month onward.\n- **Savings-rate goal**: **Settings → Savings-rate goal**. Add a goal change from a given month (for example 20% from 03/2027). The switch below it decides whether the cash part of the goal is set aside before your spending budget.\n- **Spending categories**: **Settings → Categories**. Add, rename, recolor or delete them. The amount box next to each is an optional monthly limit; leave it empty for none.\n- **Categories** (Settings → Categories) are by **type of spending** and are used for both day-to-day spending and fixed costs: an annual tram pass is *Transport · fixed*, a single ticket *Transport*, Netflix *Media & streaming · fixed*. \"Fixed\" is a property of an item, not a category. Pick each fixed cost's category in the plan.\n- **50/30/20** (Month page), based on the rule of thumb: all spending of the month, fixed costs included, sorted into **needs** (target 50% of income) and **wants**; whatever of the income isn't spent counts as **saved** (investment plans, cash savings, debt repayment). The saved target is **your savings-rate goal** from Settings, and wants get what remains, so with a 15% goal the box reads **50/35/15** and follows any change of the goal. Fixed costs count by their group, so a subscription is a want even though it's fixed; day-to-day spending counts by category, and for the current month includes what's still expected. The box also shows **housing as a share of income** (rule of thumb: up to 30%). Under **What counts as a need?** set each fixed-cost group and category to Need or Want. On the **Year** page the same box covers the year so far. For the current month it shows **so far** and **projected**; the projection uses your usual spending mix and leaves out one-off big purchases (like an annual pass).\n- **Fixed costs in charts**: the month-by-month bars (Year page) show the year's 7 biggest categories in their own colours plus \"Other\"; tap or hover over a colour for the category, amount and share of that month. **By category** (Month) and **Categories this year** (Year) include fixed costs (darker part of each bar) with a donut chart; untick **With fixed costs** to see day-to-day spending only.\n- **Ways to save** (Overview) is recalculated from your plan and entries every time: several fixed costs of the same kind (two phone contracts, three streaming services, two gyms), price increases, each streaming or app subscription, yearly costs that renew within 45 days, bank and card fees, the same small purchase 5+ times in 30 days, food delivery, categories well above your usual, and card payments that look recurring. Housing, insurance and donations are never suggested. **Keep** hides a suggestion.\n- **Details on tap or hover**: charts that split spending, income or money flows show details when you tap (iPhone, iPad, Surface) or hover (Mac, PC): the day, category or month with its amount and share. Charts that already show every number (money-flow diagram, 50/35/15, the category list next to the donut) don't need it.\n- **Automatic backup on your Mac** (Settings → Backup & export → Automatic backup on your Mac): with sync on, a monthly Shortcuts automation on the Mac saves your **encrypted** sync file into a folder, replacing the previous copy (one file, no pile-up). The dialog shows the address to copy and the steps: Shortcuts app → new shortcut with **Get Contents of URL** (the address) and **Save File** (Ask Where to Save off, subpath `Ledgerline/ledgerline-backup.json`, Overwrite If File Exists on) → run once → **Automation** tab → **Time of Day**, **Monthly**, **Run Immediately**. To restore: **Restore from backup**, choose the file, enter your sync passphrase. Without the passphrase the file can't be opened, by you or anyone else. GitHub also keeps every earlier version of the sync file.\n- **Security**: your sync file is encrypted on your device (AES-256, key from your passphrase). On the device the data is protected by the device's own lock. The two reading tools for screenshots and PDFs are checked against their published fingerprints before they run, and a security rule in `index.html` only lets the app contact GitHub, CoinGecko, the ECB rates service and the reading tools' servers. Turn on two-factor authentication for your GitHub account.\n- **Links inside the app**: wherever a text says where to go (\"Settings → Recurring plan\", \"Wealth → Cash savings\"), tap it to jump straight to that box, which is briefly highlighted. In a help popup, \"Manual\" opens the matching part of this manual.\n- **Month outlook**: \"Day-to-day spending still to come\" is a forecast for the remaining days (for example about €29 a day × 23 days left), not what you've spent so far. \"Likely to savings\" and the projected savings rate build on it. One-off big purchases (at least €100 and at least five times your usual purchase, like a yearly ticket) are counted once but not projected onto the remaining days. \"Invested\" shows what's been invested so far, with the plans still to come listed below it.\n- **Wealth over time**: choose 1M, 3M, 6M, 1Y or All. The summary above the chart counts only from the day you started tracking. Anything earlier (the dashed line) is an estimate made from your current holdings at past prices, so it shows how the market moved, not how much you actually had.\n- **Language**: English or German, under **Settings → Budget → Language** (also offered on the wizard's first screen). German shows dates as 06.10.2026, decimals with a comma, and can switch numbers to 1.234,56 €. Default names (categories, asset classes, fixed-cost groups) switch language too; names you chose yourself stay as they are. The Manual page shows the German version.\n- **Finding a setting**: use the search box or the group buttons (Plan, Money, Investments, Devices, Advanced) at the top of Settings.\n- **Settings layout**: Recurring plan spans the full width; the other boxes flow in two columns (one on a phone).\n- **Box layout**: tap a box's title to collapse it. **Rearrange boxes** at the bottom of each page lets you drag boxes around. Both are remembered per device.\n\n## 7. Cash and accounts\n\nLedgerline treats all your accounts as one cash total. A month's budget is kept aside from that total until the month ends; the rest counts as cash savings.\n\n- To correct the total: **Wealth → Cash savings → Update balance**. You can list each account separately and the total adds up by itself. When you add your first account, your existing total is kept as a row \"My accounts so far\", so nothing is lost; split it into separate accounts whenever you like.\n- **Accounts stay current**: money you add to or take from cash savings (interest, spending paid from savings, repayments, sales) is added to the account with the same currency. If you have none in that currency yet, one is created for you (for example \"CAD account\"), so Each currency shows it as that currency. **Update balance** therefore opens with each account's current balance, and the total, the savings line and **Each currency** always agree. Correct any account there; that becomes its new starting point.\n- **Opening a savings account** changes nothing in how Ledgerline works: add it as another account row in **Update balance**. Moving money between your own accounts is never spending; the importer skips such transfers.\n- Interest goes in as **Money in → Cash savings**. The importer does this automatically for interest lines.\n\n## Currencies\n\nEverything is shown in your **home currency** (the setup wizard asks for it; change it under **Settings → B
