/* Boxes whose title is your own text (a debt's name) get the explanation for their kind of box. */
const HELP_BY_VIEW = { debt: 'One debt: what’s left, how much is repaid, interest, any repayment plan and when you’ll be debt-free. Tap Edit to change the amount, rate, target date or plan.' };
function addHelp() {
  $$('#main .panel[data-pkey]').forEach(p => {
    const view = p.dataset.pkey.split(':')[0], key = p.dataset.pkey.split(':').slice(1).join(':').trim(), text = HELP[key] || HELP_BY_VIEW[view]; if (!text) return;
    const h = p.querySelector(':scope > .panel-head > h2, :scope > h2'); if (!h || h.querySelector('.qhelp')) return;
    const b = document.createElement('button'); b.type = 'button'; b.className = 'qhelp'; b.dataset.act = 'help'; b.dataset.key = key; b.setAttribute('aria-label', 'What does this mean?'); b.textContent = '?';
    h.appendChild(b);
  });
}
ACTIONS.help = (el, e) => { e?.stopPropagation?.(); const t = HELP[el.dataset.key] || HELP_BY_VIEW[ui.view] || ''; dlg(`<div class="dlg"><div class="panel-head" style="margin:0"><h2>${esc(el.closest('h2')?.firstChild?.textContent?.trim() || 'Help')}</h2><button class="btn icon ghost right" data-act="dlg-close" aria-label="Close">${ICONS.x}</button></div><p style="margin:0;line-height:1.55">${esc(t)}</p><p class="small muted" style="margin:0">More in the Manual.</p></div>`); };

/* =========================================================================
   3. Settings: search and groups.
   ========================================================================= */
const SET_GROUPS = [['plan', 'Plan', /recurring plan|savings.rate goal|budget|categor|fixed.cost group|month/], ['money', 'Money', /cash|debt|currency|number|apple pay/], ['invest', 'Investments', /price|holding|asset class|composition|projection/], ['devices', 'Devices', /sync|lock|appearance|automation/], ['advanced', 'Advanced', /backup|export|demo|erase|data/]];
function settingsTools() {
  if (ui.view !== 'settings' || $('#setTools')) return;
  const head = $('#main .page-head'); if (!head) return;
  const bar = document.createElement('div'); bar.id = 'setTools'; bar.className = 'set-tools';
  bar.innerHTML = `<input class="input" id="setSearch" type="search" placeholder="Search settings" aria-label="Search settings" value="${esc(ui.setQ || '')}"><div class="chips">${[['', 'All'], ...SET_GROUPS.map(g => [g[0], g[1]])].map(([id, l]) => `<button class="chip" data-act="set-group" data-g="${id}" aria-pressed="${(ui.setG || '') === id}">${l}</button>`).join('')}</div>`;
  head.after(bar); filterSettings();
}
function filterSettings() {
  const q = (ui.setQ || '').trim().toLowerCase(), g = SET_GROUPS.find(x => x[0] === ui.setG);
  $$('#main .panel').forEach(p => { const title = (p.querySelector('h2')?.textContent || '').toLowerCase(), all = p.textContent.toLowerCase(); const show = (!q || all.includes(q)) && (!g || g[2].test(title)); p.style.display = show ? '' : 'none'; });
  $$('#main > .grid, #main > .set-cols').forEach(gr => { gr.style.display = [...gr.querySelectorAll(':scope > .panel, :scope > div > .panel')].some(p => p.style.display !== 'none') ? '' : 'none'; });
}
ACTIONS['set-group'] = el => { ui.setG = el.dataset.g; $$('#setTools .chip').forEach(c => c.setAttribute('aria-pressed', c === el)); filterSettings(); };
document.addEventListener('input', e => { if (e.target.id === 'setSearch') { ui.setQ = e.target.value; filterSettings(); } });

/* Settings layout: the long "Recurring plan" box spans the full width; every other box flows into two
   balanced columns (in the order Plan, Money, Investments, Devices, Advanced), so neither column runs far below the other. */
const SET_ORDER = ['savings-rate goal', 'budget', 'categories', 'fixed-cost groups', 'price updater', 'sync between devices', 'apple pay automation', 'app lock', 'backup & export'];
const _viewSettings = viewSettings;
viewSettings = function () {
  const tpl = document.createElement('template'); tpl.innerHTML = _viewSettings();
  const grid = [...tpl.content.children].find(el => el.classList.contains('grid')); if (!grid) return tpl.innerHTML;
  const panels = [...grid.querySelectorAll(':scope > div > .panel, :scope > .panel')];
  const title = p => (p.querySelector('h2')?.textContent || '').trim().toLowerCase();
  const full = panels.filter(p => title(p) === 'recurring plan'), rest = panels.filter(p => title(p) !== 'recurring plan');
  rest.sort((a, b) => { const ia = SET_ORDER.indexOf(title(a)), ib = SET_ORDER.indexOf(title(b)); return (ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib); });
  const cols = document.createElement('div'); cols.className = 'set-cols'; rest.forEach(p => cols.appendChild(p));
  grid.replaceWith(...full, cols);
  return tpl.innerHTML;
};

/* =========================================================================
   4. Undo for deletes and imports.
   ========================================================================= */
const Undo = {
  show(label, snap) {
    let bar = $('#undoBar'); if (!bar) { bar = document.createElement('div'); bar.id = 'undoBar'; document.body.appendChild(bar); }
    bar.innerHTML = `<span>${esc(label)}</span><button class="btn small" data-act="undo">Undo</button>`; bar.classList.add('show'); this.snap = snap;
    clearTimeout(this.t); this.t = setTimeout(() => { bar.classList.remove('show'); this.snap = null; }, 7000);
  },
  restore() {
    if (!this.snap) return; const old = JSON.parse(this.snap), ts = now();
    // anything that differs from the snapshot gets a fresh timestamp, so sync spreads the restore instead of the deletion
    for (const coll of ['transactions', 'holdings', 'debts', 'months', 'accounts']) { const o = old[coll] || {}, cur = state[coll] || {};
      for (const id of new Set([...Object.keys(o), ...Object.keys(cur)])) { if (JSON.stringify(o[id]) !== JSON.stringify(cur[id])) { if (o[id]) o[id].updatedAt = ts; else { o[id] = { ...cur[id], deleted: true, updatedAt: ts }; } } } }
    if (JSON.stringify(old.settings) !== JSON.stringify(state.settings)) old.settings.updatedAt = ts;
    state = old; persist(); this.snap = null; $('#undoBar')?.classList.remove('show'); render(); toast('Undone.');
  },
};
for (const [name, label] of [['tx-del', 'Entry deleted.'], ['hold-del', 'Holding deleted.'], ['debt-del', 'Debt deleted.'], ['imp-apply', 'Import added.'], ['sample-remove', 'Demo data removed.'], ['ways-reset', 'Suggestions restored.']]) {
  const orig = ACTIONS[name]; if (!orig) continue;
  ACTIONS[name] = (...a) => { const snap = JSON.stringify(state); orig(...a); if (JSON.stringify(state) !== snap) Undo.show(label, snap); };
}
ACTIONS.undo = () => Undo.restore();

/* =========================================================================
   5. Gentle nudges (Overview and Today): keep the data complete.
   ========================================================================= */
function nudges() {
  if (!['overview', 'today'].includes(ui.view) || $('#main .nudge')) return;
  const head = $('#main .page-head'); if (!head) return;
  const out = [], dk = todayISO(), dismissed = (() => { try { return JSON.parse(localStorage.getItem('ledgerline:nudges') || '{}'); } catch { return {}; } })();
  const fresh = !(state.settings.recurring?.income || []).length && !allTx().length && !liveHoldings().length;
  if (fresh && !Sync.on) out.push({ id: 'welcome', text: 'Welcome. Already using Ledgerline on another device? Connect sync in Settings to bring your data here, or restore a backup. Starting fresh? Begin with Settings → Recurring plan.', btn: ['nav', 'Open Settings'], view: 'settings' });
  if (Inbox.items.length && state.settings.applePayMode !== 'auto') out.push({ id: 'inbox', text: `${Inbox.items.length} Apple Pay payment${Inbox.items.length === 1 ? '' : 's'} to confirm.`, btn: ['ap-review', 'Review'] });
  const tx = allTx(), last = tx.reduce((m, t) => Math.max(m, t.createdAt || 0), 0), days = last ? Math.floor((Date.now() - last) / 864e5) : null;
  if (days != null && days >= 5) out.push({ id: 'stale', text: `No new entries for ${days} days. A screenshot import keeps your budget and savings rate accurate.`, btn: ['import-open', 'Import'] });
  const other = tx.filter(t => isOut(t) && t.category === 'other' && monthOf(t.date) === curMonth()).length;
  if (other >= 3) out.push({ id: 'other', text: `${other} entries this month are in “Other”. A better category makes your trends more useful.`, btn: ['goto-month', 'Open month'] });
  const show = out.filter(n => dismissed[n.id] !== dk); if (!show.length) return;
  const box = document.createElement('div'); box.className = 'nudge';
  box.innerHTML = show.map(n => `<div class="n">${ICONS.info}<span>${n.text}</span><button class="btn small" data-act="${n.btn[0]}" ${n.btn[0] === 'goto-month' ? `data-key="${curMonth()}"` : ''} ${n.view ? `data-view="${n.view}"` : ''}>${n.btn[1]}</button><button class="btn icon ghost small" data-act="nudge-x" data-id="${n.id}" aria-label="Hide for today">${ICONS.x}</button></div>`).join('');
  head.after(box);
}
ACTIONS['nudge-x'] = el => { let d = {}; try { d = JSON.parse(localStorage.getItem('ledgerline:nudges') || '{}'); } catch { } d[el.dataset.id] = todayISO(); try { localStorage.setItem('ledgerline:nudges', JSON.stringify(d)); } catch { } el.closest('.n').remove(); };

/* =========================================================================
   6. Milestones: a small celebration when something good happens for the first time.
   ========================================================================= */
function milestoneChecks() {
  const ms = state.settings.milestones ||= {}, out = [], first = !ms._init;
  const w = wealth(), sn = safetyNet();
  const step = 500000, nwLevel = Math.floor(w.net / step) * step;
  if (nwLevel > 0 && nwLevel > (ms.nw ?? -Infinity)) { if ((ms.nw ?? -Infinity) !== -Infinity || !first) out.push({ title: `Net worth passed ${fmt(nwLevel, { whole: true })}`, text: 'Assets minus debt. Every step like this is real progress.' }); ms.nw = nwLevel; }
  for (const lvl of [1, 3, 6]) if (sn.months >= lvl && !ms['sn' + lvl]) { if (!first) out.push({ title: `Safety net: ${lvl} month${lvl === 1 ? '' : 's'}`, text: `Your cash savings now cover ${lvl} month${lvl === 1 ? '' : 's'} of costs.` }); ms['sn' + lvl] = todayISO(); }
  for (const st of liveDebts().map(debtStatus)) for (const p of [25, 50, 75, 100]) { const k = `debt:${st.d.id}:${p}`; if (st.pct * 100 >= p && !ms[k]) { if (!first) out.push({ title: p === 100 ? `${st.d.name} is paid off!` : `${p}% of ${st.d.name} repaid`, text: p === 100 ? 'Debt-free on this one. Well done.' : `${fmt(st.remaining, { whole: true })} to go.` }); ms[k] = todayISO(); } }
  const pk = addMonths(curMonth(), -1); if (state.months[pk] && pk >= (state.settings.startMonth || pk) && !ms['goal:' + pk]) { const sr = savingsRate(computeMonth(pk)); if (sr.met) { if (!first) out.push({ title: `${monthLabel(pk)}: savings goal reached`, text: `You saved ${pctTxt(sr.rate)} of your income, against a goal of ${sr.goal}%.` }); ms['goal:' + pk] = todayISO(); } }
  if (first) ms._init = todayISO();
  if (out.length || first) { touchSettings(); persist(); }
  return out;
}
function celebrate(items) {
  if (!items.length) return;
  const it = items[0], colors = ['#1F7A5C', '#3346C9', '#E0723A', '#D9A520', '#B0569A', '#20A5A8'];
  const conf = Array.from({ length: 70 }, (_, i) => `<i style="left:${Math.random() * 100}%;background:${colors[i % colors.length]};animation-delay:${(Math.random() * .6).toFixed(2)}s;animation-duration:${(1.8 + Math.random() * 1.4).toFixed(2)}s;transform:rotate(${Math.round(Math.random() * 360)}deg)"></i>`).join('');
  dlg(`<div class="dlg celebrate"><div class="confetti" aria-hidden="true">${conf}</div><div style="font-size:44px;text-align:center">🎉</div><h2 style="text-align:center;margin:4px 0">${esc(it.title)}</h2><p style="text-align:center;margin:0">${esc(it.text)}</p>${items.length > 1 ? `<p class="small muted" style="text-align:center;margin:6px 0 0">And ${items.length - 1} more: ${items.slice(1).map(x => esc(x.title)).join(', ')}.</p>` : ''}<div class="dlg-foot" style="justify-content:center"><button class="btn primary" data-act="dlg-close">Nice</button></div></div>`);
}
let _celebrated = false;
(window.AFTER_RENDER ||= []).push(addHelp, settingsTools, nudges, () => { if (_celebrated || Lock.locked || !['overview', 'today'].includes(ui.view) || document.querySelector('dialog[open]')) return; _celebrated = true; setTimeout(() => celebrate(milestoneChecks()), 600); });
</script>
<script>
'use strict';
/* ---------- boot ---------- */
ui._lastDay = todayISO();
(async () => {
  await Sync.init();
  if (Lock.on) Lock.show(); else afterUnlock();
  if (Sync.on) Sync.run(); else Sync.set('off', '');
})();
</script>
