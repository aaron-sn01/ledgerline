<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ledgerline">
<meta name="theme-color" content="#F2F4F3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F1720" media="(prefers-color-scheme: dark)">
<meta name="referrer" content="no-referrer">
<title>Ledgerline</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%2316212E'/><path d='M14 44h36M14 34h24M14 24h14' stroke='%233DBA8D' stroke-width='6' stroke-linecap='round'/></svg>">
<link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' fill='%2316212E'/><path d='M14 44h36M14 34h24M14 24h14' stroke='%233DBA8D' stroke-width='6' stroke-linecap='round'/></svg>">
<style>
:root{
  --paper:#F2F4F3; --surface:#FFFFFF; --surface-2:#E7ECEA; --ink:#16212E; --muted:#5B6775; --line:#D6DCDF;
  --pine:#1F7A5C; --pine-soft:#DCEFE7; --crimson:#C62F3E; --crimson-soft:#F8E1E3; --amber:#A36C00; --amber-soft:#F6EBD3;
  --cobalt:#3346C9; --cobalt-soft:#E3E6FA; --fixed:#55626F; --pot:#B7791F; --halo:#FFFFFF;
  --font:-apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --display:-apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  color-scheme:light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#0F1720; --surface:#17212C; --surface-2:#1F2B38; --ink:#E8EDF2; --muted:#96A3B1; --line:#2A3644;
    --pine:#3DBA8D; --pine-soft:#173A31; --crimson:#F0606C; --crimson-soft:#40202A; --amber:#E7B13A; --amber-soft:#3A2F17;
    --cobalt:#8794FF; --cobalt-soft:#232B55; --fixed:#8C99A7; --pot:#E0A84A; --halo:#17212C; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0F1720; --surface:#17212C; --surface-2:#1F2B38; --ink:#E8EDF2; --muted:#96A3B1; --line:#2A3644;
  --pine:#3DBA8D; --pine-soft:#173A31; --crimson:#F0606C; --crimson-soft:#40202A; --amber:#E7B13A; --amber-soft:#3A2F17;
  --cobalt:#8794FF; --cobalt-soft:#232B55; --fixed:#8C99A7; --pot:#E0A84A; --halo:#17212C; color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.45;font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--cobalt)}
:focus-visible{outline:2px solid var(--cobalt);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.app{display:grid;grid-template-columns:minmax(0,1fr);min-height:100vh}
.app>div,.grid>*{min-width:0}
.rail{display:none}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--paper) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);display:flex;align-items:center;gap:12px;padding:12px 18px;border-bottom:1px solid var(--line)}
.brand{font-family:var(--display);font-weight:800;letter-spacing:-.03em;font-size:20px;display:flex;align-items:center;gap:8px}
.brand svg{width:22px;height:22px}
.sync-pill{margin-left:auto;font-size:13px;color:var(--muted);background:none;border:1px solid var(--line);border-radius:999px;padding:4px 10px;cursor:pointer;display:flex;align-items:center;gap:6px}
.sync-pill .dot{width:7px;height:7px;border-radius:50%;background:var(--muted)}
.sync-pill.ok .dot{background:var(--pine)} .sync-pill.err .dot{background:var(--crimson)} .sync-pill.busy .dot{background:var(--amber)}
main{padding:18px 16px 110px;max-width:1120px;width:100%;margin:0 auto}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabbar button{flex:1;background:none;border:0;padding:9px 2px 8px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;min-width:0;color:var(--muted);cursor:pointer}
.tabbar button svg{width:22px;height:22px}
.tabbar button[aria-current="page"]{color:var(--ink);font-weight:700}
.tabbar button[aria-current="page"] svg{color:var(--cobalt)}
@media (min-width:900px){
  .app{grid-template-columns:232px minmax(0,1fr)}
  .rail{display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh;padding:22px 14px;border-right:1px solid var(--line);background:var(--surface)}
  .rail .brand{padding:0 10px 18px}
  .rail button{display:flex;align-items:center;gap:10px;background:none;border:0;border-radius:8px;padding:10px 12px;cursor:pointer;color:var(--muted);font-size:15px;text-align:left}
  .rail button svg{width:20px;height:20px}
  .rail button:hover{background:var(--surface-2);color:var(--ink)}
  .rail button[aria-current="page"]{background:var(--ink);color:var(--paper);font-weight:600}
  .rail .rail-foot{margin-top:auto;font-size:12px;color:var(--muted);padding:0 10px}
  .tabbar{display:none} .topbar .brand{display:none}
  main{padding:26px 34px 60px}
}

h1{font-family:var(--display);font-size:clamp(26px,4vw,36px);letter-spacing:-.025em;line-height:1.1;margin:0;font-weight:800}
h2{font-family:var(--display);font-size:18px;letter-spacing:-.01em;margin:0 0 4px;font-weight:700}
h3{font-size:15px;margin:0 0 6px;font-weight:700}
.sub{color:var(--muted);font-size:14px;margin:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px}
.panel+.panel,.grid+.panel,.panel+.grid,.grid+.grid,.kpis+.panel,.kpis+.grid,.tips+.panel,.kpis+.tips{margin-top:16px}
.panel-head{display:flex;align-items:baseline;gap:8px 12px;flex-wrap:wrap;margin-bottom:12px}
.panel-head .right{margin-left:auto}
.grid{display:grid;gap:16px}
.grid>.panel,.grid>div>.panel:first-child{margin-top:0}
.grid>div>.panel+.panel{margin-top:16px}
@media (min-width:760px){.g2{grid-template-columns:1fr 1fr}.g-wide{grid-template-columns:1.4fr 1fr}}
@media (min-width:900px){.g3{grid-template-columns:repeat(3,1fr)}}
.page-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.page-head .right{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.scroll-x{overflow-x:auto;-webkit-overflow-scrolling:touch}
.chart svg{display:block;width:100%;height:auto}
.chart.min600 svg{min-width:600px}
.muted{color:var(--muted)} .pos{color:var(--pine)} .neg{color:var(--crimson)} .warn{color:var(--amber)}
.small{font-size:13px}
.empty{padding:22px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:12px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 14px;cursor:pointer;font-weight:600;font-size:14px;white-space:nowrap;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.btn.danger{color:var(--crimson);border-color:color-mix(in srgb,var(--crimson) 40%,var(--line))}
.btn.ghost{border-color:transparent;background:none}
.btn.icon{padding:8px;border-radius:50%;width:38px;height:38px}
.btn svg{width:18px;height:18px}
.btn:disabled{opacity:.5;cursor:not-allowed}
label.field{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--muted);font-weight:500}
label.check{display:flex;gap:8px;align-items:center;font-size:14px;cursor:pointer}
label.check input{width:18px;height:18px;accent-color:var(--cobalt)}
.input,select.input{width:100%;border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:10px 12px;font-size:16px;color:var(--ink);min-width:0}
.input:focus{outline:2px solid var(--cobalt);outline-offset:0;border-color:transparent}
.input.money{text-align:right}
.seg{display:inline-flex;background:var(--surface-2);border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;border-radius:8px;padding:7px 12px;font-size:14px;cursor:pointer;color:var(--muted);font-weight:600}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(10,20,30,.12)}
.seg.pot button[aria-pressed="true"][data-fund="savings"],.seg.pot button[aria-pressed="true"][data-dest="savings"]{color:var(--pot)}
.month-nav{display:flex;align-items:center;gap:6px}
.month-nav .label{min-width:150px;text-align:center;font-weight:700;font-size:17px}
.form-grid{display:grid;gap:10px;grid-template-columns:1fr 1fr}
@media (max-width:520px){.form-grid{grid-template-columns:1fr}}

.hero{position:relative;padding:22px 20px 20px;border-radius:20px;background:var(--surface);border:1px solid var(--line);overflow:hidden}
.hero .label{font-size:15px;color:var(--muted);font-weight:600}
.figure{font-family:var(--display);display:flex;align-items:baseline;gap:2px;font-weight:800;letter-spacing:-.045em;line-height:.95;margin:8px 0 4px;font-size:clamp(64px,15vw,112px)}
.figure .cur{font-size:.42em;font-weight:700;letter-spacing:-.02em;margin-right:4px;align-self:flex-start;margin-top:.12em;color:var(--muted)}
.figure .dec{font-size:.36em;font-weight:700;letter-spacing:-.01em;color:var(--muted)}
.hero.s-over-today .figure,.hero.s-overdrawn .figure,.hero.s-unrecoverable .figure{color:var(--crimson)}
.hero.s-tight .figure{color:var(--amber)}
.hero-meta{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:14px;color:var(--muted)}
.hero-meta b{color:var(--ink);font-weight:700}
.odds{display:flex;align-items:center;gap:12px;margin-top:16px}
.odds .ring{flex:none;width:52px;height:52px}
.odds .t{font-size:14px;color:var(--muted);line-height:1.35}
.odds .t b{color:var(--ink);font-size:16px}
.runway{margin-top:16px;display:grid;gap:7px}
.runway .row{display:grid;grid-template-columns:86px 1fr 56px;align-items:center;gap:10px;font-size:13px;color:var(--muted)}
.runway .track{height:10px;border-radius:5px;background:var(--surface-2);overflow:hidden;position:relative}
.runway .fill{position:absolute;inset:0 auto 0 0;border-radius:5px}
.runway .row span:last-child{text-align:right;color:var(--ink);font-weight:600}
.status{margin-top:16px;padding:12px 14px;border-radius:12px;font-size:15px;line-height:1.4;display:flex;gap:10px;align-items:flex-start}
.status svg{flex:none;width:20px;height:20px;margin-top:1px}
.status.on-track,.status.good{background:var(--pine-soft)} .status.on-track svg,.status.good svg{color:var(--pine)}
.status.tight,.status.warn{background:var(--amber-soft)} .status.tight svg,.status.warn svg{color:var(--amber)}
.status.over-today,.status.overdrawn,.status.unrecoverable,.status.bad{background:var(--crimson-soft)} .status.over-today svg,.status.overdrawn svg,.status.unrecoverable svg,.status.bad svg{color:var(--crimson)}
.status.neutral,.status.info{background:var(--surface-2)} .status.info svg{color:var(--cobalt)}

.safety{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px 4px 4px;cursor:pointer;font-size:13px;color:var(--muted)}
.safety svg{width:30px;height:30px}
.safety b{color:var(--ink)}

.qa{display:grid;gap:12px}
.qa-row{display:grid;grid-template-columns:1fr 130px;gap:10px}
.qa .big{font-size:18px;padding:13px 14px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 11px;font-size:13px;cursor:pointer;font-weight:600;color:var(--ink)}
.chip .sw{width:9px;height:9px;border-radius:50%}
.chip[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--paper)}
.chip .conf{font-weight:500;opacity:.7;font-size:12px}
.guess-note{font-size:12px;color:var(--muted)}
.qa-foot{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.qa-foot .btn.primary{margin-left:auto;padding:12px 20px;font-size:15px}
.fund-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:13px;color:var(--muted)}

.tx-list{display:flex;flex-direction:column}
.tx-day{font-size:13px;font-weight:700;color:var(--muted);padding:12px 2px 4px;display:flex;justify-content:space-between}
.tx{display:grid;grid-template-columns:10px 1fr auto;gap:12px;align-items:center;padding:10px 4px;border:0;border-bottom:1px solid var(--line);cursor:pointer;background:none;text-align:left;width:100%}
.tx:hover{background:var(--surface-2)}
.tx .sw{width:10px;height:10px;border-radius:3px}
.tx .name{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tx .meta{font-size:12px;color:var(--muted)}
.tx .amt{font-weight:700;text-align:right}
.tx .amt.in{color:var(--pine)} .tx .amt.inv{color:var(--cobalt)} .tx .amt.pot{color:var(--pot)}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:1px 6px;border-radius:5px;background:color-mix(in srgb,var(--pot) 18%,transparent);color:var(--pot);margin-left:6px;vertical-align:1px}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media (min-width:760px){.kpis{grid-template-columns:repeat(3,1fr)}.kpis.k4{grid-template-columns:repeat(4,1fr)}}
@media (min-width:1100px){.kpis.k6{grid-template-columns:repeat(6,1fr)}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.kpi .k{font-size:13px;color:var(--muted)}
.kpi .v{font-family:var(--display);font-size:22px;font-weight:800;letter-spacing:-.02em;margin-top:2px}
.kpi .d{font-size:12px;color:var(--muted);margin-top:2px}
.cat-rows{display:grid;gap:9px}
.cat-split{display:grid;gap:18px;align-items:center;grid-template-columns:minmax(0,1fr)}
@media (min-width:520px){.cat-split{grid-template-columns:minmax(0,170px) minmax(0,1fr)}}
.cat-row{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center;font-size:14px}
.cat-row .bar{grid-column:1/-1;height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden;display:flex}
.cat-row .bar i{display:block;height:100%}
.cat-row .nm{display:flex;align-items:center;gap:8px;font-weight:600}
.cat-row .nm .sw{width:9px;height:9px;border-radius:50%}
.cat-row .vv{font-weight:700}
.cat-row .vv small{color:var(--muted);font-weight:500;margin-left:6px}

.tips{display:grid;gap:10px}
@media (min-width:760px){.tips{grid-template-columns:repeat(3,1fr)}}
.tip{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:12px;font-size:14px;line-height:1.4;background:var(--surface);border:1px solid var(--line)}
.tip svg{flex:none;width:18px;height:18px;margin-top:1px}
.tip.good svg{color:var(--pine)} .tip.warn svg{color:var(--amber)} .tip.info svg{color:var(--cobalt)}

.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .dow{font-size:11px;color:var(--muted);text-align:center;padding-bottom:2px}
.cal button.day{aspect-ratio:1/1;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:4px;display:flex;flex-direction:column;justify-content:space-between;cursor:pointer;font-size:11px;min-width:0;overflow:hidden;text-align:left}
.cal .day .n{font-weight:700;font-size:12px}
.cal .day .s{font-size:10px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal .day.under{background:var(--pine-soft);border-color:transparent}
.cal .day.over{background:var(--crimson-soft);border-color:transparent}
.cal .day.today{outline:2px solid var(--cobalt);outline-offset:-2px}
.cal .day.sel{border-color:var(--ink);border-width:2px}
.cal .day.future .n{color:var(--muted)}
.day-detail{margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted);margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}

details.plan>summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:10px}
details.plan>summary::-webkit-details-marker{display:none}
details.plan>summary .chev{margin-left:auto;transition:transform .2s}
details.plan[open]>summary .chev{transform:rotate(180deg)}
.rows{display:grid;gap:8px;margin:8px 0 4px}
.erow{display:grid;grid-template-columns:1fr 64px 110px 38px;gap:8px;align-items:center}
.erow.sav,.erow.fx{grid-template-columns:1fr 1fr 64px 110px 38px}
.erow.fx.annual{grid-template-columns:1fr 1fr 96px 110px 38px}
.erow.cat{grid-template-columns:34px 1fr 96px auto 38px}
.erow .input{padding:8px 10px;font-size:15px}
.erow input[type=color]{width:34px;height:34px;border:0;padding:0;background:none;border-radius:8px;cursor:pointer}
.col-head{display:grid;font-size:12px;color:var(--muted);gap:8px}
.col-head span.r{text-align:right}
.plan-sec{padding:14px 0;border-bottom:1px solid var(--line)}
.plan-sec:last-child{border-bottom:0;padding-bottom:0}
.plan-total{font-size:13px;color:var(--muted);text-align:right;margin-top:4px}
@media (max-width:560px){
  .erow.sav,.erow.fx{grid-template-columns:1fr 56px 100px 38px}.erow.fx.annual{grid-template-columns:1fr 84px 100px 38px}
  .erow.sav .acc,.erow.fx .acc{grid-column:1/-1;grid-row:2}
  .col-head.wide{display:none}
  .erow.cat{grid-template-columns:34px minmax(0,1fr) 38px}.erow.cat .limit{grid-column:2/3;grid-row:2}.erow.cat .potflag{grid-column:2/3;grid-row:3}
}

table.t{width:100%;border-collapse:collapse;font-size:14px;min-width:640px}
table.t th{text-align:right;font-weight:600;color:var(--muted);font-size:12px;padding:8px 10px;border-bottom:1px solid var(--line)}
table.t td{text-align:right;padding:9px 10px;border-bottom:1px solid var(--line)}
table.t th:first-child,table.t td:first-child{text-align:left}
table.t tr.total td{font-weight:800;border-bottom:0}
table.t tr.click{cursor:pointer} table.t tr.click:hover td{background:var(--surface-2)}
table.t td .nm{font-weight:600} table.t td .mt{font-size:12px;color:var(--muted)}

dialog{border:0;border-radius:18px;padding:0;background:var(--surface);color:var(--ink);width:min(520px,calc(100vw - 24px));max-height:calc(100vh - 40px)}
dialog.wide{width:min(680px,calc(100vw - 24px))}
dialog::backdrop{background:rgba(8,14,22,.55)}
.dlg{padding:20px;display:grid;gap:14px}
.dlg-foot{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.dlg-foot .btn.danger{margin-right:auto}
.dlg-sec{border-top:1px solid var(--line);padding-top:14px;display:grid;gap:10px}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);opacity:0;background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:10px;font-size:14px;z-index:60;transition:all .25s;pointer-events:none;max-width:90vw}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media (min-width:900px){.toast{bottom:28px}}

.bd{display:grid;gap:0}
.bd .r{display:grid;grid-template-columns:1fr auto;gap:10px;padding:7px 0;font-size:14px;border-bottom:1px solid var(--line)}
.bd .r span:last-child{font-weight:600;text-align:right}
.bd .r.sub2{color:var(--muted)}
.bd .r.tot{font-weight:800;border-bottom:2px solid var(--ink)}
.bd .r.tot span:last-child{font-weight:800}
.bd .r.final{border-bottom:0;padding-top:12px;align-items:baseline}
.bd .r.final span:first-child{font-weight:700;font-size:15px}

.u-group>summary{list-style:none;cursor:pointer}.u-group>summary::-webkit-details-marker{display:none}.u-group[open]>summary{background:var(--surface-2)}
.cat-grid{display:flex;flex-wrap:wrap;gap:6px}

.verdict.bad{background:var(--crimson-soft)} .verdict.bad svg{color:var(--crimson)}
.facts{display:grid;gap:0}

.ages .a .k{font-size:12px;color:var(--muted)} .ages .a .v{font-weight:800;font-size:17px} .ages .a .r{font-size:11px;color:var(--muted)}

dialog.wrapped{width:min(430px,100vw);height:min(780px,100vh);max-height:100vh;border-radius:22px;overflow:hidden}
@media (max-width:480px){dialog.wrapped{width:100vw;height:100vh;border-radius:0}}
.wr{position:relative;height:100%;display:flex;flex-direction:column;color:#fff;transition:background .45s}

.wr-card .kick{font-size:18px;font-weight:600;opacity:.85}
.wr-card .huge{font-family:var(--display);font-size:clamp(52px,14vw,76px);font-weight:800;letter-spacing:-.05em;line-height:.92}

.wr-foot{padding:0 28px calc(22px + env(safe-area-inset-bottom,0px));font-size:13px;opacity:.75;display:flex;justify-content:space-between}
.wrapped-cta{display:flex;align-items:center;gap:16px;padding:18px;border-radius:16px;background:linear-gradient(120deg,#3346C9,#8A55D6 55%,#E05673);color:#fff;border:0;cursor:pointer;width:100%;text-align:left}

.wrapped-cta .t2{font-size:14px;opacity:.9}

.lock{position:fixed;inset:0;z-index:100;background:var(--paper);display:flex;align-items:center;justify-content:center;padding:24px}

.imp-main{display:grid;gap:6px;min-width:0}
.imp-line{display:grid;grid-template-columns:150px 1fr 110px;gap:6px}

.imp-notes{display:flex;flex-wrap:wrap;gap:6px}

@media (max-width:560px){.imp-line{grid-template-columns:1fr 100px}.imp-line .imp-name{grid-column:1/-1;grid-row:1}.imp-line+.imp-line{grid-template-columns:1fr 1fr}.imp-line+.imp-line>select:first-child{grid-column:1/-1}}
.help{font-size:14px;color:var(--muted);line-height:1.5}

.svg-label{paint-order:stroke;stroke:var(--halo);stroke-width:3px;stroke-linejoin:round}


/* ---------- overview ---------- */
.ov-grid{display:grid;gap:10px;grid-template-columns:repeat(2,minmax(0,1fr))}

.ov-card{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;cursor:pointer;display:flex;flex-direction:column;gap:2px;min-width:0;color:var(--ink)}

.ov-card .v{font-family:var(--display);font-size:clamp(22px,4.5vw,30px);font-weight:800;letter-spacing:-.03em;line-height:1.1;margin:2px 0}
.ov-card .d{font-size:12.5px;color:var(--muted)}
.ov-card.bad .v{color:var(--crimson)} .ov-card.warn .v{color:var(--amber)} .ov-card.good .v{color:var(--pine)}
.ov-bar{position:relative;height:8px;border-radius:4px;background:var(--surface-2);margin-top:8px}
.ov-bar i{position:absolute;inset:0 auto 0 0;border-radius:4px}
.ov-bar b{position:absolute;top:-3px;width:2px;height:14px;background:var(--ink);border-radius:1px}
.ov-list{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:8px}

.ways{display:grid;gap:8px}

/* ---------- collapsible boxes ---------- */
.panel.collapsible > .panel-head > h2, .panel.collapsible > h2{cursor:pointer;user-select:none}

/* ---------- arrange mode ---------- */
.arrange-bar{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap;margin:18px 0 8px;color:var(--muted);font-size:13px}
body.arranging .arrange-bar{position:sticky;bottom:calc(env(safe-area-inset-bottom,0px) + 74px);z-index:30;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px;box-shadow:0 6px 24px rgba(0,0,0,.12);justify-content:space-between}

@media print{.arrange-bar,.drag-h{display:none!important}}

/* ---------- day/month/year date boxes ---------- */
.dmy{position:relative;display:flex;align-items:stretch;min-width:0}
.dmy > input[type=text]{flex:1;min-width:0;padding-right:44px;font-variant-numeric:tabular-nums}

/* ---------- manual ---------- */

.qhelp{display:inline-grid;place-items:center;width:20px;height:20px;margin-left:8px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--muted);font-size:12px;font-weight:700;vertical-align:3px;cursor:pointer;padding:0}

.paste-row{display:flex;gap:8px;align-items:stretch}
.paste-zone{flex:1;min-height:46px;border:1.5px dashed var(--line);border-radius:12px;padding:12px;color:var(--muted);font-size:14px;outline:none;-webkit-user-select:text;user-select:text;overflow:hidden;white-space:nowrap}

.set-cols{columns:2 380px;column-gap:16px}
.set-cols > .panel{break-inside:avoid;-webkit-column-break-inside:avoid;page-break-inside:avoid;display:block;width:100%;margin:0 0 16px}

}
/* ---------- one-page PDF summary (printed through the browser's "Save as PDF") ---------- */
#printArea{display:none}
.print-root{--paper:#fff;--surface:#fff;--surface-2:#EEF1F0;--ink:#16212E;--muted:#5B6775;--line:#D6DCDF;--pine:#1F7A5C;--pine-soft:#DCEFE7;--crimson:#C62F3E;--crimson-soft:#F8E1E3;--amber:#A36C00;--amber-soft:#F6EBD3;--cobalt:#3346C9;--cobalt-soft:#E3E6FA;--fixed:#55626F;--pot:#B7791F;--halo:#fff;
  color-scheme:light;background:#fff;color:#16212E;font-family:var(--font);font-size:11px;line-height:1.35;width:190mm;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.print-root h1{font-size:20px;margin:0}
.print-root h2{font-size:13px;margin:0 0 6px;padding-bottom:3px;border-bottom:1.5px solid #16212E}
.print-root .ph{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:10px;padding-bottom:6px;border-bottom:3px solid #16212E}
.print-root .ph .brand{font-size:14px}
.print-root .ph .brand svg{width:16px;height:16px}
.print-root .ps{margin-top:10px;break-inside:avoid}
.print-root .pk{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;margin-bottom:6px}
.print-root .pk div{border:1px solid #D6DCDF;border-radius:6px;padding:4px 6px}
.print-root .pk b{display:block;font-size:13px}
.print-root .pk span{font-size:9px;color:#5B6775}
.print-root .two{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:start}
.print-root .three{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;align-items:start}
.print-root table{width:100%;border-collapse:collapse;font-size:10px}

.print-root .foot{margin-top:10px;font-size:9px;color:#5B6775;display:flex;justify-content:space-between}

  @page{size:A4;margin:10mm}
  html,body{background:#fff!important;padding:0!important;margin:0!important}

  #printArea{display:block!important}

function divPie(entries, label) {
  const total = sum(entries, e => e[1]); if (!total) return '<p class="sub" style="text-align:center">No data yet.</p>';
  const withCol = entries.map((e, i) => [e[0], e[1], e[2] || (/^(Other countries|Other sectors|Not known)$/.test(e[0]) ? '#9AA3AD' : PIE_COLORS[i % PIE_COLORS.length])]);
  return `${pie(withCol, 150, label)}<div class="facts" style="margin-top:10px">${withCol.map(([n, v, c]) => `<div class="f"><span style="display:flex;gap:8px;align-items:center"><i style="width:10px;height:10px;border-radius:3px;background:${c};display:inline-block;flex:none"></i>${esc(n)}</span><span>${(v / total * 100).toFixed(1)}%</span></div>`).join('')}</div>`;
}
function divSources(dv) {
  const live = dv.sources.filter(s => s.src === 'ishares' || s.src === 'dws'), fact = dv.sources.filter(s => s.src === 'factsheet'), none = dv.sources.filter(s => s.src === 'none');
  const asOf = live.map(s => s.asOf).filter(Boolean).sort().at(-1);
  return [live.length ? `${live.length} fund${live.length === 1 ? '' : 's'} from the providers’ full holdings lists${asOf ? `, updated ${fmtDate(asOf)}` : ''} (refreshed monthly).` : '',
    fact.length ? `${fact.map(s => esc(s.h.name)).join(', ')}: approximate factsheet values${live.length ? '' : ' until the monthly updater first runs'}.` : '',
    none.length ? `No composition data for ${none.map(s => esc(s.h.name)).join(', ')}, shown as “Not known”.` : '', 'Only stocks are broken down by sector and country; cash, bonds, crypto and other asset classes appear in Asset types.'].filter(Boolean).join(' ');
}

/* ---------- Debt ---------- */
function viewDebt() {
  const ds = liveDebts().map(debtStatus), total = sum(ds, x => x.remaining), w = wealth();
  if (!ds.length) return `<div class="page-head"><div><h1>Debt</h1></div><div class="right"><button class="btn primary" data-act="debt-add">${ICONS.plus}Add a debt</button></div></div><div class="empty">No debts. Nice.</div>`;
  return `<div class="page-head"><div><h1>Debt</h1><p class="sub">${fmt(total)} left to repay. Net worth ${fmt(w.net, { whole: true })} after debt, ${fmt(w.assets, { whole: true })} before.</p></div><div class="right"><button class="btn" data-act="debt-add">${ICONS.plus}Add a debt</button></div></div>
  ${ds.map(st => debtCard(st)).join('')}`;
}
function debtCard(st) {
  const fmtD = (v, o = {}) => fmt(v, { ...o, cur: st.d.cur || undefined });
  const d = st.d, sn = safetyNet(), chunks = st.needMonthly ? [3, 6, 12].filter(n => n <= st.monthsLeft).map(n => `${fmtD(st.needMonthly * n, { whole: true })} every ${n} months`) : [];
  const status = st.remaining <= 0 ? `<div class="status good">${ICONS.check}<span>Paid off. Well done.</span></div>`

<script>
'use strict';
/* =========================================================================
   Import, part A: turning screenshot text (OCR) and PDF text into raw candidates.
   Pure functions: no app state. Everything here is unit-tested against real samples.
   ========================================================================= */
const IMP = {};
IMP.MON = { jan: 1, januar: 1, january: 1, feb: 2, februar: 2, february: 2, mar: 3, mär: 3, maer: 3, märz: 3, maerz: 3, march: 3, apr: 4, april: 4, may: 5, mai: 5, jun: 6, juni: 6, june: 6, jul: 7, juli: 7, july: 7, aug: 8, august: 8, sep: 9, sept: 9, september: 9, okt: 10, oct: 10, oktober: 10, october: 10, nov: 11, november: 11, dez: 12, dec: 12, dezember: 12, december: 12 };
IMP.AMT = /([+\-−–]\s?)?(€\s?)?(\d{1,3}(?:[.,\u202f\s]\d{3})+[.,]\d{2}|\d+[.,]\d{2})(?!\d)\s?(€|EUR)?/g;
/* "1.234,56" or "1,234.56" or "12,50" → cents. The last separator followed by exactly two digits is the decimal mark. */
IMP.cents = raw => {
  let s = String(raw).replace(/[€\s\u202f]|EUR/g, '');

  const m = /^(.*)[.,](\d{2})$/.exec(s); if (!m) return NaN;
  const whole = m[1].replace(/[.,]/g, ''); if (!/^\d+$/.test(whole)) return NaN;

};

IMP.amounts = text => {

/* ---------- cash-flow outlook: the next 60 days, from your plan’s payment dates ---------- */
function cashflowOutlook(days = 60) {

    (p.bills || []).filter(at).forEach(x => items.push({ name: x.name, v: -x.amount, kind: groupById(groupOf(x)).name }));
    (p.savings || []).filter(at).forEach(x => items.push({ name: x.name, v: -x.amount, kind: 'Investment plan' }));
    (p.annual || []).filter(x => Number(x.month) === d.getMonth() + 1 && at(x)).forEach(x => items.push({ name: x.name, v: -x.amount, kind: 'Annual cost' }));
    debtPlansFor(mk).filter(x => x.day === day).forEach(x => items.push({ name: x.name, v: -x.amount, kind: 'Debt repayment plan' }));

}
/* Money in your accounts that still belongs to this month: what’s left to spend plus scheduled payments still to come, minus income still to arrive. */

<script>
'use strict';
/* =========================================================================
   Overview, savings rate, typical month, category trends and limits, Ways to save.
   ========================================================================= */
const pctTxt = r => `${Math.round(r * 1000) / 10}%`.replace('.0%', '%');
/* Average over up to the last 3 finished months (weighted by income), so one unusual month doesn't dominate. */
function avgSavingsRate(n = 3) {
  const st = state.settings.startMonth || curMonth(), rs = [];
  for (let i = 1; i <= 12 && rs.length < n; i++) { const k = addMonths(curMonth(), -i); if (k < st) break; if (state.months[k]) rs.push({ k, ...savingsRate(computeMonth(k)) }); }
  if (!rs.length) return null;
  const sv = sum(rs, r => r.saved), inc = sum(rs, r => r.income);
  const goal = goalFor(curMonth()), rate = inc ? sv / inc : 0;
  return { rate, months: rs.length, list: rs.reverse(), goal, met: rate * 100 >= goal - .05 };
}
function goalFor(key) { const g = [...(state.settings.savingsGoals || [])].filter(x => x.from <= key).sort((a, b) => a.from.localeCompare(b.from)).at(-1); return g ? Number(g.rate) || 0 : 20; }
/* Saved = plans + round-ups + debt repaid from income + what's left over (projected while the month is open) − spending paid from savings.
   All your accounts are one cash total, so the leftover is your cash saving. */
function savingsRate(cm) {
  const interest = sum(cm.tx.filter(t => t.type === 'in' && t.dest === 'savings'), t => t.amount);
  const ex = !cm.closed && cm.cur >= 1 ? expectedRest(cm) : null;
  const leftover = (cm.closed ? cm.endBalance : cm.cur < 1 ? cm.pool : cm.odds ? cm.odds.median : ex ? ex.end : 0) + (cm.cashGoal || 0);
  const income = cm.income + interest, debt = (cm.debtPlanned || 0) + (cm.debtBudget || 0);
  const saved = cm.planSaved + cm.roundUps + debt + leftover + interest - cm.drawn;
  const goal = goalFor(cm.key), rate = income > 0 ? saved / income : 0, target = Math.round(goal / 100 * income), met = saved >= target - 100;
  return { rate, saved, income, goal, target, met, gap: met ? 0 : target - saved, projected: !cm.closed, parts: { plans: cm.planSaved + cm.roundUps, debt, leftover, interest, drawn: cm.drawn } };
}
/* One-offs: single purchases far above your normal size (≥ €100 and ≥ 5× the month's median purchase). */
function oneOffs(cm) { const amts = cm.outs.filter(t => fundOf(t) === 'budget' && t.amount > 0).map(t => t.amount), med = median(amts) || 0; return cm.outs.filter(t => fundOf(t) === 'budget' && t.amount >= 10000 && t.amount >= med * 5); }
function typicalMonth() {
  const c = cache(); if (c.typ) return c.typ;
  const ck = curMonth(), st = state.settings.startMonth || ck, vals = [];
  for (let i = 1; i <= 6; i++) { const k = addMonths(ck, -i); if (k < st) break; if (!state.months[k]) continue; const cm = computeMonth(k); vals.push(cm.spent - sum(oneOffs(cm), t => t.amount)); }
  if (vals.length) return c.typ = { spend: Math.round(Math.max(median(vals), sum(vals) / vals.length)), months: vals.length, basis: 'finished months' };
  const cm = computeMonth(ck); if (cm.cur >= 7) { const ex = sum(oneOffs(cm), t => t.amount); return c.typ = { spend: Math.round((cm.spentElapsed - ex) / cm.cur * cm.N), months: 0, partial: true, oneOff: ex }; }
  return c.typ = { spend: Math.max(0, cm.pool), months: 0, budgetOnly: true };
}
/* Per category: projected month total vs your 3-month average, and vs an optional limit. */
function categoryTrends(cm) {
  const st = state.settings.startMonth || cm.key, prev = [1, 2, 3].map(i => addMonths(cm.key, -i)).filter(k => k >= st && state.months[k]).map(k => computeMonth(k));
  const scale = cm.closed ? 1 : cm.cur > 0 ? cm.N / Math.max(cm.cur, 7) : 0, out = {};
  const cats = new Set([...Object.keys(cm.byCat), ...state.settings.categories.filter(c => c.limit).map(c => c.id)]);
  for (const c of cats) {
    const spent = cm.byCat[c] || 0, proj = Math.round(spent * scale), avg = prev.length ? sum(prev, p => p.byCat[c] || 0) / prev.length : null, limit = catById(c).limit || null;
    let text = '', cls = '';
    if (limit) { text = proj > limit ? `on pace for ${fmt(proj, { whole: true })}` : `${fmt(Math.max(0, limit - spent), { whole: true })} left`; cls = proj > limit ? 'neg' : 'pos'; }
    else if (avg && avg >= 1000 && (cm.closed || cm.cur >= 10)) { const d = proj / avg - 1; if (Math.abs(d) >= .1) { text = `${d > 0 ? '+' : '−'}${Math.round(Math.abs(d) * 100)}% vs avg ${fmt(avg, { whole: true })}`; cls = d > .25 ? 'neg' : d < -.1 ? 'pos' : 'muted'; } }
    out[c] = { spent, proj, avg, limit, text, cls };

}
/* Ways to save, from your own plan and entries. Donations, insurance and housing are never suggested. */
function waysToSave() {
  const out = [], p = state.months[curMonth()] || planFromRecurring(), kept = state.settings.waysKept || {}, seen = state.settings.billSeen || {};
  const bills = p.bills.filter(b => !['donations', 'insurance', 'housing'].includes(groupOf(b)));
  const phones = bills.filter(b => groupOf(b) === 'phone');
  if (phones.length >= 2) { const s = [...phones].sort((a, b) => a.amount - b.amount)[0]; out.push({ key: 'phones', title: `Two mobile contracts`, text: `You pay for ${phones.map(b => `${esc(b.name)} (${fmt(b.amount)})`).join(' and ')}. If one is only a backup, cancelling ${esc(s.name)} saves the most for the least.`, monthly: s.amount, kind: 'overlap' }); }
  for (const b of p.bills) { const o = seen[b.id]; if (o && o.amount > b.amount + Math.max(50, b.amount * .02)) out.push({ key: `price:${b.id}:${o.amount}`, title: `${b.name} costs more than planned`, text: `Charged ${fmt(o.amount)} on ${fmtDate(o.date)}, your plan says ${fmt(b.amount)}. If the price went up, update the plan or look for a cheaper option.`, monthly: o.amount - b.amount, kind: 'price' }); }
  const subs = bills.filter(b => groupOf(b) === 'subscriptions');
  for (const b of subs) out.push({ key: `sub:${b.id}`, title: b.name, text: `${fmt(b.amount)} a month is ${fmt(b.amount * 12)} a year. Still worth it?`, monthly: b.amount, kind: 'sub' });
  // repeated small purchases over the last 30 days
  const since = (() => { const d = new Date(); d.setDate(d.getDate() - 30); return isoDate(d); })(), small = {};
  allTx().filter(t => isOut(t) && t.date >= since && t.amount > 0 && t.amount <= 1500 && fundOf(t) === 'budget' && !['transport', 'groceries', 'household', 'health', 'education'].includes(t.category)).forEach(t => { const k = normName(t.name); (small[k] ||= { name: t.name, n: 0, v: 0 }); small[k].n++; small[k].v += t.amount; });
  for (const [k, s] of Object.entries(small)) if (s.n >= 5) out.push({ key: `small:${k}`, title: `${s.name}, ${s.n} times in 30 days`, text: `${fmt(s.v)} a month adds up to about ${fmt(s.v * 12, { whole: true })} a year. Halving it would leave ${fmt(s.v * 6, { whole: true })} a year for savings.`, monthly: Math.round(s.v / 2), kind: 'small' });
  const deliv = allTx().filter(t => isOut(t) && t.date >= since && /deliveroo|uber eats|wolt|lieferando|just eat|foodora|mjam/i.test(t.name));

  const cm = computeMonth(curMonth());
  if (cm.closed || cm.cur >= 10) for (const [c, t] of Object.entries(categoryTrends(cm))) if (!t.limit && t.avg && t.proj > t.avg * 1.25 && t.proj - t.avg > 2500 && !['travel', 'gifts', 'health', 'education'].includes(c)) out.push({ key: `cat:${c}:${curMonth()}`, title: `${catById(c).name} above your usual`, text: `Heading for ${fmt(t.proj, { whole: true })} this month, against an average of ${fmt(t.avg, { whole: true })}.`, monthly: t.proj - t.avg, kind: 'trend' });
