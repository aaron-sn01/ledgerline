urse von Yahoo Finance und speichert sie neben der App. Kryptokurse kommen live von CoinGecko. Einmalige Einrichtung:", "Take the tour": "Tour starten", "Setup help for your AI": "Einrichtungshilfe für deine KI", "Show me around": "Zeig mir die App", "Look around first (with sample data)": "Erst mal umsehen (mit Beispieldaten)", "Install the app": "App installieren", "e.g. Interest, refund": "z. B. Zinsen, Erstattung", "What is it? e.g. Jacket, Netflix": "Was ist es? z. B. Jacke, Netflix", "Into": "In", "This month’s budget": "Budget dieses Monats", "Adds to what you can spend this month": "Erhöht, was du diesen Monat ausgeben kannst", "Money in, budget": "Einnahme, Budget", "Money in, savings": "Einnahme, Ersparnisse", "Bought, from savings": "Gekauft, aus Ersparnissen", "From my budget": "Aus meinem Budget", "Investment plan": "Sparplan", "Round-ups leave your account, so they reduce this month’s budget. Shares are worked out from that day’s price.": "Aufrundungen verlassen dein Konto und verringern daher das Budget dieses Monats. Die Anteile werden aus dem Kurs dieses Tages berechnet.", "Calculated from your own budget and spending. A guide for your decision, not financial advice.": "Berechnet aus deinem eigenen Budget und deinen Ausgaben. Eine Hilfe für deine Entscheidung, keine Finanzberatung.", "Enter a price to see what it does to your month, your savings and your safety net.": "Gib einen Preis ein, um zu sehen, was er für deinen Monat, deine Ersparnisse und deinen Notgroschen bedeutet.", "Check your accounts": "Prüfe deine Konten", "Check your share counts": "Prüfe deine Anteile", "Compare with Trade Republic, flatex and Coinbase. Change any that differ.": "Vergleiche mit Trade Republic, flatex und Coinbase. Ändere, was abweicht.", "The quickest way: import your statements and portfolio screenshots, which updates entries and share counts in one go. Or check the total across all your accounts below.": "Am schnellsten: Importiere deine Auszüge und Depot-Screenshots; das aktualisiert Einträge und Anteile in einem Rutsch. Oder prüfe unten die Summe aller Konten.", "Save review": "Rückblick speichern", "Days within budget": "Tage im Budget", "Debt left to repay": "Noch zu tilgende Schulden", "Don’t add": "Nicht hinzufügen", "To add": "Hinzufügen", "Edit debt": "Schuld bearbeiten", "Move it from savings to your current account to cover the gap.": "Überweise es von den Ersparnissen auf dein Girokonto, um die Lücke zu decken.", "Nothing entered for this day.": "Für diesen Tag ist nichts eingetragen.", "Projected net worth by age": "Erwartetes Vermögen nach Alter", "Unusually large. Check the category, or pay it from savings.": "Ungewöhnlich hoch. Prüfe die Kategorie oder bezahle es aus den Ersparnissen.", "How your data is stored": "Wie deine Daten gespeichert werden", "(tap to read)": "(zum Lesen tippen)", "Set up my budget (about 3 minutes)": "Mein Budget einrichten (etwa 3 Minuten)", "On your device only.": "Nur auf deinem Gerät.", "Not encrypted on the device itself.": "Auf dem Gerät selbst nicht verschlüsselt.", "Sync is optional and encrypted.": "Sync ist optional und verschlüsselt.", "Imports stay on your device.": "Importe bleiben auf deinem Gerät.", "Prices.": "Kurse.", "Your responsibility:": "Deine Verantwortung:", "Trust:": "Vertrauen:", "Everything you enter is saved in this browser’s storage on this device. There is no Ledgerline server and no account; the person who shared the app with you can’t see your data.": "Alles, was du eingibst, wird im Speicher dieses Browsers auf diesem Gerät gesichert. Es gibt keinen Ledgerline-Server und kein Konto; die Person, die dir die App geschickt hat, kann deine Daten nicht sehen.", "It’s protected by your device’s own lock. Anyone who can use your unlocked device could open it, so you can add Face ID, Touch ID or a PIN in Settings → App lock.": "Geschützt ist es durch die Sperre deines Geräts. Wer dein entsperrtes Gerät benutzen kann, könnte die App öffnen; deshalb kannst du unter Einstellungen → App-Sperre Face ID, Touch ID oder eine PIN hinzufügen.", "If you turn it on, your data is encrypted on your device with your passphrase before it’s stored in your own GitHub account. GitHub can’t read it, and nobody can recover it if you lose the passphrase.": "Wenn du ihn aktivierst, werden deine Daten auf deinem Gerät mit deiner Passphrase verschlüsselt, bevor sie in deinem eigenen GitHub-Konto gespeichert werden. GitHub kann sie nicht lesen, und niemand kann sie wiederherstellen, wenn du die Passphrase verlierst.", "Screenshots and PDFs are read on your device and never uploaded. The text-recognition tools are downloaded once from public code servers (cdnjs, jsDelivr), which see that a download happened, not your files.": "Screenshots und PDFs werden auf deinem Gerät gelesen und nie hochgeladen. Die Texterkennung wird einmalig von öffentlichen Code-Servern (cdnjs, jsDelivr) geladen; die sehen, dass etwas heruntergeladen wurde, aber nicht deine Dateien.", "To show prices, the app loads a public price file from GitHub and crypto prices from CoinGecko. Those requests don’t contain your data, but like any website visit they reveal your internet address.": "Für Kurse lädt die App eine öffentliche Kursdatei von GitHub und Kryptokurse von CoinGecko. Diese Anfragen enthalten keine Daten von dir, verraten aber wie jeder Webseitenbesuch deine Internetadresse.", "(optional): a payment’s amount and shop name wait unencrypted in your own GitHub sync file for a short time, until the app picks them up and deletes them.": "(optional): Betrag und Händler einer Zahlung liegen kurz unverschlüsselt in deiner eigenen GitHub-Sync-Datei, bis die App sie abholt und löscht.", "clearing this browser’s data or deleting the app from your home screen deletes your data on this device. Download a backup now and then (Settings → Backup & export).": "Wenn du die Browserdaten löschst oder die App vom Home-Bildschirm entfernst, sind deine Daten auf diesem Gerät weg. Lade ab und zu ein Backup herunter (Einstellungen → Backup & Export).", "the app’s code is public and can be read by anyone. Updates come from the person who shared it with you; like any app, you rely on them not to change it to send data elsewhere.": "Der Code der App ist öffentlich und für alle lesbar. Updates kommen von der Person, die sie dir geschickt hat; wie bei jeder App verlässt du dich darauf, dass sie sie nicht so ändert, dass Daten woandershin gesendet werden.", "Add a name, such as the shop.": "Gib einen Namen ein, etwa den Laden.", "Enter an amount above zero.": "Gib einen Betrag über null ein.", "Heads up: this month can’t be fully recovered now.": "Achtung: Dieser Monat lässt sich jetzt nicht mehr ganz aufholen.", "Name and an amount above zero are required.": "Name und ein Betrag über null sind nötig.", "Sectors": "Sektoren", "Countries": "Länder", "Currencies": "Währungen", "Add income or expenses to see the flow.": "Trag Einnahmen oder Ausgaben ein, um den Geldfluss zu sehen.", "After two weeks of entries you’ll see the odds of finishing the month within budget.": "Nach zwei Wochen mit Einträgen siehst du, wie wahrscheinlich du den Monat im Budget abschließt.", "Costs you": "Kostet dich", "Daily spending calendar": "Kalender der täglichen Ausgaben", "Debt repaid": "Getilgt", "Einnahme → To cash savings": "Einnahme → In die Ersparnisse", "Every day currently gets the same share. After three weeks of entries, Ledgerline learns which weekdays you spend more on and sizes each day’s budget to match.": "Im Moment bekommt jeder Tag denselben Anteil. Nach drei Wochen mit Einträgen lernt Ledgerline, an welchen Wochentagen du mehr ausgibst, und passt das Tagesbudget daran an.", "Into cash savings": "In die Ersparnisse", "Kept aside for that month": "Für diesen Monat zurückgelegt", "Likely to cash savings": "Voraussichtlich in die Ersparnisse", "Move it from your current account to a savings account now, so the numbers match reality.": "Überweise es jetzt vom Girokonto auf ein Sparkonto, damit die Zahlen der Wirklichkeit entsprechen.", "Moved to savings": "In die Ersparnisse verschoben", "No debts. Nice.": "Keine Schulden. Schön.", "No entries.": "Keine Einträge.", "No expiration": "No expiration", "No spending recorded yet.": "Noch keine Ausgaben erfasst.", "Nothing entered yet today.": "Heute noch nichts eingetragen.", "Saveback, a bonus": "Saveback, ein Bonus", "Set a target date or a repayment plan under Edit to see when you’ll be debt-free.": "Lege unter Bearbeiten ein Zieldatum oder einen Tilgungsplan fest, um zu sehen, wann du schuldenfrei bist.", "Spending by category": "Ausgaben nach Kategorie", "To cash savings": "In die Ersparnisse", "assuming you use the whole budget": "wenn du das ganze Budget nutzt", "estimated after a week of entries": "geschätzt nach einer Woche mit Einträgen", "interest running": "Zinsen laufen", "Enter your income and fixed costs in Settings → Recurring plan, then this shows how many months your cash savings would last.": "Trag dein Einkommen und deine Fixkosten unter Einstellungen → Dauerplan ein, dann zeigt dies, wie viele Monate deine Ersparnisse reichen würden.", "“Invested a month” defaults to your plans plus recent round-ups and saveback (you’ve set your own; clear the field to go back). “Paid in” is your starting amount plus every euro you add, minus anything you take out, so the gap to the middle outcome is what compounding earns. Returns are after inflation; cash is held flat.": "„Monatlich investiert“ entspricht standardmäßig deinen Plänen plus den letzten Aufrundungen und Saveback (du hast einen eigenen Wert gesetzt; leere das Feld, um zurückzukehren). „Eingezahlt“ ist dein Startbetrag plus jeder Euro, den du hinzufügst, minus Entnahmen; der Abstand zum mittleren Ergebnis ist also, was der Zinseszins erwirtschaftet. Renditen sind nach Inflation; Bargeld wird konstant gehalten.", "Assets": "Vermögenswerte", "Erase all data in this browser": "Alle Daten in diesem Browser löschen", "Paid in advance: arrives on this day of the month before": "Im Voraus gezahlt: kommt an diesem Tag im Vormonat", "Amount per month": "Betrag pro Monat", "Trade Republic, Scalable Capital, Sparkasse, comdirect, Wise, Finanzguru, flatex, Coinbase": "Trade Republic, Scalable Capital, Sparkasse, comdirect, Wise, Finanzguru, flatex, Coinbase", "The amount couldn’t be read. Type it in and tick the entry to add it.": "Der Betrag war nicht lesbar. Trag ihn ein und setz das Häkchen, um den Eintrag hinzuzufügen.", "The date couldn’t be read, so today is used. Check it.": "Das Datum war nicht lesbar, deshalb steht hier heute. Bitte prüfen.", "Change": "Ändern", "Keep": "Behalten", "Show": "Anzeigen", "Hide": "Ausblenden", "Day-to-day spending still to come": "Noch zu erwartende Alltagsausgaben", "Fixed costs (by group)": "Fixkosten (nach Gruppe)", "Tap or hover over a colour for details. The blue mark is the month’s income.": "Tippe auf eine Farbe oder fahr darüber für Details. Die blaue Markierung ist das Einkommen des Monats.", "Media & streaming": "Medien & Streaming", "Apps & software": "Apps & Software", "Phone & internet": "Telefon & Internet", "Gifts & donations": "Geschenke & Spenden", "Darker part of a bar: fixed costs.": "Dunklerer Teil eines Balkens: Fixkosten.", "Plans, savings and repayments: income not spent.": "Sparpläne, Ersparnisse, Tilgung: nicht ausgegebenes Einkommen.", "Automatic backup on your Mac": "Automatisches Backup auf dem Mac", "Estimated": "Geschätzt", "estimated": "geschätzt", "Est.": "Gesch.", "Today, ": "Heute, "};
const DE_BLOCK = {"Sync needs a free GitHub account, where your encrypted sync file is kept. You set it up once (about 10 minutes); after that it runs by itself.": "Sync braucht ein kostenloses GitHub-Konto, in dem deine verschlüsselte Sync-Datei liegt. Du richtest es einmal ein (etwa 10 Minuten); danach läuft es von selbst.", "No GitHub account yet? Create one for free at github.com/signup (email, password, username) and confirm your email address.": "Noch kein GitHub-Konto? Leg kostenlos eins an unter <a href=\"https://github.com/signup\" target=\"_blank\" rel=\"noopener\">github.com/signup</a> (E-Mail, Passwort, Benutzername) und bestätige deine E-Mail-Adresse.", "Signed in, open github.com/settings/tokens/new. If GitHub asks, choose Tokens (classic).": "Angemeldet öffnest du <a href=\"https://github.com/settings/tokens/new\" target=\"_blank\" rel=\"noopener\">github.com/settings/tokens/new</a>. Falls GitHub fragt, wähle <b>Tokens (classic)</b>.", "Under Note type “Ledgerline”, set Expiration to No expiration, tick only the box gist, then click Generate token at the bottom.": "Gib unter <b>Note</b> „Ledgerline“ ein, stelle <b>Expiration</b> auf <b>No expiration</b>, hake <b>nur</b> das Kästchen <b>gist</b> an und klicke unten auf <b>Generate token</b>.", "Copy the token (it starts with ghp_) and save it in your password manager. GitHub shows it only once.": "Kopiere das Token (es beginnt mit <code>ghp_</code>) und speichere es in deinem Passwortmanager. GitHub zeigt es nur einmal.", "First device: paste the token below, choose a passphrase (at least 8 characters, also in your password manager; it can’t be recovered), leave Sync ID empty, then Create sync file.": "Erstes Gerät: Füge das Token unten ein, wähle eine Passphrase (mindestens 8 Zeichen, ebenfalls im Passwortmanager; sie lässt sich nicht wiederherstellen), lass die Sync-ID leer und tippe auf <b>Sync-Datei erstellen</b>.", "Every other device: the same token, the Sync ID shown on the first device and the same passphrase, then Connect.": "Jedes weitere Gerät: dasselbe Token, die <b>Sync-ID</b> vom ersten Gerät und dieselbe Passphrase, dann <b>Verbinden</b>.", "Put Ledgerline on your home screen or dock: Settings → Install the app shows how for iPhone, iPad, Mac, Windows and Android.": "Leg Ledgerline auf den Home-Bildschirm oder ins Dock: <b>Einstellungen → App installieren</b> zeigt, wie es bei iPhone, iPad, Mac, Windows und Android geht.", "Tap ▶ once to run it. When iOS asks whether it may connect to api.github.com, tap Allow (or Always Allow). Without this, the automation can’t send anything when it runs by itself. The test run arrives without an amount; Ledgerline lists it as unreadable and you can remove it.": "Tippe einmal auf <b>▶</b>, um sie auszuführen. Wenn iOS fragt, ob eine Verbindung zu <b>api.github.com</b> erlaubt ist, tippe auf <b>Erlauben</b> (oder <b>Immer erlauben</b>). Ohne das kann die Automation nichts senden, wenn sie von selbst läuft. Der Testlauf kommt ohne Betrag an; Ledgerline zeigt ihn als unlesbar, und du kannst ihn entfernen.", "Took a screenshot? Tap its thumbnail, then Done → Copy and Delete. Back here, tap Paste screenshot. On a Mac, ⌘V works anywhere in this window.": "Screenshot gemacht? Tippe auf die Vorschau, dann <b>Fertig → Kopieren und löschen</b>. Hier tippst du dann auf <b>Screenshot einfügen</b>. Auf dem Mac funktioniert ⌘V überall in diesem Fenster.", "A list of triggers appears: Time of Day, Alarm, Email, … Scroll down and tap Transaction, the one with the Wallet icon and the text “When I tap my card”. If you instead see actions like Open Card, Request Payment or Send Payment, you’re in the wrong place: close it and start again from the Automation tab.": "Eine Liste von Auslösern erscheint: Tageszeit, Wecker, E-Mail, … Scrolle nach unten und tippe auf <b>Transaktion</b>, den Eintrag mit dem Wallet-Symbol und dem Text „Wenn ich meine Karte verwende“. Siehst du stattdessen Aktionen wie <i>Karte öffnen</i>, <i>Zahlung anfordern</i> oder <i>Zahlung senden</i>, bist du an der falschen Stelle: schließe das und beginne erneut im Tab „Automation“.", "Add what you spend on the Today page, or import screenshots and statements with Import.": "Erfasse deine Ausgaben auf der Seite <b>Heute</b> oder importiere Screenshots und Auszüge mit <b>Importieren</b>.", "Add your investments on the Wealth page and any loans on the Debt page.": "Trag deine Investments auf der Seite <b>Vermögen</b> und Kredite auf der Seite <b>Schulden</b> ein.", "Want it on your phone too? Set up sync in Settings. The Manual explains everything step by step, and every box has a ?.": "Auch auf dem Handy? Richte <b>Sync</b> in den Einstellungen ein. Die <b>Anleitung</b> erklärt alles Schritt für Schritt, und jede Box hat ein <b>?</b>.", "How your data is stored (tap to read)": "<b>Wie deine Daten gespeichert werden</b> (zum Lesen tippen)", "On your device only. Everything you enter is saved in this browser’s storage on this device. There is no Ledgerline server and no account; the person who shared the app with you can’t see your data.": "<b>Nur auf deinem Gerät.</b> Alles, was du eingibst, wird im Speicher dieses Browsers auf diesem Gerät gesichert. Es gibt keinen Ledgerline-Server und kein Konto; die Person, die dir die App geschickt hat, kann deine Daten nicht sehen.", "Not encrypted on the device itself. It’s protected by your device’s own lock. Anyone who can use your unlocked device could open it, so you can add Face ID, Touch ID or a PIN in Settings → App lock.": "<b>Auf dem Gerät selbst nicht verschlüsselt.</b> Geschützt ist es durch die Sperre deines Geräts. Wer dein entsperrtes Gerät benutzen kann, könnte die App öffnen; deshalb kannst du unter Einstellungen → App-Sperre Face ID, Touch ID oder eine PIN hinzufügen.", "Sync is optional and encrypted. If you turn it on, your data is encrypted on your device with your passphrase before it’s stored in your own GitHub account. GitHub can’t read it, and nobody can recover it if you lose the passphrase.": "<b>Sync ist optional und verschlüsselt.</b> Wenn du ihn aktivierst, werden deine Daten auf deinem Gerät mit deiner Passphrase verschlüsselt, bevor sie in deinem eigenen GitHub-Konto gespeichert werden. GitHub kann sie nicht lesen, und niemand kann sie wiederherstellen, wenn du die Passphrase verlierst.", "Imports stay on your device. Screenshots and PDFs are read on your device and never uploaded. The text-recognition tools are downloaded once from public code servers (cdnjs, jsDelivr), which see that a download happened, not your files.": "<b>Importe bleiben auf deinem Gerät.</b> Screenshots und PDFs werden auf deinem Gerät gelesen und nie hochgeladen. Die Texterkennung wird einmalig von öffentlichen Code-Servern (cdnjs, jsDelivr) geladen; die sehen, dass etwas heruntergeladen wurde, aber nicht deine Dateien.", "Prices. To show prices, the app loads a public price file from GitHub and crypto prices from CoinGecko. Those requests don’t contain your data, but like any website visit they reveal your internet address.": "<b>Kurse.</b> Für Kurse lädt die App eine öffentliche Kursdatei von GitHub und Kryptokurse von CoinGecko. Diese Anfragen enthalten keine Daten von dir, verraten aber wie jeder Webseitenbesuch deine Internetadresse.", "Apple Pay automation (optional): a payment’s amount and shop name wait unencrypted in your own GitHub sync file for a short time, until the app picks them up and deletes them.": "<b>Apple-Pay-Automation</b> (optional): Betrag und Händler einer Zahlung liegen kurz unverschlüsselt in deiner eigenen GitHub-Sync-Datei, bis die App sie abholt und löscht.", "Your responsibility: clearing this browser’s data or deleting the app from your home screen deletes your data on this device. Download a backup now and then (Settings → Backup & export).": "<b>Deine Verantwortung:</b> Wenn du die Browserdaten löschst oder die App vom Home-Bildschirm entfernst, sind deine Daten auf diesem Gerät weg. Lade ab und zu ein Backup herunter (Einstellungen → Backup & Export).", "Trust: the app’s code is public and can be read by anyone. Updates come from the person who shared it with you; like any app, you rely on them not to change it to send data elsewhere.": "<b>Vertrauen:</b> Der Code der App ist öffentlich und für alle lesbar. Updates kommen von der Person, die sie dir geschickt hat; wie bei jeder App verlässt du dich darauf, dass sie sie nicht so ändert, dass Daten woandershin gesendet werden.", "Create a token with only the gist permission at github.com/settings/tokens/new.": "Erstelle unter <b>github.com/settings/tokens/new</b> ein Token nur mit der Berechtigung <code>gist</code>.", "First device: paste the token, choose a passphrase, then Create sync file. Other devices: token, sync ID and the same passphrase, then Connect.": "Erstes Gerät: Token einfügen, eine Passphrase wählen, dann <b>Sync-Datei erstellen</b>. Weitere Geräte: Token, Sync-ID und dieselbe Passphrase, dann <b>Verbinden</b>.", "If nothing arrives: on the iPhone open Settings → Apps → Wallet and make sure Mobile Data is on; check the automation still says Run Immediately; and if you ever replace your GitHub token, paste the new one into the automation too. While a payment waits for Ledgerline it sits unencrypted on your sync file (amount and shop only) and is deleted as soon as it’s picked up.": "<b>Wenn nichts ankommt:</b> Öffne auf dem iPhone <b>Einstellungen → Apps → Wallet</b> und prüfe, ob <b>Mobile Daten</b> aktiv sind; prüfe, ob die Automation noch auf „Sofort ausführen“ steht; und wenn du dein GitHub-Token ersetzt, trag das neue auch in der Automation ein. Solange eine Zahlung auf Ledgerline wartet, liegt sie unverschlüsselt in deiner Sync-Datei (nur Betrag und Händler) und wird gelöscht, sobald sie abgeholt ist.", "In the bar above the keyboard, tap Shortcut Input to insert it. Tap the inserted Shortcut Input bubble and choose Amount.": "Tippe in der Leiste über der Tastatur auf <b>Kurzbefehleingabe</b>, um sie einzufügen. Tippe auf die eingefügte Blase und wähle <b>Betrag</b>.", "In the repository choose Add file, then Create new file. Name it .github/workflows/update-prices.yml, paste in the contents of update-prices.yml, and commit.": "Wähle im Repository <b>Add file</b>, dann <b>Create new file</b>. Nenne die Datei <code>.github/workflows/update-prices.yml</code>, füge den Inhalt von <code>update-prices.yml</code> ein und bestätige mit Commit.", "On a Mac, choose Save as PDF in the print window. On iPhone, tap the share icon in the print preview, then Save to Files.": "Auf dem Mac wählst du im Druckfenster <b>Als PDF sichern</b>. Auf dem iPhone tippst du in der Druckvorschau auf das Teilen-Symbol und dann auf <b>In Dateien sichern</b>.", "On newer iPhones the automation opens as a shortcut that starts with “When Any Card is tapped”, with switches for Automation (leave it on) and Notify. That’s the right place: skip to step 4 and add the action with the Search box at the bottom. The payment details are then called Transaction or Shortcut Input; either works in steps 10 and 11.": "<b>Auf neueren iPhones</b> öffnet sich die Automation als Kurzbefehl, der mit <b>„Wenn eine beliebige Karte verwendet wird“</b> beginnt, mit Schaltern für <b>Automation</b> (eingeschaltet lassen) und <b>Mitteilen</b>. Das ist richtig: springe zu Schritt 4 und füge die Aktion über das <b>Suchfeld</b> unten hinzu. Die Zahlungsdaten heißen dann <b>Transaktion</b> oder <b>Kurzbefehleingabe</b>; beides funktioniert in den Schritten 10 und 11.", "Open Ledgerline. A banner says “1 Apple Pay payment to confirm”, or the payment is already added. You can also tap Check for payments now below.": "Öffne Ledgerline. Ein Hinweis zeigt „1 Apple-Pay-Zahlung zu bestätigen“, oder die Zahlung ist schon eingetragen. Du kannst auch unten auf <b>Jetzt nach Zahlungen suchen</b> tippen.", "Open the Actions tab, choose Update prices, then Run workflow, to fetch prices right away.": "Öffne den Tab <b>Actions</b>, wähle <b>Update prices</b> und dann <b>Run workflow</b>, um sofort Kurse zu laden.", "Open the Shortcuts app and tap Automation in the bar at the bottom (not “Shortcuts”). Tap + at the top right (or New Automation if you have none yet).": "Öffne die App <b>Kurzbefehle</b> und tippe unten in der Leiste auf <b>Automation</b> (nicht „Kurzbefehle“). Tippe oben rechts auf <b>+</b> (oder auf <b>Neue Automation</b>, falls du noch keine hast).", "Tap Done at the top right. The automation is saved.": "Tippe oben rechts auf <b>Fertig</b>. Die Automation ist gespeichert.", "Tap New Blank Automation, then Add Action, search for Get Contents of URL and tap it.": "Tippe auf <b>Neue leere Automation</b>, dann auf <b>Aktion hinzufügen</b>, suche nach <b>Inhalte von URL abrufen</b> und tippe darauf.", "Tap the blue word URL and paste the web address from step 2.": "Tippe auf das blaue Wort <b>URL</b> und füge die <b>Webadresse</b> aus Schritt 2 ein.", "Tap the small arrow › next to the address to show more options. Set Method to POST.": "Tippe auf den kleinen Pfeil <b>›</b> neben der Adresse, um weitere Optionen zu sehen. Stelle <b>Methode</b> auf <b>POST</b>.", "Type another |, insert Shortcut Input again, tap it and choose Merchant. The field now reads: ledgerline|Amount|Merchant.": "Tippe ein weiteres <code>|</code>, füge erneut <b>Kurzbefehleingabe</b> ein, tippe darauf und wähle <b>Händler</b>. Das Feld lautet jetzt: <code>ledgerline|Betrag|Händler</code>.", "Under Card, select the card(s) you pay with. Leave Merchant and Category as they are. Choose Run Immediately, and switch off Notify When Run if you don’t want a notice each time. Tap Next.": "Wähle unter <b>Karte</b> die Karte(n), mit denen du zahlst. Händler und Kategorie bleiben, wie sie sind. Wähle <b>Sofort ausführen</b> und schalte <b>Bei Ausführung mitteilen</b> aus, wenn du nicht jedes Mal einen Hinweis willst. Tippe auf <b>Weiter</b>.", "Under Headers, tap Add new header. Type Authorization as the key, and paste the Authorization value from step 2 (it starts with “Bearer”) as the text.": "Tippe unter <b>Header</b> auf <b>Neuen Header hinzufügen</b>. Gib <code>Authorization</code> als Schlüssel ein und füge den <b>Authorization</b>-Wert aus Schritt 2 (beginnt mit „Bearer“) als Text ein.", "Under Request Body, choose JSON. Tap Add new field → Text. Type body as the key.": "Wähle unter <b>Anfragetext</b> die Option <b>JSON</b>. Tippe auf <b>Neues Feld hinzufügen</b> → <b>Text</b>. Gib <code>body</code> als Schlüssel ein.", "Upload fetch_prices.py, fetch_compositions.py and tickers.json to your repository, the same way as index.html.": "Lade <code>fetch_prices.py</code>, <code>fetch_compositions.py</code> und <code>tickers.json</code> genauso in dein Repository hoch wie <code>index.html</code>.", "When you pay with Apple Pay at a card terminal (iPhone or Watch held to the reader), your iPhone can send the payment to Ledgerline by itself. Online and in-app payments aren’t included. You set this up once in Apple’s Shortcuts app; it takes about five minutes. Do it on the iPhone, with this page open in Ledgerline so you can copy the two values below.": "Wenn du an einem Kartenterminal mit Apple Pay zahlst (iPhone oder Watch an das Lesegerät gehalten), kann dein iPhone die Zahlung selbst an Ledgerline senden. Zahlungen online und in Apps gehören nicht dazu. Das richtest du einmal in Apples App <b>Kurzbefehle</b> ein; es dauert etwa fünf Minuten. Mach es auf dem iPhone, mit dieser Seite in Ledgerline offen, damit du die beiden Werte unten kopieren kannst.", "Tap the value box next to it and type ledgerline| (on the iPhone keyboard the | is under 123 → #+=).": "Tippe auf das Wertfeld daneben und gib <code>ledgerline|</code> ein (auf der iPhone-Tastatur liegt der <code>|</code> unter <b>123</b> → <b>#+=</b>).", "Pay for something small with Apple Pay. (Running the automation by hand doesn’t work: without a real payment there’s no amount or shop.)": "Bezahle etwas Kleines mit Apple Pay. (Die Automation von Hand auszuführen funktioniert nicht: Ohne echte Zahlung gibt es keinen Betrag und keinen Händler.)", "Set up sync on this device first (Settings → Sync between devices). The address and token below fill in once sync is connected.": "Richte zuerst Sync auf diesem Gerät ein (Einstellungen → Sync zwischen Geräten). Adresse und Token unten erscheinen, sobald Sync verbunden ist."};

    const box = $('#tour'); if (!box) return; const spot = box.querySelector('.tour-spot'), card = box.querySelector('.tour-card'), el = this.target(), st = TOUR_STEPS[this.i] || {};
    if (!el) { spot.style.cssText = 'display:none'; card.classList.remove('sheet'); card.style.cssText = 'left:50%;top:50%;transform:translate(-50%,-50%)'; box.classList.add('dim'); return; }
    box.classList.remove('dim');
    const pad = 6, gap = 14, topBar = (document.querySelector('.topbar')?.getBoundingClientRect().bottom || 0) + 8, phone = innerWidth < 700;
    const tabBar = phone ? (document.getElementById('tabbar')?.getBoundingClientRect().height || 0) : 0;
    let r = el.getBoundingClientRect();
    const show = (spotTop, spotH, limitBottom = innerHeight - 8) => {
      const top = Math.max(topBar, spotTop - pad), bottom = Math.min(limitBottom, spotTop + spotH + pad, innerHeight - 8);
      spot.style.cssText = `display:block;left:${Math.max(4, r.left - pad)}px;top:${top}px;width:${Math.min(innerWidth - 8, r.width + pad * 2)}px;height:${Math.max(20, bottom - top)}px`;
    };
    if (phone) {
      card.classList.add('sheet'); card.style.cssText = '';
      const ch = card.offsetHeight, room = innerHeight - tabBar - ch - gap - topBar - 12;   // visible space above the card
      const want = Math.min(r.height, st.clip || r.height, room);
      if (r.top < topBar || r.top + want > topBar + room) { window.scrollBy(0, r.top - topBar - Math.max(0, (room - want) / 2)); r = el.getBoundingClientRect(); }
      const cardTop = card.getBoundingClientRect().top;
      show(r.top, Math.min(r.height, st.clip || r.height), cardTop - gap);
      return;
    }
    card.classList.remove('sheet');
    const cw = Math.min(380, innerWidth - 32); card.style.cssText = `width:${cw}px;left:0;top:0;visibility:hidden`; const ch = card.offsetHeight;
    // keep tall targets from filling the screen: show at most what fits
    let h = Math.min(r.height, st.clip || r.height);
    const fitsSide = (side) => side === 'right' ? r.right + gap + cw < innerWidth - 12 : r.left - gap - cw > 12;
    const below = () => r.top + h + gap + ch < innerHeight - 12, above = () => r.top - gap - ch > topBar;
    let pos = null;
    if (fitsSide('right')) pos = 'right'; else if (fitsSide('left')) pos = 'left';
    if (!pos) {
      if (!below() && !above()) {   // make room: scroll so the target starts near the top and clip its highlight
        window.scrollBy(0, r.top - topBar - 4); r = el.getBoundingClientRect();
        h = Math.min(h, innerHeight - r.top - gap - ch - 16);
      }
      pos = below() ? 'below' : 'above';
    } else if (r.top < topBar || r.top + Math.min(h, innerHeight * .8) > innerHeight - 12) { window.scrollBy(0, r.top - topBar - 4); r = el.getBoundingClientRect(); h = Math.min(h, innerHeight - r.top - 16); }
    let left, top;
    if (pos === 'right') { left = r.right + gap; top = Math.min(Math.max(topBar, r.top), innerHeight - ch - 12); }
    else if (pos === 'left') { left = r.left - gap - cw; top = Math.min(Math.max(topBar, r.top), innerHeight - ch - 12); }
    else { left = Math.min(Math.max(16, r.left), innerWidth - cw - 16); top = pos === 'below' ? r.top + h + gap : r.top - gap - ch; }
    card.style.cssText = `left:${left}px;top:${top}px;width:${cw}px`;
    // the highlight never reaches under the card
    show(r.top, Math.max(24, h), pos === 'below' ? top - 4 : innerHeight - 8);
    if (pos === 'above') { const sTop = Math.max(topBar, r.top - pad, top + ch + 4); spot.style.top = sTop + 'px'; spot.style.height = Math.max(20, Math.min(r.top + h + pad, innerHeight - 8) - sTop) + 'px'; }
  },
};
Object.assign(ACTIONS, {
  'tour-start': () => Tour.start(0),
  'tour-next': () => { if (Tour.i < TOUR_STEPS.length - 1) { Tour.i++; Tour.show(); } else { Tour.stop(); ui.view = 'overview'; render(); if (state.settings.sample && state.settings.sampleRecurring) toast(L2('That was sample data. Tap “Set up my own” at the top whenever you’re ready.', 'Das waren Beispieldaten. Tippe oben auf „Eigenes einrichten“, wenn du so weit bist.')); } },
  'tour-back': () => { Tour.i = Math.max(0, Tour.i - 1); Tour.show(); },
  'tour-skip': () => { Tour.stop(); },
  // "Look around first": sample data plus the tour, with a way back to a clean setup
  'tour-sample': () => { closeDlg(); state.settings.wizardDone = 'sample'; if (!state.settings.sample) loadSample(); persist(); ui.view = 'overview'; render(); setTimeout(() => Tour.start(0), 300); },
  'sample-to-setup': () => { removeSample(); persist(); ui.wiz = null; state.settings.wizardDone = ''; render(); openWizard(1); },
});
// no pop-ups (monthly review, celebrations, what's new) while the tour is running
for (const fn of ['openReview', 'celebrate', 'maybeWrapped']) { if (typeof window[fn] === 'function') { const orig = window[fn]; window[fn] = (...a) => Tour.on ? undefined : orig(...a); } }
document.addEventListener('keydown', e => { if (!Tour.on) return; if (e.key === 'Escape') Tour.stop(); if (e.key === 'ArrowRight') ACTIONS['tour-next'](); if (e.key === 'ArrowLeft') ACTIONS['tour-back'](); });
// banner while sample data is shown on a device that has nothing of its own yet
(window.AFTER_RENDER ||= []).push(() => {
  if (!state.settings.sample || !state.settings.sampleRecurring || !['overview', 'today', 'month', 'year', 'wealth', 'debt'].includes(ui.view) || $('#main .sample-bar')) return;
  const head = $('#main .page-head'); if (!head) return;
  const bar = document.createElement('div'); bar.className = 'nudge sample-bar';
  bar.innerHTML = `<div class="n">${ICONS.info}<span>${L2('You’re looking at sample data. Remove it and set up your own whenever you’re ready.', 'Du siehst Beispieldaten. Entferne sie und richte deine eigenen ein, wann immer du so weit bist.')}</span><button class="btn small" data-act="tour-start">${L2('Tour', 'Tour')}</button><button class="btn small primary" data-act="sample-to-setup">${L2('Set up my own', 'Eigenes einrichten')}</button></div>`;
  head.after(bar);
});

const SETUP_HELP_EN = `# Help me set up Ledgerline

You are helping me set up **Ledgerline**, a free personal budget and wealth web app. I'm not technical. Please:

- Go **one step at a time**. After each step, ask me what I see on my screen before giving the next one.
- Use the exact button names below, in the language my app shows (English or German).
- Explain technical words (GitHub, token, Gist, Shortcuts) in one plain sentence when they first come up.
- Never ask me to share my token, passphrase or bank data with you.
- If something looks different from these instructions, ask me for a screenshot description and adapt.

## What Ledgerline is

A web page I add to my home screen. My data stays on my device (no account, no server). Optional: sync between my devices through an encrypted file in my own GitHub account, and an iPhone automation that sends Apple Pay payments to the app.

## 1. Install it (2 minutes)

- iPhone or iPad: open the app's link in **Safari** → **Share** → **Add to Home Screen** → **Add**, then open it from the home screen.
- Mac: in **Safari**, **File → Add to Dock**; in **Chrome**, ⋮ → **Cast, save and share** → **Create shortcut…** with **Open as window**.
- Windows: in **Edge**, ⋯ → **Apps** → **Install this site as an app**; in **Chrome**, as on the Mac.
- Android: in **Chrome**, ⋮ → **Add to Home screen**.
- The installed app keeps its own data, separate from a browser tab, so set it up there.
- A GitHub account is only needed for sync between devices and the Apple Pay automation; everything else works without one.

## 2. Set up the budget (3 minutes)

The setup wizard opens by itself. Steps: language, name (as on bank transfers), home currency (more currencies can be switched on later under Settings → Budget → “I use more than one currency”), monthly income with pay day, fixed monthly costs (rent, insurance, contracts, subscriptions), optional investment plans, today's total across all accounts, savings goal (10–20% is common). Every step can be skipped and changed later in **Settings**. To restart it: **Settings → Backup & export → Run the setup again**.

## 3. Sync between devices (optional, 10 minutes)

1. Create a free account at **github.com** if I don't have one.
2. Create a token: **github.com/settings/tokens/new** → classic token → name "Ledgerline" → expiration "No expiration" → tick **only "gist"** → **Generate token** → copy it into my password manager.
3. On my **first** device: **Settings → Sync between devices** → paste the token → choose a passphrase (at least 8 characters, saved in my password manager; it can't be recovered) → leave Sync ID empty → **Create sync file**. The **Sync ID** then appears there with a **Copy** button.
4. On **every other** device: the same token, that **Sync ID** and the same passphrase → **Connect**. On a new device the wizard's "I already use Ledgerline on another device" leads there.
5. All devices must show the same Sync ID.

## 4. Apple Pay automation (optional, iPhone, 5 minutes)

Needs iOS 17+, the card in Apple Wallet and sync set up. In Ledgerline open **Settings → Apple Pay automation**: it shows the **web address** and the **Authorization** value with Copy buttons. Then in the **Shortcuts** app:

1. Tap **Automation** in the bottom bar (not "Shortcuts") → **+** → scroll to **Transaction** (Wallet icon). If I see actions like "Open Card" or "Send Payment", I'm in the wrong place.
2. Select my card(s) → **Run Immediately** → **Next** → **New Blank Automation**. (Newer iOS: it opens as a shortcut starting "When Any Card is tapped" — that's right; keep "Automation" switched on.)
3. Add the action **Get Contents of URL** → tap **URL** → paste the web address.
4. Tap the arrow **›** → Method **POST** → Headers: **Add new header**, key \`Authorization\`, text = the Authorization value.
5. Request Body: **JSON** → **Add new field → Text** → key \`body\` → in the box labelled "Text" type \`ledgerline|\`, insert the payment variable (**Transaction** or **Shortcut Input**) and choose **Amount**, type \`|\`, insert it again and choose **Merchant**.
6. Save, then tap ▶ once and choose **Allow** (or **Always Allow**) when iOS asks to connect to api.github.com — otherwise it can't send in the background. Test with a small Apple Pay payment at a shop terminal (online Apple Pay doesn't trigger it), then open Ledgerline.

If nothing arrives: in the **iPhone’s Settings app** (not Ledgerline) turn on **Apps → Wallet → Mobile Data**; automation still on "Run Immediately"; in Ledgerline **Check for payments now**.

## 5. Daily use

Add purchases on **Today**, or **Import** screenshots (also by pasting) and PDF statements; check each entry before adding. Every box has a **?**. The **Manual** page explains everything; **Settings → Backup & export → Download backup** now and then.
`;

const SEEN_KEY = 'ledgerline:seen-version';
function maybeWhatsNew() {
  let seen = null; try { seen = localStorage.getItem(SEEN_KEY); } catch { }
  const mark = () => { try { localStorage.setItem(SEEN_KEY, APP_VERSION); } catch { } };
  if (seen === APP_VERSION) return;
  if (!seen && isFreshDevice()) { mark(); return; }               // a brand-new device gets the wizard, not a changelog
  const idx = CHANGELOG.findIndex(c => c.v === seen), items = (idx < 0 ? CHANGELOG.slice(0, 1) : CHANGELOG.slice(0, idx)).flatMap(c => c[uiLang() === 'de' ? 'de' : 'en']);
  mark(); if (!items.length || Lock.locked || Tour.on || document.querySelector('dialog[open]')) return;
  dlg(`<div class="dlg"><div class="panel-head" style="margin:0"><h2>✨ ${L2('What’s new', 'Neu')}</h2><button class="btn icon ghost right" data-act="dlg-close" aria-label="Close">${ICONS.x}</button></div>
    <ul class="whatsnew">${items.map(x => `<li>${esc(x)}</li>`).join('')}</ul><p class="small muted" style="margin:0">${L2('Version', 'Version')} ${APP_VERSION}</p>
    <div class="dlg-foot"><button class="btn" data-act="tour-start">${L2('Take the tour', 'Tour starten')}</button><button class="btn primary" data-act="dlg-close">${L2('Got it', 'Verstanden')}</button></div></div>`);
}
setTimeout(() => { if (!state.settings.wizardDone && isFreshDevice()) return; maybeWhatsNew(); }, 1800);

/* A newer version online? Installed apps (especially on the Mac Dock) can keep an old copy for a while,
   so the app checks when it opens, when it comes back to the front, and every 30 minutes. */
const UpdateCheck = {
  last: 0, found: null,
  async run(force) {
    if (!force && Date.now() - this.last < 30 * 60 * 1000) return; this.last = Date.now();
    try {
      const r = await fetch(location.pathname + '?check=' + Date.now(), { cache: 'no-store' }); if (!r.ok) return;
      const m = /const APP_VERSION = '([^']+)'/.exec(await r.text()); if (!m || m[1] === APP_VERSION) return;
      this.found = m[1]; this.banner();
    } catch { }
  },
  banner() {
    if (!this.found || $('#updBar')) return;
    const bar = document.createElement('div'); bar.id = 'updBar';
    bar.innerHTML = `<span>✨ ${L2('New version available', 'Neue Version verfügbar')} (${esc(this.found)})</span><button class="btn small primary" data-act="upd-reload">${L2('Reload', 'Neu laden')}</button><button class="btn icon ghost small" data-act="upd-later" aria-label="Later">${ICONS.x}</button>`;
    document.body.appendChild(bar);
  },
};
Object.assign(ACTIONS, { 'upd-reload': () => { location.replace(location.pathname + '?v=' + encodeURIComponent(UpdateCheck.found || Date.now())); }, 'upd-later': () => $('#updBar')?.remove() });
setTimeout(() => UpdateCheck.run(true), 4000); setInterval(() => UpdateCheck.run(), 5 * 60 * 1000);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') UpdateCheck.run(); });
// after reloading with ?v=…, tidy the address again
if (/[?&]v=/.test(location.search)) history.replaceState(null, '', location.pathname);

/* Coming back to the app after a while (phones keep it running in the background) starts on the Overview,
   like a fresh start. Short trips to another app (copying a value, a quick screenshot) keep your place. */
let _hiddenAt = 0;
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden') { _hiddenAt = Date.now(); return; }
  if (!_hiddenAt || Date.now() - _hiddenAt < 10 * 60 * 1000) return;
  _hiddenAt = 0; if (Tour.on || document.querySelector('dialog[open]')) return;
  ui.view = 'overview'; ui.todayDay = null; ui.month = curMonth(); render(); window.scrollTo(0, 0);
});
</script>
<script>
'use strict';
/* =========================================================================
   Currencies. Every amount can have its own currency (cur); totals, budgets and charts are in the
   home currency (settings.currency). Exchange rates are the ECB's daily reference rates (EUR-based),
   from frankfurter.app, cached on the device. Past amounts use the rate of their own day.
   With only the home currency in use, nothing here changes any number.
   ========================================================================= */
const CURRENCIES = ['EUR', 'USD', 'GBP', 'CHF', 'JPY', 'CAD', 'AUD', 'NZD', 'SEK', 'NOK', 'DKK', 'PLN', 'CZK', 'HUF', 'RON', 'BGN', 'ISK', 'TRY', 'CNY', 'HKD', 'SGD', 'KRW', 'INR', 'IDR', 'MYR', 'PHP', 'THB', 'ILS', 'BRL', 'MXN', 'ZAR', 'AED', 'SAR', 'QAR', 'OMR', 'BHD', 'JOD'];
/* Currencies the ECB doesn't publish but that have an official fixed peg to the US dollar (units per 1 USD). */
const USD_PEGS = { AED: 3.6725, SAR: 3.75, QAR: 3.64, OMR: 0.3845, BHD: 0.376, JOD: 0.709 };
const FX_KEY = 'ledgerline:fx:v1';

    if (planned.some(p => p && (p === nk || dice(p, nk) >= .7))) continue;      // already in the plan

    const day = per === 'month' ? Number(last[2].date.slice(8, 10)) : 1, skey = `rec:${key}:${per}:${amt}`;
    if (no[skey]) continue;

    const what = dirIn ? L2('as an income', 'als Einkommen') : L2('as a fixed cost', 'als Fixkosten');
    const extra = per === 'month' ? L2(` on the ${day}${ordSuffix(day)}`, ` am ${day}.`) : L2(` (about ${fmt(monthly, { whole: true })} a month)`, ` (etwa ${fmt(monthly, { whole: true })} im Monat)`);

(window.AFTER_RENDER ||= []).push(() => {

  }

<script>
'use strict';
/* =========================================================================
   Needs, wants, saved (50/30/20, with your own savings goal), and spending by category with fixed costs
   included. Categories are by type of spending; "fixed" is a property of an item, not a category.
   ========================================================================= */
const BUCKET_DEFAULT = { housing: 'need', insurance: 'need', phone: 'need', groceries: 'need', transport: 'need', household: 'need', health: 'need', education: 'need' };
const bucketOf = x => x.bucket || BUCKET_DEFAULT[x.id] || 'want';

/* Your usual mix of day-to-day spending (last 90 days, one-off big purchases left out), used to spread what's still
   expected this month across categories, so an annual pass bought this month isn't projected forward. */
function usualMix(beforeIso) {
  const since = isoDate(new Date(new Date(beforeIso + 'T12:00').getTime() - 90 * 864e5));
  const buys = allTx().filter(t => isOut(t) && fundOf(t) === 'budget' && t.date >= since && t.date < beforeIso), amts = buys.map(t => t.amount).sort((a, b) => a - b), med = amts[amts.length >> 1] || 0;
  const mix = {}; buys.forEach(t => { if (!(amts.length >= 5 && t.amount >= 10000 && t.amount >= 5 * med)) mix[t.category] = (mix[t.category] || 0) + t.amount; });
  const tot = Object.values(mix).reduce((a, b) => a + b, 0); return tot ? Object.fromEntries(Object.entries(mix).map(([k, v]) => [k, v / tot])) : null;
}
/* All spending of a month by category: { cat: { fixed, spend, rest } } (rest = still expected this month) */
function spendByCat(cm, withRest) {
  const out = {}, add = (c, k, v) => { if (!(v > 0)) return; (out[c] ||= { fixed: 0, spend: 0, rest: 0 })[k] += v; };
  for (const [c, v] of Object.entries(cm.flow.billsMap || {})) add(c, 'fixed', v);
  for (const [c, v] of Object.entries(cm.byCat || {})) add(c, 'spend', v);
  for (const [c, v] of Object.entries(cm.byCatPot || {})) add(c, 'spend', v);
  if (withRest && cm.key === curMonth()) { const ex = expectedRest(cm); if (ex && ex.spend > 0) { const mix = usualMix(`${cm.key}-01`) || (() => { const so = Object.values(cm.byCat || {}).reduce((a, b) => a + b, 0); return so ? Object.fromEntries(Object.entries(cm.byCat).map(([k, v]) => [k, v / so])) : { other: 1 }; })(); for (const [c, f] of Object.entries(mix)) add(c, 'rest', ex.spend * f); } }
  return out;
}
function splitOf(months, withRest) {
  const S = state.settings, totals = { need: 0, want: 0, needRest: 0, wantRest: 0 }, items = { need: {}, want: {} }; let income = 0, housing = 0;
  for (const cm of months) {
    income += cm.income || 0; housing += (cm.flow.billsMap || {}).housing || 0;
    for (const [cid, v] of Object.entries(spendByCat(cm, withRest))) { const c = S.categories.find(x => x.id === cid) || { id: cid, name: cid }, b = bucketOf(c), now = v.fixed + v.spend;
      totals[b] += now; totals[b + 'Rest'] += v.rest; const it = items[b][cid] ||= { name: c.name, amount: 0, fixed: 0, rest: 0, color: c.color }; it.amount += now; it.fixed += v.fixed; it.rest += v.rest; }
  }
  const list = b => Object.values(items[b]).map(x => ({ ...x, amount: Math.round(x.amount), rest: Math.round(x.rest) })).sort((a, b2) => (b2.amount + b2.rest) - (a.amount + a.rest));
  return { income, need: totals.need, want: totals.want, needRest: totals.needRest, wantRest: totals.wantRest, needs: list('need'), wants: list('want'), housing,
    save: income - totals.need - totals.want, saveProj: income - totals.need - totals.want - totals.needRest - totals.wantRest, hasRest: totals.needRest + totals.wantRest > 0 };
}
const splitFor = cm => splitOf([cm], true);       // kept for other parts of the app
function splitPanel(sp, title, goal, pkey) {
  if (sp.income <= 0) return '';
  const wantT = 100 - 50 - goal, pct = v => Math.round(v / sp.income * 100), col = { need: 'var(--split-need)', want: '#E0723A', save: 'var(--pine)' };
  const rows = [['need', L2('Needs', 'Bedarf'), sp.need, sp.need + sp.needRest, 50, sp.needs], ['want', L2('Wants', 'Wünsche'), sp.want, sp.want + sp.wantRest, wantT, sp.wants], ['save', L2('Saved', 'Gespart'), sp.save, sp.saveProj, goal, null]];
  const proj = sp.hasRest, show = r => proj ? r[3] : r[2];
  const bar = `<div class="split-bar">${rows.map(r => `<i style="width:${Math.max(0, pct(show(r)))}%;background:${col[r[0]]}"></i>`).join('')}<b style="left:50%"></b><b style="left:${50 + wantT}%"></b></div>`;
  const line = ([k, label, now, pr, target, items]) => { const p = pct(proj ? pr : now), d = p - target, good = k === 'save' ? d >= 0 : d <= 0;
    const nowTxt = proj ? `<span class="small muted">${L2('so far', 'bisher')} ${pct(now)}% · ${fmt(now, { whole: true })}</span>` : '';
    return `<div class="split-row"><div class="split-h"><span><i style="background:${col[k]}"></i><b>${label}</b> ${p}%${proj ? ` <span class="muted">${L2('projected', 'erwartet')}</span>` : ''} <span class="muted">· ${L2('target', 'Ziel')} ${target}%</span></span><span class="${good ? 'pos' : 'warn'}">${d === 0 ? L2('on target', 'im Ziel') : `${d > 0 ? '+' : '−'}${Math.abs(d)} ${L2('points', 'Punkte')}`} · ${fmt(proj ? pr : now, { whole: true })}</span></div>${nowTxt ? `<div>${nowTxt}</div>` : ''}
      ${items && items.length ? `<div class="split-items">${items.slice(0, 5).map(x => `<span><span>${esc(x.name)}</span> ${fmt(x.amount + (proj ? x.rest : 0), { whole: true })}</span>`).join('')}${items.length > 5 ? `<span class="muted">+${items.length - 5}</span>` : ''}</div>` : k === 'save' ? `<div class="split-items"><span class="muted">${L2('Plans, savings and repayments: income not spent.', 'Sparpläne, Ersparnisse, Tilgung: nicht ausgegebenes Einkommen.')}</span></div>` : ''}</div>`; };
  const S = state.settings, pick = S.categories.map(x => `<label class="split-pick"><span>${esc(x.name)}</span><select class="input" data-bucket="cat:${x.id}"><option value="need" ${bucketOf(x) === 'need' ? 'selected' : ''}>${L2('Need', 'Bedarf')}</option><option value="want" ${bucketOf(x) === 'want' ? 'selected' : ''}>${L2('Want', 'Wunsch')}</option></select></label>`).join('');
  return `<div class="panel split50" data-pkey-fixed="${pkey}" data-pkey="${pkey}"><div class="panel-head"><h2>50/${wantT}/${goal}</h2><p class="sub">${title}${goal !== 20 ? ' · ' + L2(`based on 50/30/20, with your ${goal}% savings goal`, `nach 50/30/20, mit deinem Sparziel von ${goal} %`) : ''}</p></div>
    ${bar}${rows.map(line).join('')}
    ${sp.housing ? `<div class="facts" style="margin-top:8px"><div class="f"><span>${L2('Housing', 'Wohnen')}</span><span>${pct(sp.housing)}% ${L2('of income', 'des Einkommens')} <span class="small muted">(${L2('rule of thumb: up to 30%', 'Faustregel: bis 30 %')})</span></span></div></div>` : ''}
    <details class="split-cfg"><summary>${L2('What counts as a need?', 'Was zählt als Bedarf?')}</summary><div class="split-cfg-grid">${pick}</div></details></div>`;
}
document.addEventListener('change', e => {
  const k = e.target.dataset?.bucket; if (!k) return; const id = k.split(':')[1], x = state.settings.categories.find(y => y.id === id); if (!x) return;
  x.bucket = e.target.value; touchSettings(); persist(); invalidate(); render();
});

/* Category list with fixed costs: one row per category, the fixed part darker */
function allSpendRows(months) {
  const S = state.settings, agg = {};
  for (const cm of months) for (const [c, v] of Object.entries(spendByCat(cm, false))) { const a = agg[c] ||= { fixed: 0, spend: 0 }; a.fixed += v.fixed; a.spend += v.spend; }
  return Object.entries(agg).map(([cid, v]) => { const c = S.categories.find(x => x.id === cid) || { name: cid, color: '#9AA3AD' }; return { id: cid, name: c.name, color: c.color, amount: v.fixed + v.spend, fixed: v.fixed }; }).filter(x => x.amount > 0).sort((a, b) => b.amount - a.amount);
}
function allSpendHtml(rows) {
  const tot = rows.reduce((t, x) => t + x.amount, 0), mx = rows[0]?.amount || 1, map = Object.fromEntries(rows.map(r => [r.id, r.amount]));
  const pie = typeof donut === 'function' ? donut(map) : '';
  return `${pie ? `<div class="chart">${pie}</div>` : ''}<div class="cat-all">${rows.map(x => `<div class="ca" data-tip="${esc(x.name)}: ${fmt(x.amount)} · ${tot ? Math.round(x.amount / tot * 100) : 0}%${x.fixed ? ` (${L2('fixed', 'fix')} ${fmt(x.fixed, { whole: true })})` : ''}"><span><span>${esc(x.name)}</span>${x.fixed ? ` <em>${x.fixed >= x.amount - 1 ? L2('fixed', 'fix') : `${L2('fixed', 'fix')} ${fmt(x.fixed, { whole: true })}`}</em>` : ''}</span><b>${fmt(x.amount, { whole: true })}</b><span class="small muted">${tot ? Math.round(x.amount / tot * 100) : 0}%</span><i style="width:${Math.round(x.amount / mx * 100)}%;background:linear-gradient(90deg, color-mix(in srgb, ${x.color} 70%, #000) 0 ${x.amount ? Math.round(x.fixed / x.amount * 100) : 0}%, ${x.color} 0)"></i></div>`).join('')}</div>
    <p class="small muted" style="margin:8px 0 0">${L2('Darker part of a bar: fixed costs.', 'Dunklerer Teil eines Balkens: Fixkosten.')}</p>`;
}
(window.AFTER_RENDER ||= []).push(() => {
  if (!['month', 'year'].includes(ui.view)) return;
  const withFixed = ui.catWithFixed !== false, isMonth = ui.view === 'month';
  const months = isMonth ? [computeMonth(ui.month || curMonth())] : usedMonthsOfYear(ui.year || Number(curMonth().slice(0, 4))).map(k => computeMonth(k));
  const panel = [...document.querySelectorAll('#main .panel')].find(p => /^(by category|nach kategorie|categories this year|kategorien dieses jahr)/i.test((p.querySelector('h2')?.textContent || '').trim()));
  if (panel && !panel.querySelector('.cat-fixed-toggle')) {
    panel.querySelector('.panel-head')?.insertAdjacentHTML('beforeend', `<label class="check small cat-fixed-toggle"><input type="checkbox" data-act="cat-with-fixed" ${withFixed ? 'checked' : ''}>${L2('With fixed costs', 'Mit Fixkosten')}</label>`);
    if (withFixed) { const rows = allSpendRows(months), body = panel.querySelector('.cat-split') || [...panel.children].find(c => !c.classList.contains('panel-head')); if (body && rows.length) body.outerHTML = `<div class="cat-split">${allSpendHtml(rows)}</div>`; }
  }
  if (!document.querySelector('#main .split50') && months.length) {
    const key = isMonth ? months[0].key : (String(ui.year) === curMonth().slice(0, 4) ? curMonth() : `${ui.year}-12`), goal = Math.max(0, Math.min(50, Math.round(typeof goalFor === 'function' ? goalFor(key) : 20)));
    const sp = splitOf(months, true), title = isMonth ? (sp.hasRest ? L2(`${monthLabel(months[0].key, 'long', false)}: so far and projected`, `${monthLabel(months[0].key, 'long', false)}: bisher und erwartet`) : monthLabel(months[0].key, 'long', false)) : (sp.hasRest ? L2(`${ui.year} so far, this month projected`, `${ui.year} bisher, dieser Monat erwartet`) : String(ui.year));
    const html = splitPanel(sp, title, goal, isMonth ? 'month:50/30/20' : 'year:50/30/20'); if (!html) return;
    const grid = panel?.closest('.grid'); (grid || panel || document.querySelector('#main .panel:last-of-type'))?.insertAdjacentHTML('afterend', html);
    if (typeof decoratePanels === 'function') decoratePanels();

ACTIONS['cat-with-fixed'] = el => { ui.catWithFixed = el.checked; render(); };

/* Tooltips that work with a mouse and with a finger: anything with data-tip (chart bars, category rows) */
(() => {
  let tip = null;
  const show = (el, x, y) => { if (!tip) { tip = document.createElement('div'); tip.id = 'llTip'; document.body.appendChild(tip); } tip.textContent = el.dataset.tip; tip.style.display = 'block'; const r = tip.getBoundingClientRect(); tip.style.left = Math.max(6, Math.min(innerWidth - r.width - 6, x - r.width / 2)) + 'px'; tip.style.top = Math.max(6, y - r.height - 12) + 'px'; };
  const hide = () => { if (tip) tip.style.display = 'none'; };
  document.addEventListener('pointermove', e => { if (e.pointerType !== 'mouse') return; const el = e.target.closest?.('[data-tip]'); if (el) show(el, e.clientX, e.clientY); else hide(); });
  document.addEventListener('pointerdown', e => { if (e.pointerType === 'mouse') return; const el = e.target.closest?.('[data-tip]'); if (el) show(el, e.clientX, e.clientY); else hide(); });
  window.addEventListener('scroll', hide, { passive: true });
})();
</script>
<script>
'use strict';
/* =========================================================================
   In-app links: wherever a text says where to go ("Settings → Recurring plan", "Einstellungen → Backup & Export",
   "Wealth → Cash savings"), it becomes a link that opens that page, scrolls to the box and highlights it.
   Paths inside the iPhone's own Settings app (Settings → Apps → Wallet …) stay plain text.
   ========================================================================= */
const NAV_PAGES = { settings: 'settings', einstellungen: 'settings', wealth: 'wealth', 'vermögen': 'wealth', month: 'month', monat: 'month', today: 'today', heute: 'today', overview: 'overview', 'übersicht': 'overview', debt: 'debt', schulden: 'debt', year: 'year', jahr: 'year', manual: 'manual', anleitung: 'manual' };
const NAV_RE = /\b(Settings|Einstellungen|Wealth|Vermögen|Month|Monat|Today|Heute|Overview|Übersicht|Debt|Schulden|Year|Jahr)\s→\s([^.,;:()“”"<>]+?)(?=\s→|[.,;:()“”"]|\s(?:then|and|or|und|oder|dann)\b|$)/g;
const NOT_APP = /^(apps|general|allgemein|wallet|datenschutz|privacy|safari|bildschirmzeit|screen time|face id|mobile|mobilfunk|bluetooth|kurzbefehle|shortcuts)\b/i;
function linkifyNav(root) {
  if (!root) return;
  const tw = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, { acceptNode: n => n.textContent.includes('→') && !n.parentElement.closest('a,button,input,select,textarea,code,option,.no-link,[data-act],.wiz') ? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_REJECT });
  const nodes = []; let n; while ((n = tw.nextNode())) nodes.push(n);
  for (const node of nodes) {
    const t = node.textContent; NAV_RE.lastIndex = 0; let m, last = 0, frag = null;
    while ((m = NAV_RE.exec(t))) {
      const view = NAV_PAGES[m[1].toLowerCase()], sec = m[2].trim(); if (!view || NOT_APP.test(sec)) continue;
      frag ||= document.createDocumentFragment(); frag.append(t.slice(last, m.index));
      const a = document.createElement('a'); a.href = '#'; a.dataset.act = 'goto-section'; a.dataset.view = view; a.dataset.sec = sec; a.textContent = m[0]; frag.append(a); last = m.index + m[0].length;
    }
    if (frag) { frag.append(t.slice(last)); node.replaceWith(frag); }
  }
}
ACTIONS['goto-section'] = (el, e) => {
  e?.preventDefault?.(); const view = el.dataset.view, sec = (el.dataset.sec || '').toLowerCase();
  closeDlg(); ui.view = view; render(); window.scrollTo(0, 0);
  setTimeout(() => {
    const words = sec.split(/[^a-zäöüß0-9]+/).filter(w => w.length > 2);
    const panels = [...document.querySelectorAll('#main .panel')], score = p => { const h = (p.querySelector('h2')?.textContent || '').toLowerCase(); return h.startsWith(sec) ? 99 : words.filter(w => h.includes(w)).length; };
    const best = panels.map(p => [p, score(p)]).filter(x => x[1] > 0).sort((a, b) => b[1] - a[1])[0];
    if (best) { const p = best[0]; p.classList.remove('collapsed'); p.scrollIntoView({ block: 'start', behavior: 'smooth' }); p.classList.add('flash'); setTimeout(() => p.classList.remove('flash'), 1600); }
  }, 120);
};
(window.AFTER_RENDER ||= []).push(() => linkifyNav(document.getElementById('main')));
new MutationObserver(ms => { for (const m of ms) for (const nd of m.addedNodes) if (nd.nodeType === 1 && nd.closest?.('dialog')) linkifyNav(nd); }).observe(document.body, { childList: true, subtree: true });
</script>
<script>
'use strict';
/* Chart details that work with a finger as well as a mouse: built-in <title> hints (which only appear on hover with a mouse)

function tipsFromTitles(root) {

}
(window.AFTER_RENDER ||= []).push(() => tipsFromTitles(document.getElementById('main')));
new MutationObserver(ms => { for (const m of ms) for (const nd of m.addedNodes) if (nd.nodeType === 1 && nd.closest?.('dialog') && nd.querySelector?.('svg title')) tipsFromTitles(nd); }).observe(document.body, { childList: true, subtree: true });
</script>
