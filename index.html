  'layout-edit': () => { Layout.editing = true; render(); toast('Drag the handles to move boxes. Tap Done when finished.'); },
  'layout-done': () => { Layout.editing = false; render(); },
  'layout-reset': () => { for (const k of Object.keys(Layout.order)) if (k.startsWith(ui.view + '::')) delete Layout.order[k]; saveLayout(); render(); },
});
</script>
<script>
'use strict';
/* =========================================================================
   Date fields always show day/month/year. A browser's built-in date box follows the
   computer's region setting (often month/day/year), so each one is shown as a text box
   in DD/MM/YYYY with a calendar button; the original box stays underneath and keeps the value.
   ========================================================================= */
const DATE_PROTO = Object.getOwnPropertyDescriptor(HTMLInputElement.prototype, 'value');
function parseDMY(t) {
  const m = /^\s*(\d{1,2})[./\-\s](\d{1,2})[./\-\s](\d{2}|\d{4})\s*$/.exec(t || ''); if (!m) return null;
  const d = +m[1], mo = +m[2], y = m[3].length === 2 ? 2000 + +m[3] : +m[3];
  const dt = new Date(y, mo - 1, d); if (dt.getMonth() !== mo - 1 || dt.getDate() !== d) return null;
  return `${y}-${pad2(mo)}-${pad2(d)}`;
}
function enhanceDate(inp) {
  if (inp.dataset.dmy) return; inp.dataset.dmy = '1';
  const wrap = document.createElement('span'); wrap.className = 'dmy';
  const txt = document.createElement('input'); txt.type = 'text'; txt.className = inp.className.replace(/\bbig\b/, ''); txt.inputMode = 'numeric'; txt.placeholder = 'DD/MM/YYYY'; txt.setAttribute('aria-label', inp.getAttribute('aria-label') || 'Date (day/month/year)'); txt.autocomplete = 'off';
  const cal = document.createElement('span'); cal.className = 'dmy-cal'; cal.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15.5" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>';
  inp.parentNode.insertBefore(wrap, inp); wrap.append(txt, cal); cal.appendChild(inp);
  inp.classList.add('dmy-native'); inp.tabIndex = -1;
  const show = () => { const v = DATE_PROTO.get.call(inp); txt.value = v ? fmtDate(v) : ''; };
  // keep the text box in step when code sets the date (e.g. "Yesterday" buttons)
  Object.defineProperty(inp, 'value', { configurable: true, get() { return DATE_PROTO.get.call(inp); }, set(v) { DATE_PROTO.set.call(inp, v); show(); } });
  show();
  inp.addEventListener('input', show); inp.addEventListener('change', show);
  txt.addEventListener('change', () => {
    const iso = parseDMY(txt.value);
    if (txt.value.trim() && !iso) { txt.classList.add('bad'); toast('Enter the date as day/month/year, e.g. 05/10/2026.'); return; }
    txt.classList.remove('bad'); DATE_PROTO.set.call(inp, iso || ''); show();
    inp.dispatchEvent(new Event('input', { bubbles: true })); inp.dispatchEvent(new Event('change', { bubbles: true }));
  });
}
const enhanceDates = root => (root.querySelectorAll ? root.querySelectorAll('input[type="date"]:not([data-dmy])') : []).forEach(enhanceDate);
new MutationObserver(ms => { for (const m of ms) for (const n of m.addedNodes) if (n.nodeType === 1) { if (n.matches?.('input[type="date"]')) enhanceDate(n); else enhanceDates(n); } }).observe(document.body, { childList: true, subtree: true });
enhanceDates(document);
</script>
<script>
'use strict';
/* =========================================================================
   Manual page. The same text is in MANUAL.md in the repository, so an AI assistant can read it too.
   ========================================================================= */
const MANUAL_MD = "# Ledgerline manual\n\n*Version 2026-10-06 · 29. This manual is updated together with every new version of the app; the version number in **Settings → Backup & export** should match.*\n\nLedgerline is your personal budget and wealth app. It is one web page (`index.html`) hosted on GitHub Pages, plus a small price updater that runs on GitHub. Your entries never leave your devices except as an encrypted sync file in your own GitHub account.\n\nThis manual has two parts. Sections 1 to 11 are step-by-step instructions for you. Section 12 is a technical description for an AI assistant or a developer who works on the app.\n\n## 1. What lives where\n\nYour GitHub repository (`aaron-sn01/ledgerline`) contains:\n\n- `index.html`: the whole app.\n- `MANUAL.md`: this manual.\n- `fetch_prices.py`: downloads ETF prices from Yahoo Finance.\n- `fetch_compositions.py`: downloads what each ETF holds (sectors and countries), once a month.\n- `tickers.json`: the list of ETFs the updater fetches.\n- `.github/workflows/update-prices.yml`: tells GitHub when to run the two scripts.\n- `prices.json` and `compositions.json`: written by the updater. Never edit these by hand.\n\nYour data (entries, plan, holdings, debts, settings) is stored inside the app on each device. If sync is on, an encrypted copy is kept in a private GitHub Gist. The app's code contains **no personal data**: a new device starts empty (with a welcome note) and gets your data when you connect sync or restore a backup. Because the repository is public, nothing personal should ever be written into `index.html` or the other files.\n\n## 2. Everyday use\n\n1. **Add spending** on the Today page: type a name and amount. Ledgerline suggests a category; tap another one if it's wrong. It learns from every correction.\n2. **Import instead of typing**: tap **Import** and choose screenshots or PDF statements (Trade Republic, Sparkasse, flatex, Coinbase). Check the review list, untick what you don't want, then tap **Add selected**.\n   - **Duplicates**: an entry that's already in Ledgerline, or that appears in two of the files you import, is unticked with a note saying which entry it matches. Repeated purchases (several €3.00 tickets) are counted separately: each entry can only match one other, payments in the same file never count as duplicates, and different times of day (Apple Pay) mean different payments. If something is unticked wrongly, tick it.\n   - **Paste instead of saving**: take a screenshot, tap its thumbnail, then **Done → Copy and Delete**. In Ledgerline tap **Import → Paste screenshot** (if the iPhone asks, tap **Allow Paste**). If the button doesn't work, tap the dashed box next to it and choose **Paste**. On a Mac, ⌘V works while the Import window is open.\n3. **Browse days**: the app always opens on the Overview. On Today, use the arrows next to the date to see earlier or later days. New entries go on the day you're looking at.\n4. **Monthly review**: opens by itself after a month ends. Correct share counts and your cash total there.\n5. **Apple Pay, automatically**: set up the Shortcuts automation once (**Settings → Apple Pay automation**, steps below) and every Apple Pay payment arrives in Ledgerline by itself, either for you to confirm or added straight away.\n6. **Undo**: after deleting something or importing, an **Undo** button appears for a few seconds.\n7. **Help**: every box has a **?** next to its title that explains what it shows.\n8. **Tour**: **Settings → Backup & export → Take the tour** (or **More → Take the tour** on iPhone) walks through the app in 11 stops, including where to enter your fixed costs and the Apple Pay automation. \"Look around first\" in the setup wizard runs it on sample data; **Set up my own** clears the sample data and starts the setup.\n9. **Setup help for your AI**: on the Manual page and in **Settings → Backup & export**. A text to give ChatGPT, Claude or similar; it guides you through installing, sync and the Apple Pay automation one step at a time, and never asks for your token, passphrase or bank data.\n10. **What's new**: after each update, a short note lists the changes once.\n11. **Back up**: after each monthly review, go to **Settings → Backup & export → Download backup** and keep the file in iCloud Drive or similar.\n\n### Setting up the Apple Pay automation (iPhone, once)\n\n**You need:** iOS 17 or later, your card in Apple Wallet, and sync working on the iPhone (section 9). The same steps are in the app under **Settings → Apple Pay automation** (type \"Apple Pay\" in the Settings search box), with buttons to copy the two values you need. Keep that page open while you work in Shortcuts.\n\n**In Ledgerline**\n\n1. Go to **Settings → Apple Pay automation**. Choose **Ask me to confirm** or **Add straight away**.\n2. Note the two values there: the **web address** (ending in `/comments`) and the **Authorization** value (starting with `Bearer`). You'll copy each one when needed.\n\n**In the Shortcuts app**\n\n1. Open **Shortcuts** and tap **Automation** in the bar at the bottom (not \"Shortcuts\"). Tap **+** at the top right (or **New Automation**).\n2. A list of triggers appears (Time of Day, Alarm, Email, …). Scroll down and tap **Transaction**, the one with the Wallet icon (\"When I tap my card\"). If you see actions such as *Open Card*, *Request Payment* or *Send Payment* instead, you're adding an action to a shortcut, not creating an automation: close it and start again from the Automation tab.\n3. Under **Card**, select the card(s) you pay with. Leave Merchant and Category as they are. Choose **Run Immediately**; switch off **Notify When Run** if you prefer. Tap **Next**.\n4. Tap **New Blank Automation**, then **Add Action**. Search for **Get Contents of URL** and tap it.\n\n   *On newer iOS versions* the automation opens as a shortcut beginning with **\"When Any Card is tapped\"**, followed by Categories, Merchants and switches for **Automation** (leave on) and **Notify**. That is the right screen. Tap **Any Card** to pick your card if you like, then add the action with the **Search** box at the bottom. There, the payment details are called **Transaction** or **Shortcut Input**; use whichever appears in steps 10 and 11. When finished, tap the back arrow at the top left to save.\n5. Tap the blue word **URL** and paste the web address from Ledgerline.\n6. Tap the small arrow **›** next to it. Set **Method** to **POST**.\n7. Under **Headers**, tap **Add new header**. Key: `Authorization`. Text: paste the Authorization value from Ledgerline.\n8. Under **Request Body**, choose **JSON**, tap **Add new field → Text**, and type `body` as the key.\n9. In the value box type `ledgerline|` (on the iPhone keyboard the `|` is under **123 → #+=**).\n10. In the bar above the keyboard tap **Shortcut Input**. Tap the inserted bubble and choose **Amount**.\n11. Type `|`, insert **Shortcut Input** again, tap it and choose **Merchant**. The value now reads `ledgerline|Amount|Merchant`.\n12. Tap **Done**.\n\n**Test it**: pay for something small with Apple Pay, then open Ledgerline. A banner shows the payment, or it's already added. Running the automation by hand doesn't work, because without a real payment there's no amount or shop.\n\n**If nothing arrives**: on the iPhone open **Settings → Apps → Wallet** and turn on **Mobile Data**; check the automation still says **Run Immediately**; use **Check for payments now** in Ledgerline; and if you ever replace your GitHub token, paste the new one into the automation as well. While a payment waits for Ledgerline it sits unencrypted on your sync file (amount and shop only), and it's deleted as soon as it's picked up.\n\n## Sharing Ledgerline with friends and family\n\nAnyone can use Ledgerline through your link (https://aaron-sn01.github.io/ledgerline/). Their data stays on their own devices; nobody sees anyone else's, including you.\n\n1. Send them the link. On iPhone they open it in Safari, tap **Share → Add to Home Screen**. On a Mac in Safari: **File → Add to Dock**.\n2. The **setup wizard** opens the first time: name, currency, monthly income, fixed costs, investment plans, cash and savings goal. Every step can be skipped; everything can be changed later in Settings (**Settings → Backup & export → Run the setup again** reopens it).\n3. For sync between their own devices and the Apple Pay automation, they use **their own** GitHub account and token (sections 9 and 2).\n4. When you upload a new version, they get it automatically the next time they open the app. Their data is upgraded on first launch, like yours.\n5. ETF prices come from your `tickers.json`. If someone holds a fund that isn't listed, add it (section 5) or they enter its price by hand.\n\n### Banks Ledgerline doesn't know yet\n\nThe importer has dedicated readers for Trade Republic, Sparkasse, flatex and Coinbase. For any other bank it makes a best effort: every line with a date and an amount is offered in the review, marked \"layout not known yet: please check each line\". Check direction (spent or received), amount and name before adding. To get a proper reader for a bank, send a sample screenshot or PDF with personal details blacked out to whoever maintains the app; it's added in the next update, for everyone with that bank.\n\n### Privacy and security\n\n- **Stored on the device only**, in the browser's storage. There is no Ledgerline server or account; whoever shared the app can't see anyone's data.\n- **Not encrypted on the device itself**; it's protected by the device lock. Add Face ID, Touch ID or a PIN under **Settings → App lock** for extra protection.\n- **Sync is optional and end-to-end encrypted** with your passphrase before it reaches your own GitHub account. Lose the passphrase and the sync copy can't be recovered.\n- **Imports are read on the device**; files are never uploaded. The reading tools are downloaded once from public code servers (cdnjs, jsDelivr).\n- **Prices** come from a public GitHub file and CoinGecko. These requests contain no personal data, but like any web request they reveal your internet address.\n- **Apple Pay automation** (optional): amount and shop name wait unencrypted in your own GitHub sync file briefly, then are deleted.\n- **Backups are your job**: clearing browser data or removing the home-screen app deletes the data on that device.\n- **Trust**: the code is public. Updates come from whoever maintains the app.\n\nThe same text is shown in the setup wizard and under **Settings → Backup & export**.\n\n## 3. Updating the app to a new version\n\n1. Download the new `index.html`.\n2. In your repository, click **Add file → Upload files**, drop the file in (the name must be exactly `index.html`) and click **Commit changes**.\n3. Open the **Actions** tab and wait for **pages build and deployment** to show a green tick (1 to 2 minutes, longer if GitHub is busy).\n4. Close the app fully and open it again. On a Mac, ⌘R reloads.\n\nYour data carries over automatically. New versions upgrade old data on first launch.\n\nTo change any other file (for example `tickers.json`): open the file on GitHub, click the **pencil** icon, edit, then **Commit changes**.\n\n## 4. Prices\n\n- ETF prices update every 2 hours on weekdays between 09:23 and 23:23 German time. Nothing updates at night or on weekends because exchanges are closed.\n- **Refresh prices** on the Wealth page checks for a newer price file; it can't make GitHub fetch new prices sooner.\n- To fetch now: **Actions → Update prices → Run workflow**. A run by hand also refreshes the ETF compositions.\n- Ethereum and other crypto prices come live from CoinGecko.\n- If a price shows \"—\": open **Settings → Price updater**, which lists any fund the last run failed for. Check that fund's Yahoo symbol in `tickers.json`.\n\n## 5. Adding a new investment\n\n### An ETF, stock or bond ETF with automatic prices\n\n1. Find its **Yahoo Finance symbol**. For Xetra listings it usually ends in `.DE` (for example `EUNL.DE`). Search the ISIN on finance.yahoo.com to find it.\n2. In Ledgerline: **Wealth → Add holding**. Choose **ETF or stock**, then enter the name, ISIN, Yahoo symbol, broker and number of shares. Pick the **asset class** (Stocks, Bonds, Real estate, and so on).\n3. On GitHub, edit `tickers.json` and add a line inside the list, separated from the others by a comma:\n\n   ```\n   { \"symbol\": \"VAGF.DE\", \"isin\": \"IE00BG47KH54\", \"name\": \"Vanguard Global Aggregate Bond\" }\n   ```\n\n4. Run the workflow by hand (section 4) so the price appears straight away.\n5. Optional, for the sector and country charts (stocks only): iShares and Xtrackers funds can get automatic compositions. Copy an existing iShares or Xtrackers entry in `tickers.json` and adjust it. Without this, the fund still counts in Asset types but shows as \"Not known\" in sectors and countries.\n\n### Crypto\n\n**Add holding → Crypto**, then enter the CoinGecko id (the word in the CoinGecko web address, for example `bitcoin`). Prices come automatically.\n\n### Anything without an automatic price (private equity, a pension, a property share)\n\n**Add holding → Other investment** or **Private equity**, and enter the price yourself. Update the price when you get a new statement, or import the statement.\n\n### A new asset class\n\nIn the holding dialog, choose **Asset class → + New asset class…** and type a name. It appears as its own slice in Asset types and gets a cautious default return assumption in the projection.\n\n### Savings plans\n\n**Settings → Recurring plan → Investment plans**: add the plan, link it to the holding and set the day of the month. Ledgerline then adds the shares automatically each month.\n\n## 6. Changing your plan and settings\n\n- **Income, fixed costs, annual costs, investment plans**: **Settings → Recurring plan**. Set the real deduction day of each item; the cash outlook and the budget use it. To change one month only, use **Month → Edit this month's plan**.\n- **Savings-rate goal**: **Settings → Savings-rate goal**. Add a goal change from a given month (for example 20% from 03/2027). The switch below it decides whether the cash part of the goal is set aside before your spending budget.\n- **Spending categories**: **Settings → Categories**. Add, rename, recolor or delete them. The amount box next to each is an optional monthly limit; leave it empty for none.\n- **Fixed-cost groups** (Housing, Insurance and so on): **Settings → Fixed-cost groups**.\n- **Wealth over time**: choose 1M, 3M, 6M, 1Y or All. The summary above the chart counts only from the day you started tracking. Anything earlier (the dashed line) is an estimate made from your current holdings at past prices, so it shows how the market moved, not how much you actually had.\n- **Language**: English or German, under **Settings → Budget → Language** (also offered on the wizard's first screen). German shows dates as 06.10.2026 and can switch numbers to 1.234,56 €. The Manual page shows the German version.\n- **Finding a setting**: use the search box or the group buttons (Plan, Money, Investments, Devices, Advanced) at the top of Settings.\n- **Settings layout**: Recurring plan spans the full width; the other boxes flow in two columns (one on a phone).\n- **Box layout**: tap a box's title to collapse it. **Rearrange boxes** at the bottom of each page lets you drag boxes around. Both are remembered per device.\n\n## 7. Cash and accounts\n\nLedgerline treats all your accounts as one cash total. A month's budget is kept aside from that total until the month ends; the rest counts as cash savings.\n\n- To correct the total: **Wealth → Cash savings → Update balance**. You can list each account separately and the total adds up by itself.\n- **Opening a savings account** changes nothing in how Ledgerline works: add it as another account row in **Update balance**. Moving money between your own accounts is never spending; the importer skips such transfers.\n- Interest goes in as **Money in → Cash savings**. The importer does this automatically for interest lines.\n\n## Currencies\n\nEverything is shown in your **home currency** (the setup wizard asks for it; change it under **Settings → Budget → Currency**). If you live, earn or invest in more than one currency, tick **I use more than one currency** under it. Then:\n\n- **Entries**: a currency picker sits next to the amount on Today and in the entry editor. A £12.00 purchase is saved as £12.00 and converted at that day's rate; the original amount stays visible in the entry list.\n- **Plan**: each income, fixed cost and investment plan can have its own currency (a CHF salary, rent in GBP). The month's budget uses the rate on the payment day; until then today's rate.\n- **Accounts**: in **Update balance**, each account gets a currency; the total is converted.\n- **Holdings**: each holding has a price currency, taken from the price file (a US-listed fund in USD) or chosen in its dialog. Its value is converted at today's rate, its history at each day's rate.\n- **Debts**: choose the debt's currency when adding it. Its card shows amounts in that currency, plus the converted total; repayments are converted at the day's rate.\n- **Wealth**: switch between **All in [home currency]** and **Each currency** (side by side, not converted), plus a **Currencies** chart under Asset types.\n- **Changing the home currency** converts entries at the rate of their own day; plan items, holdings, accounts and debts keep their currency and are converted automatically.\n- **Exchange rates** are the ECB's official daily reference rates (about 30 currencies, including USD, GBP, CHF, CAD and SGD), plus the UAE dirham, Saudi and Qatari riyal, Omani rial and Bahraini and Jordanian dinar through their official fixed peg to the US dollar, loaded from frankfurter.app and kept on the device, so the app works offline with the last known rates. **Refresh** under the currency setting loads them again.\n\nWith only one currency in use, nothing changes: every number is exactly as before.\n\n## 8. Debt\n\n- **Debt → Add a debt**: enter the amount left, the interest rate (0 for interest-free) and optionally a target date.\n- **Repayment plan**: tick \"Repay with a fixed monthly instalment\" and set the amount and day. It becomes a fixed cost in each month's budget and comes off the balance automatically, after interest.\n- One-off repayments: **Record repayment** on the Debt page, from cash savings or from that month's budget.\n\n## 9. Sync between devices\n\n- **Only the first device** creates the sync file: leave Sync ID empty, enter your GitHub token and a passphrase, and click **Create sync file**. The **Sync ID** then appears in that same box with a **Copy** button, and stays visible there; it's also the code at the end of the sync file's address on gist.github.com.\n- **Every other device**: enter the same token, **that** Sync ID and the same passphrase, then click **Connect**.\n- All devices must show the **same Sync ID**. If one differs, click **Disconnect this device** there and connect with the right ID; its data is merged in.\n- Keep the token, Sync ID and passphrase in your password manager. The passphrase cannot be recovered.\n- The token is a classic GitHub token with only the **gist** permission.\n\n## 10. App lock\n\n**Settings → App lock**: Face ID / Touch ID with a PIN as fallback, set separately on each device. The app locks after 2 minutes in the background.\n\n## 11. Troubleshooting\n\n- **Prices look old**: see section 4. A red **Update prices** run in Actions shows the reason when you open it; the next run usually fixes itself.\n- **App didn't update after uploading**: check the file is named exactly `index.html`, wait for the green tick on **pages build and deployment**, then reload. If deployments stay \"Queued\", check githubstatus.com; GitHub may be having problems.\n- **\"Sync problem, see Settings\"**: open **Settings → Sync between devices** for the exact reason. \"Slow down\" means GitHub's rate limit, which clears on its own. \"Refused access\" means the token is missing the gist permission.\n- **Something looks wrong after an import**: open the entry from the Month page and edit or delete it.\n- **Apple Pay payments don't arrive**: see the end of section 2.\n- **Demo data** (**Settings → Backup & export → Preview with demo data**): never overwrites your data. It adds sample entries from January to today, marked as demo, and syncs to your other devices like any entry. While it's there, your budget, savings rate and charts include it. **Remove demo data** in the same place deletes exactly those entries and puts your start month, cash total and milestones back (an **Undo** appears for a few seconds). To try it without touching your data at all, use it in a separate browser (for example a Safari tab instead of your home-screen app) with sync not connected.\n- **Start over on a device**: **Settings → Backup & export** to save a backup first, then restore it later with **Restore from backup**.\n\n## 12. For an AI assistant or developer\n\nRead this section before changing anything. The owner is not a programmer: give back complete files that can be uploaded as they are, and explain any GitHub steps one click at a time.\n\n### Constraints\n\n- The app is a single self-contained `index.html`: vanilla JavaScript, no framework, no build step, no package manager. Keep it that way.\n- External code is only loaded lazily, when needed, from cdnjs.cloudflare.com or cdn.jsdelivr.net: PDF.js for PDF text and Tesseract.js for screenshot OCR. Everything else is inline.\n- Network access is limited to: the GitHub API (encrypted Gist sync), ECB exchange rates from frankfurter.app, `prices.json` and `compositions.json` from the same repository (raw.githubusercontent.com first, then the same origin), CoinGecko for crypto, and the two CDNs. No analytics and no other servers.\n- Personal data stays on the device. Imports are parsed locally.\n- **The repository is public. Never write personal data into the code** (no names, amounts, holdings or share counts in seed data, defaults or examples). `seedPlan`, `seedHoldings` and `seedDebts` are deliberately empty; a new device is filled by sync or a backup.\n- UI text is American English. **Dates are always displayed day/month/year** (05/10/2026), via `fmtDate`, `fmtDateTime` and the date-box enhancer. Never show month/day.\n\n### Code layout of index.html\n\nThe file is a sequence of blocks, in this order. Later blocks may use earlier ones; the boot block must stay last.\n\n1. `<head>` and `<style>`: design tokens as CSS variables (light and dark), layout, components, print styles for the PDF summary.\n2. Core script: constants and storage keys, formatting helpers (money in integer cents, `fmt`, `fmtDate`), icons, categories and seed data, `defaultState` and `migrate`, the budget engine (`computeMonth`, `aggregate`, weekday model, odds simulation), cash (`cashSavings`, cash outlook), wealth (`wealth`, `wealthSeries`, prices via `Prices`), debt (`debtLedger`, `debtStatus`, `debtPlansFor`), projection (Monte Carlo), diversification, charts (`sankeySVG`, `flowNodes`, and others), sync (`Sync`, AES-GCM with a PBKDF2 key) and app lock (`Lock`, WebAuthn and PIN).\n3. UI script: `render()`, one `view…()` function per page, dialogs, the `ACTIONS` map (every button has `data-act=\"name\"`), input binding, collapsible boxes (`decoratePanels`).\n4. Importer: `IMP` (pure parsers per document type, plus `IMP.genericPdf` as a best-effort fallback for unknown banks: Trade Republic, Sparkasse, flatex, Coinbase), classification in `buildProposals` (transfers, fixed-cost and plan matching, refunds, duplicates, categories), and the review dialog. Duplicates are found with `align()`, an order-preserving one-to-one pairing of same-amount, similar-name entries within 2 days (and 15 minutes when both have a time); entries from the same file are never paired. Don't replace this with a simple \"same amount within a few days\" check: it merges repeated purchases.\n5. PDF summary: section builders and fit-to-one-page printing.\n6. Overview: savings rate and goal, typical month, category trends and limits, Ways to save, net-worth change, the More sheet.\n   Extras (after the date boxes and the manual): the Apple Pay inbox (`Inbox`: reads and deletes comments of the form `ledgerline|amount|merchant` on the sync Gist and feeds them through the normal import review), \"?\" help (`HELP`, one text per box title, plus `HELP_BY_VIEW` for boxes titled with the user's own text; every new box needs an entry), Settings search and groups, `Undo`, nudges, and milestone celebrations. They hook in through `window.AFTER_RENDER`, a list of functions that runs after every render.\n7. Arrange mode: drag-and-drop box order (`applyLayout`).\n8. Date boxes: replaces native date inputs with day/month/year text boxes.\n9. Manual (this text, plus `MANUAL_DE`, the German user manual), extras (see above), the setup wizard (`openWizard`), which opens once on a device without data or sync, and German (`DE`, `DE_BLOCK`, `DE_PAT`, `HELP_DE`). The interface is written in English; with German selected, a translation pass swaps every rendered text: whole formatted paragraphs (`DE_BLOCK`), single texts (`DE`), then sentences with numbers (`DE_PAT`, regular expressions). Untranslated text stays English. **New or changed English text needs a matching German entry**; the source dictionaries are in `i18n/` in the working files (generated into the `DE…` constants).\n10. Boot: starts sync, the lock and the first render. It must stay the final script.\n\n### Data model\n\nStored in localStorage under `ledgerline:data:v2` (UI state under `ledgerline:ui:v2`, collapsed boxes and layout under their own keys). Shape:\n\n- `schema`: version number. Bump it in `defaultState` and add a step in `migrate()` whenever the stored shape changes; old data must keep working.\n- `settings`: the recurring plan (`recurring.income`, `bills`, `annual`, `savings`), `categories` (with optional `limit`), `fixedGroups`, `cash` (`amount`, `date`, `mode: 'accounts'`), `cashAccounts`, `savingsGoals`, `goalInBudget`, `assetClasses`, `projection`, sync and price settings.\n- `months`: `{ \"YYYY-MM\": plan }`, a copy of the plan per month so changes to one month don't affect others.\n- `transactions`: `{ id: { name, amount, date, type, category, … } }`. `type` is `out` (spending), `in` (money in), `invest` (with `accountId` and `source` budget, bonus or savings), `debt` (with `debtId`), or `sell` (with shares, gross, tax and fees).\n- `holdings`: `{ id: { name, isin, symbol, kind, assetClass, broker, base: { shares, date, at }, manualPrice, coingeckoId } }`. Share counts are `base` plus plan executions and transactions after `base.date`.\n- `debts`: `{ id: { name, original, rate, plan: { on, amount, day, start }, base: { balance, date }, target } }`.\n\nCurrencies (`4m_fx` block): every amount is stored in the home currency (`settings.currency`); an entry in another currency also keeps `cur` and `orig` (original cents). Plan items, holdings (`cur`, else the price file's `currency`, else a guess from the symbol), cash accounts and debts can carry `cur` and are converted when read (`fxPlan`, `quoteOf`/`priceOn` wrappers, `debtTxAmount`, `totalDebt`). Rates: `FX.rate(cur, iso)` (EUR-based, latest published day on or before the date), `fxConv(cents, from, to, iso)`. With no foreign `cur` anywhere, conversion returns its input unchanged; keep it that way. `fetch_prices.py` stores each quote's `currency` (London pence converted to pounds).\n\nRules: amounts are integers in cents; dates are stored as ISO `YYYY-MM-DD`; every object carries `updatedAt`; deleting sets `deleted: true` (needed for sync, which merges per object, last write wins). Never rename storage keys.\n\n### Price pipeline\n\nGitHub Actions runs `fetch_prices.py` every 2 hours on weekdays, and `fetch_compositions.py` monthly and on manual runs, then commits `prices.json` (quotes plus about 400 days of daily closes) and `compositions.json`. The app shows each file's timestamp. To support a new fund, add it to `tickers.json`.\n\n### Testing a change\n\n1. In the repository folder, run `python3 -m http.server 8765` and open http://localhost:8765/.\n2. **Settings → Backup & export → Preview with demo data** fills ten months of entries so every chart has content.\n3. Check every page at desktop width and at phone width (390 px), in light and dark mode. Check that no page scrolls sideways and that no date shows month/day.\n4. Check that the money-flow diagram balances: everything into \"Money in\" equals everything out of it.\n5. Check that an existing backup still loads (migration).\n\n### Handing back a change\n\nReturn the complete updated `index.html`, plus any other changed files, with upload steps. **Every new version adds an entry at the top of `CHANGELOG`** (shown once as \"What's new\"). **Significant new features also update the tour** (`TOUR_STEPS`, English and German) and, where relevant, the setup help (`SETUP_HELP_EN`, `SETUP_HELP_DE`); small fixes don't. **Every change to the app must come with an updated manual**: edit `MANUAL.md` and the copy embedded in `index.html` (the `MANUAL_MD` constant) together, raise `APP_VERSION` (shown in Settings) and the version line at the top of this manual to the same value. Keep features working that the owner relies on: the importer, the Apple Pay inbox, sync, app lock, the savings-rate goal in the budget, day/month/year dates, and collapsed and arranged boxes.\n";
const MANUAL_DE = "# Ledgerline-Anleitung\n\n*Version VERSION. Diese Anleitung wird mit jeder neuen Version der App aktualisiert; die Versionsnummer unter **Einstellungen → Backup & Export** sollte übereinstimmen.*\n\nLedgerline ist eine persönliche Budget- und Vermögens-App. Sie besteht aus einer einzigen Webseite (`index.html`) auf GitHub Pages und einem kleinen Kurs-Updater, der auf GitHub läuft. Deine Einträge verlassen deine Geräte nie, außer als verschlüsselte Sync-Datei in deinem eigenen GitHub-Konto.\n\nDie Abschnitte 1 bis 11 sind Schritt-für-Schritt-Anleitungen. Abschnitt 12 ist eine technische Beschreibung für KI-Assistenten und Entwickler und bleibt auf Englisch.\n\n## 1. Was wo liegt\n\nDas GitHub-Repository der App enthält:\n\n- `index.html`: die ganze App.\n- `MANUAL.md`: diese Anleitung (auf Englisch; die deutsche Fassung ist in die App eingebaut).\n- `fetch_prices.py`: lädt ETF-Kurse von Yahoo Finance.\n- `fetch_compositions.py`: lädt einmal im Monat, was jeder ETF enthält (Sektoren und Länder).\n- `tickers.json`: die Liste der ETFs, deren Kurse geladen werden.\n- `.github/workflows/update-prices.yml`: legt fest, wann GitHub die beiden Skripte ausführt.\n- `prices.json` und `compositions.json`: schreibt der Updater. Nie von Hand bearbeiten.\n\nDeine Daten (Einträge, Plan, Positionen, Schulden, Einstellungen) liegen in der App auf jedem Gerät. Mit Sync liegt eine verschlüsselte Kopie in einem privaten GitHub-Gist. Der Code der App enthält **keine persönlichen Daten**: Ein neues Gerät startet leer und bekommt deine Daten, sobald du Sync verbindest oder ein Backup wiederherstellst.\n\n## 2. Alltag\n\n1. **Ausgaben erfassen** auf der Seite Heute: Name und Betrag eingeben. Ledgerline schlägt eine Kategorie vor; tippe auf eine andere, wenn sie nicht passt. Es lernt aus jeder Korrektur.\n2. **Importieren statt tippen**: Tippe auf **Importieren** und wähle Screenshots oder PDF-Auszüge (Trade Republic, Sparkasse, flatex, Coinbase). Prüfe die Liste, entferne Häkchen bei allem, was du nicht willst, und tippe auf **Ausgewählte hinzufügen**.\n   - **Doppelte Einträge**: Was schon in Ledgerline ist oder in zwei importierten Dateien vorkommt, wird mit einem Hinweis abgewählt. Wiederholte Käufe (mehrere Fahrscheine zu 3,00 €) zählen einzeln: Jeder Eintrag kann nur zu einem anderen passen, Zahlungen aus derselben Datei gelten nie als doppelt, und unterschiedliche Uhrzeiten (Apple Pay) bedeuten unterschiedliche Zahlungen. Ist etwas zu Unrecht abgewählt, setz das Häkchen.\n   - **Einfügen statt speichern**: Screenshot machen, auf die Vorschau tippen, dann **Fertig → Kopieren und löschen**. In Ledgerline auf **Importieren → Screenshot einfügen** tippen (falls das iPhone fragt: **Einfügen erlauben**). Klappt die Taste nicht, tippe in das gestrichelte Feld daneben und wähle **Einfügen**. Auf dem Mac funktioniert ⌘V, solange das Importfenster offen ist.\n3. **Tage durchblättern**: Die App öffnet immer mit der Übersicht. Auf der Seite Heute blätterst du mit den Pfeilen neben dem Datum zu früheren oder späteren Tagen. Neue Einträge landen an dem Tag, den du gerade ansiehst.\n4. **Monatsrückblick**: öffnet sich nach Monatsende von selbst. Korrigiere dort Anteile und deine Kontosumme.\n5. **Apple Pay automatisch**: Richte einmal die Kurzbefehle-Automation ein (**Einstellungen → Apple-Pay-Automation**, Schritte unten). Dann kommt jede Apple-Pay-Zahlung von selbst in Ledgerline an, zum Bestätigen oder direkt eingetragen.\n6. **Rückgängig**: Nach dem Löschen oder Importieren erscheint für ein paar Sekunden **Rückgängig**.\n7. **Hilfe**: Jede Box hat neben ihrem Titel ein **?**, das erklärt, was sie zeigt.\n8. **Tour**: **Einstellungen → Backup & Export → Tour starten** (auf dem iPhone **Mehr → Tour starten**) führt in 11 Stationen durch die App, auch dazu, wo du deine Fixkosten einträgst, und zur Apple-Pay-Automation. „Erst mal umsehen“ in der Einrichtung zeigt sie mit Beispieldaten; **Eigenes einrichten** entfernt die Beispieldaten und startet die Einrichtung.\n9. **Einrichtungshilfe für deine KI**: auf der Seite Anleitung und unter **Einstellungen → Backup & Export**. Ein Text für ChatGPT, Claude o. Ä.; er führt dich Schritt für Schritt durch Installation, Sync und Apple-Pay-Automation und fragt nie nach Token, Passphrase oder Bankdaten.\n10. **Neu**: Nach jedem Update zeigt ein kurzer Hinweis einmal die Änderungen.\n11. **Backup**: Nach jedem Monatsrückblick unter **Einstellungen → Backup & Export → Backup herunterladen** sichern und die Datei in iCloud Drive o. Ä. ablegen.\n\n### Apple-Pay-Automation einrichten (iPhone, einmalig)\n\n**Voraussetzungen:** iOS 17 oder neuer, deine Karte in Apple Wallet und Sync auf dem iPhone (Abschnitt 9). Dieselben Schritte stehen in der App unter **Einstellungen → Apple-Pay-Automation** (tippe „Apple Pay“ in die Einstellungssuche), mit Tasten zum Kopieren der beiden Werte. Lass diese Seite offen, während du in Kurzbefehle arbeitest.\n\n**In Ledgerline**\n\n1. Öffne **Einstellungen → Apple-Pay-Automation** und wähle **Vorher fragen** oder **Direkt hinzufügen**.\n2. Dort stehen die beiden Werte: die **Webadresse** (endet auf `/comments`) und der **Authorization**-Wert (beginnt mit `Bearer`).\n\n**In der App Kurzbefehle**\n\n1. Öffne **Kurzbefehle** und tippe unten in der Leiste auf **Automation** (nicht „Kurzbefehle“). Tippe oben rechts auf **+** (oder **Neue Automation**).\n2. Eine Liste von Auslösern erscheint (Tageszeit, Wecker, E-Mail, …). Scrolle nach unten und tippe auf **Transaktion** (Wallet-Symbol). Siehst du stattdessen Aktionen wie *Karte öffnen* oder *Zahlung senden*, fügst du gerade einem Kurzbefehl eine Aktion hinzu: schließen und im Tab Automation neu beginnen.\n3. Wähle unter **Karte** deine Karte(n), lass Händler und Kategorie, wie sie sind, wähle **Sofort ausführen** und tippe auf **Weiter**.\n4. Tippe auf **Neue leere Automation**, dann **Aktion hinzufügen**. Suche **Inhalte von URL abrufen** und tippe darauf.\n\n   *Auf neueren iPhones* öffnet sich die Automation als Kurzbefehl, der mit **„Wenn eine beliebige Karte verwendet wird“** beginnt, mit Schaltern für **Automation** (eingeschaltet lassen) und **Mitteilen**. Das ist richtig. Füge die Aktion über das **Suchfeld** unten hinzu. Die Zahlungsdaten heißen dort **Transaktion** oder **Kurzbefehleingabe**.\n5. Tippe auf das blaue Wort **URL** und füge die Webadresse aus Ledgerline ein.\n6. Tippe auf den Pfeil **›** daneben und stelle **Methode** auf **POST**.\n7. Tippe unter **Header** auf **Neuen Header hinzufügen**. Schlüssel: `Authorization`. Text: den Authorization-Wert aus Ledgerline einfügen.\n8. Wähle unter **Anfragetext** die Option **JSON**, tippe auf **Neues Feld hinzufügen → Text** und gib `body` als Schlüssel ein.\n9. Gib im Feld daneben (beschriftet mit „Text“) `ledgerline|` ein (auf der iPhone-Tastatur liegt `|` unter **123 → #+=**).\n10. Tippe in der Leiste über der Tastatur auf die Zahlungsvariable (**Transaktion** oder **Kurzbefehleingabe**), dann auf die eingefügte Blase, und wähle **Betrag**.\n11. Tippe `|`, füge dieselbe Variable erneut ein, tippe darauf und wähle **Händler**. Das Feld lautet jetzt `ledgerline|Betrag|Händler`, mit Betrag und Händler als farbige Blasen.\n12. Tippe auf **Fertig** bzw. den Zurück-Pfeil, um zu speichern.\n\n**Testen**: Bezahle etwas Kleines mit Apple Pay und öffne Ledgerline. Ein Hinweis zeigt die Zahlung, oder sie ist schon eingetragen. Die Automation von Hand auszuführen funktioniert nicht, weil es ohne echte Zahlung keinen Betrag und keinen Händler gibt.\n\n**Wenn nichts ankommt**: Öffne auf dem iPhone **Einstellungen → Apps → Wallet** und schalte **Mobile Daten** ein; prüfe, ob die Automation noch auf **Sofort ausführen** steht; tippe in Ledgerline auf **Jetzt nach Zahlungen suchen**; und wenn du dein GitHub-Token ersetzt, trag das neue auch in der Automation ein. Solange eine Zahlung auf Ledgerline wartet, liegt sie unverschlüsselt (nur Betrag und Händler) in deiner Sync-Datei und wird gelöscht, sobald sie abgeholt ist.\n\n### Banken, die Ledgerline noch nicht kennt\n\nFür Trade Republic, Sparkasse, flatex und Coinbase gibt es eigene Leser. Bei allen anderen Banken versucht Ledgerline sein Bestes: Jede Zeile mit Datum und Betrag wird in der Prüfung vorgeschlagen, markiert mit „Layout noch unbekannt: bitte jede Zeile prüfen“. Prüfe Richtung (ausgegeben oder erhalten), Betrag und Name. Für einen richtigen Leser schickst du einen Beispiel-Screenshot oder ein PDF mit geschwärzten persönlichen Daten an die Person, die die App pflegt; er kommt mit dem nächsten Update, für alle mit dieser Bank.\n\n### Datenschutz und Sicherheit\n\n- **Nur auf dem Gerät gespeichert**, im Speicher des Browsers. Es gibt keinen Ledgerline-Server und kein Konto; wer dir die App geschickt hat, sieht deine Daten nicht.\n- **Auf dem Gerät selbst nicht verschlüsselt**; geschützt durch die Gerätesperre. Unter **Einstellungen → App-Sperre** kannst du Face ID, Touch ID oder eine PIN hinzufügen.\n- **Sync ist optional und Ende-zu-Ende-verschlüsselt** mit deiner Passphrase, bevor er dein eigenes GitHub-Konto erreicht. Ohne Passphrase lässt sich die Sync-Kopie nicht wiederherstellen.\n- **Importe werden auf dem Gerät gelesen**; Dateien werden nie hochgeladen. Die Lesewerkzeuge werden einmalig von öffentlichen Code-Servern (cdnjs, jsDelivr) geladen.\n- **Kurse** kommen aus einer öffentlichen GitHub-Datei und von CoinGecko. Diese Anfragen enthalten keine persönlichen Daten, verraten aber wie jede Webanfrage deine Internetadresse.\n- **Apple-Pay-Automation** (optional): Betrag und Händler liegen kurz unverschlüsselt in deiner eigenen Sync-Datei und werden dann gelöscht.\n- **Backups sind deine Aufgabe**: Browserdaten löschen oder die App vom Home-Bildschirm entfernen löscht die Daten auf diesem Gerät.\n- **Vertrauen**: Der Code ist öffentlich. Updates kommen von der Person, die die App pflegt.\n\n## Ledgerline mit Freunden und Familie teilen\n\nJeder kann Ledgerline über denselben Link nutzen. Die Daten bleiben auf den eigenen Geräten; niemand sieht die Daten anderer.\n\n1. Link schicken. Auf dem iPhone in Safari öffnen, **Teilen → Zum Home-Bildschirm**. Auf dem Mac in Safari: **Ablage → Zum Dock hinzufügen**.\n2. Beim ersten Öffnen startet die **Einrichtung**: Name, Währung, Sprache, Monatseinkommen, Fixkosten, Sparpläne, Bargeld und Sparziel. Jeder Schritt lässt sich überspringen, alles später in den Einstellungen ändern (**Einstellungen → Backup & Export → Einrichtung erneut starten**).\n3. Für Sync zwischen den eigenen Geräten und die Apple-Pay-Automation nutzt jede Person ihr **eigenes** GitHub-Konto und Token (Abschnitte 9 und 2).\n4. Neue Versionen kommen automatisch beim nächsten Öffnen an; die Daten werden beim ersten Start angepasst.\n5. ETF-Kurse kommen aus `tickers.json`. Fehlt ein Fonds, kann er dort ergänzt werden (Abschnitt 5), oder man gibt den Kurs von Hand ein.\n\n## 3. Die App auf eine neue Version bringen\n\n1. Die neue `index.html` herunterladen.\n2. Im Repository **Add file → Upload files** wählen, die Datei hineinziehen (Name genau `index.html`) und **Commit changes** klicken.\n3. Im Tab **Actions** warten, bis **pages build and deployment** einen grünen Haken zeigt (1 bis 2 Minuten, länger, wenn GitHub ausgelastet ist).\n4. Die App ganz schließen und neu öffnen. Auf dem Mac lädt ⌘R neu.\n\nDeine Daten bleiben erhalten; neue Versionen passen alte Daten beim ersten Start automatisch an.\n\n## 4. Kurse\n\n- ETF-Kurse werden werktags alle 2 Stunden zwischen 09:23 und 23:23 Uhr deutscher Zeit aktualisiert. Nachts und am Wochenende nicht, weil die Börsen geschlossen sind.\n- **Kurse aktualisieren** auf der Seite Vermögen prüft auf eine neuere Kursdatei; GitHub lädt dadurch nicht früher neue Kurse.\n- Sofort laden: **Actions → Update prices → Run workflow**. Ein manueller Lauf aktualisiert auch die ETF-Zusammensetzungen.\n- Kryptokurse kommen live von CoinGecko.\n- Zeigt ein Kurs „—“: **Einstellungen → Kurs-Updater** nennt Fonds, bei denen der letzte Lauf fehlschlug. Prüfe dann das Yahoo-Symbol in `tickers.json`.\n\n## 5. Ein neues Investment hinzufügen\n\n### ETF, Aktie oder Anleihe-ETF mit automatischen Kursen\n\n1. Das **Yahoo-Finance-Symbol** suchen (bei Xetra meist mit `.DE` am Ende, z. B. `EUNL.DE`; die ISIN auf finance.yahoo.com suchen).\n2. In Ledgerline: **Vermögen → Position hinzufügen**, **ETF oder Aktie** wählen, Name, ISIN, Symbol, Broker, Anteile und **Anlageklasse** eintragen.\n3. Auf GitHub `tickers.json` bearbeiten und eine Zeile in die Liste einfügen, durch Komma getrennt:\n\n   ```\n   { \"symbol\": \"VAGF.DE\", \"isin\": \"IE00BG47KH54\", \"name\": \"Vanguard Global Aggregate Bond\" }\n   ```\n\n4. Den Workflow von Hand starten (Abschnitt 4), damit der Kurs sofort erscheint.\n5. Optional für die Sektor- und Länderdiagramme (nur Aktien): iShares- und Xtrackers-Fonds bekommen automatische Zusammensetzungen; einen vorhandenen Eintrag in `tickers.json` kopieren und anpassen.\n\n### Krypto\n\n**Position hinzufügen → Krypto** und die CoinGecko-ID eintragen (das Wort in der CoinGecko-Adresse, z. B. `bitcoin`).\n\n### Alles ohne automatischen Kurs (Private Equity, Rente, Immobilienanteil)\n\n**Position hinzufügen → Sonstiges Investment** oder **Private Equity** und den Kurs selbst eintragen; bei neuen Auszügen aktualisieren oder den Auszug importieren.\n\n### Eine neue Anlageklasse\n\nIm Positionsdialog **Anlageklasse → + Neue Anlageklasse …** wählen und einen Namen eingeben.\n\n### Sparpläne\n\n**Einstellungen → Dauerplan → Sparpläne**: Plan anlegen, mit der Position verknüpfen und den Tag im Monat setzen. Ledgerline fügt dann jeden Monat automatisch Anteile hinzu.\n\n## 6. Plan und Einstellungen ändern\n\n- **Einkommen, Fixkosten, jährliche Kosten, Sparpläne**: **Einstellungen → Dauerplan**, jeweils mit dem echten Abbuchungstag. Nur einen Monat ändern: **Monat → Plan dieses Monats bearbeiten**.\n- **Sparquoten-Ziel**: **Einstellungen → Sparquoten-Ziel**, optional mit Änderung ab einem Monat. Der Schalter darunter legt den Bargeld-Anteil des Ziels vor deinem Ausgabebudget zurück.\n- **Kategorien**: **Einstellungen → Kategorien**: hinzufügen, umbenennen, umfärben, löschen; das Betragsfeld ist ein optionales Monatslimit.\n- **Sprache, Währung, Zahlenformat**: **Einstellungen → Budget**.\n- **Einstellungen finden**: Suchfeld oder Gruppentasten (Plan, Geld, Investments, Geräte, Erweitert).\n- **Wohin das Geld floss / Vermögen im Zeitverlauf**: Zeitraum 1M, 3M, 6M, 1J oder Alle. Die Zusammenfassung zählt erst ab Beginn deiner Aufzeichnung; davor (gestrichelte Linie) ist es eine Schätzung aus deinen heutigen Positionen zu früheren Kursen.\n- **Boxen**: Auf den Titel tippen klappt eine Box ein; **Boxen anordnen** unten auf jeder Seite verschiebt sie. Beides wird pro Gerät gespeichert.\n\n## 7. Bargeld und Konten\n\nLedgerline behandelt alle Konten als eine Summe. Das Budget des laufenden Monats wird davon zurückgehalten; der Rest zählt als Ersparnisse.\n\n- Summe korrigieren: **Vermögen → Ersparnisse → Saldo aktualisieren**, optional mit jedem Konto einzeln.\n- **Neues Sparkonto**: einfach als weitere Zeile hinzufügen. Überweisungen zwischen eigenen Konten sind nie Ausgaben; der Import überspringt sie.\n- Zinsen kommen als **Einnahme → Ersparnisse** hinein; der Import erledigt das bei Zinszeilen automatisch.\n\n## Währungen\n\nAlles wird in deiner **Heimatwährung** angezeigt (die Einrichtung fragt danach; ändern unter **Einstellungen → Budget → Währung**). Wenn du in mehreren Währungen lebst, verdienst oder investierst, setz darunter das Häkchen **Ich nutze mehr als eine Währung**. Dann:\n\n- **Einträge**: Neben dem Betrag auf Heute und im Eintragsdialog gibt es eine Währungsauswahl. Ein Kauf über 12,00 £ wird als 12,00 £ gespeichert und zum Kurs des Tages umgerechnet; der Originalbetrag bleibt in der Liste sichtbar.\n- **Plan**: Jedes Einkommen, jede Fixkosten-Position und jeder Sparplan kann eine eigene Währung haben (ein Gehalt in CHF, Miete in GBP). Das Monatsbudget nutzt den Kurs am Zahltag, bis dahin den heutigen.\n- **Konten**: Unter **Saldo aktualisieren** bekommt jedes Konto eine Währung; die Summe wird umgerechnet.\n- **Positionen**: Jede Position hat eine Kurswährung, aus der Kursdatei (ein US-Fonds in USD) oder im Dialog gewählt. Der Wert wird zum heutigen Kurs umgerechnet, der Verlauf zum Kurs jedes Tages.\n- **Schulden**: Beim Anlegen die Währung wählen. Die Karte zeigt Beträge in dieser Währung plus die umgerechnete Summe; Tilgungen werden zum Tageskurs umgerechnet.\n- **Vermögen**: Wechsle zwischen **Alles in [Heimatwährung]** und **Je Währung** (nebeneinander, nicht umgerechnet), dazu ein Diagramm **Währungen** unter Anlageklassen.\n- **Heimatwährung ändern** rechnet Einträge zum Kurs ihres Tages um; Plan, Positionen, Konten und Schulden behalten ihre Währung und werden automatisch umgerechnet.\n- **Wechselkurse** sind die offiziellen täglichen EZB-Referenzkurse (etwa 30 Währungen, darunter USD, GBP, CHF, CAD und SGD), dazu VAE-Dirham, Saudi- und Katar-Riyal, Omanischer Rial sowie Bahrain- und Jordanischer Dinar über ihre offizielle feste Bindung an den US-Dollar, geladen von frankfurter.app und auf dem Gerät gespeichert, sodass die App offline mit den letzten Kursen funktioniert. **Aktualisieren** bei der Währungseinstellung lädt sie neu.\n\nMit nur einer Währung ändert sich nichts: Jede Zahl ist genau wie vorher.\n\n## 8. Schulden\n\n- **Schulden → Schuld hinzufügen**: Restbetrag, Zinssatz (0 bei zinsfrei) und optional Zieldatum.\n- **Tilgungsplan**: „Mit fester Monatsrate tilgen“ aktivieren, Betrag und Tag setzen. Die Rate wird Teil der Fixkosten und nach Zinsen automatisch abgezogen.\n- Sondertilgungen: **Tilgung erfassen** auf der Seite Schulden, aus Ersparnissen oder aus dem Monatsbudget.\n\n## 9. Sync zwischen Geräten\n\n- **Nur das erste Gerät** erstellt die Sync-Datei: Sync-ID leer lassen, GitHub-Token und eine Passphrase eingeben, **Sync-Datei erstellen**. Die **Sync-ID** steht danach im selben Feld, mit einer **Kopieren**-Taste, und bleibt dort sichtbar.\n- **Jedes weitere Gerät**: dasselbe Token, **diese** Sync-ID und dieselbe Passphrase, dann **Verbinden**. Auf einem neuen Gerät führt dich die Einrichtung über „Ich nutze Ledgerline schon auf einem anderen Gerät“ direkt dorthin.\n- Alle Geräte müssen **dieselbe Sync-ID** zeigen. Weicht eine ab, dort **Dieses Gerät trennen** und mit der richtigen ID verbinden; die Daten werden zusammengeführt.\n- Token, Sync-ID und Passphrase gehören in den Passwortmanager. Die Passphrase lässt sich nicht wiederherstellen.\n- Das Token ist ein klassisches GitHub-Token nur mit der Berechtigung **gist**.\n- **Sprache**: Englisch oder Deutsch unter **Einstellungen → Budget → Sprache**.\n\n## 10. App-Sperre\n\n**Einstellungen → App-Sperre**: Face ID / Touch ID mit PIN als Ersatz, auf jedem Gerät separat. Die App sperrt sich nach 2 Minuten im Hintergrund.\n\n## 11. Fehlerbehebung\n\n- **Kurse wirken alt**: siehe Abschnitt 4. Ein roter Lauf von **Update prices** unter Actions zeigt den Grund; meist behebt sich das beim nächsten Lauf.\n- **App nach dem Hochladen nicht aktualisiert**: Prüfen, ob die Datei genau `index.html` heißt, auf den grünen Haken bei **pages build and deployment** warten, dann neu laden. Bleiben Bereitstellungen auf „Queued“, githubstatus.com prüfen.\n- **„Sync problem, see Settings“**: **Einstellungen → Sync zwischen Geräten** nennt den genauen Grund. „Slow down“ ist GitHubs Limit und verschwindet von selbst; „Refused access“ heißt, dem Token fehlt die gist-Berechtigung.\n- **Apple-Pay-Zahlungen kommen nicht an**: siehe Abschnitt 2.\n- **Nach einem Import stimmt etwas nicht**: den Eintrag auf der Seite Monat öffnen und bearbeiten oder löschen.\n- **Demodaten** (**Einstellungen → Backup & Export → Mit Demodaten ansehen**): überschreiben nie deine Daten. Sie fügen Beispiel-Einträge von Januar bis heute hinzu, als Demo markiert, und werden wie jeder Eintrag auf deine anderen Geräte synchronisiert. Solange sie da sind, fließen sie in Budget, Sparquote und Diagramme ein. **Demodaten entfernen** an derselben Stelle löscht genau diese Einträge und stellt Startmonat, Kontosumme und Meilensteine wieder her (für ein paar Sekunden erscheint **Rückgängig**). Ganz ohne Auswirkung auf deine Daten probierst du sie in einem separaten Browser aus (etwa einem Safari-Tab statt der App auf dem Home-Bildschirm), ohne Sync zu verbinden.\n- **Ein Gerät neu aufsetzen**: zuerst ein Backup unter **Einstellungen → Backup & Export** sichern, später mit **Aus Backup wiederherstellen** einspielen.\n\n## 12. For an AI assistant or developer\n\nRead this section before changing anything. The owner is not a programmer: give back complete files that can be uploaded as they are, and explain any GitHub steps one click at a time.\n\n### Constraints\n\n- The app is a single self-contained `index.html`: vanilla JavaScript, no framework, no build step, no package manager. Keep it that way.\n- External code is only loaded lazily, when needed, from cdnjs.cloudflare.com or cdn.jsdelivr.net: PDF.js for PDF text and Tesseract.js for screenshot OCR. Everything else is inline.\n- Network access is limited to: the GitHub API (encrypted Gist sync), ECB exchange rates from frankfurter.app, `prices.json` and `compositions.json` from the same repository (raw.githubusercontent.com first, then the same origin), CoinGecko for crypto, and the two CDNs. No analytics and no other servers.\n- Personal data stays on the device. Imports are parsed locally.\n- **The repository is public. Never write personal data into the code** (no names, amounts, holdings or share counts in seed data, defaults or examples). `seedPlan`, `seedHoldings` and `seedDebts` are deliberately empty; a new device is filled by sync or a backup.\n- UI text is American English. **Dates are always displayed day/month/year** (05/10/2026), via `fmtDate`, `fmtDateTime` and the date-box enhancer. Never show month/day.\n\n### Code layout of index.html\n\nThe file is a sequence of blocks, in this order. Later blocks may use earlier ones; the boot block must stay last.\n\n1. `<head>` and `<style>`: design tokens as CSS variables (light and dark), layout, components, print styles for the PDF summary.\n2. Core script: constants and storage keys, formatting helpers (money in integer cents, `fmt`, `fmtDate`), icons, categories and seed data, `defaultState` and `migrate`, the budget engine (`computeMonth`, `aggregate`, weekday model, odds simulation), cash (`cashSavings`, cash outlook), wealth (`wealth`, `wealthSeries`, prices via `Prices`), debt (`debtLedger`, `debtStatus`, `debtPlansFor`), projection (Monte Carlo), diversification, charts (`sankeySVG`, `flowNodes`, and others), sync (`Sync`, AES-GCM with a PBKDF2 key) and app lock (`Lock`, WebAuthn and PIN).\n3. UI script: `render()`, one `view…()` function per page, dialogs, the `ACTIONS` map (every button has `data-act=\"name\"`), input binding, collapsible boxes (`decoratePanels`).\n4. Importer: `IMP` (pure parsers per document type, plus `IMP.genericPdf` as a best-effort fallback for unknown banks: Trade Republic, Sparkasse, flatex, Coinbase), classification in `buildProposals` (transfers, fixed-cost and plan matching, refunds, duplicates, categories), and the review dialog. Duplicates are found with `align()`, an order-preserving one-to-one pairing of same-amount, similar-name entries within 2 days (and 15 minutes when both have a time); entries from the same file are never paired. Don't replace this with a simple \"same amount within a few days\" check: it merges repeated purchases.\n5. PDF summary: section builders and fit-to-one-page printing.\n6. Overview: savings rate and goal, typical month, category trends and limits, Ways to save, net-worth change, the More sheet.\n   Extras (after the date boxes and the manual): the Apple Pay inbox (`Inbox`: reads and deletes comments of the form `ledgerline|amount|merchant` on the sync Gist and feeds them through the normal import review), \"?\" help (`HELP`, one text per box title, plus `HELP_BY_VIEW` for boxes titled with the user's own text; every new box needs an entry), Settings search and groups, `Undo`, nudges, and milestone celebrations. They hook in through `window.AFTER_RENDER`, a list of functions that runs after every render.\n7. Arrange mode: drag-and-drop box order (`applyLayout`).\n8. Date boxes: replaces native date inputs with day/month/year text boxes.\n9. Manual (this text, plus `MANUAL_DE`, the German user manual), extras (see above), the setup wizard (`openWizard`), which opens once on a device without data or sync, and German (`DE`, `DE_BLOCK`, `DE_PAT`, `HELP_DE`). The interface is written in English; with German selected, a translation pass swaps every rendered text: whole formatted paragraphs (`DE_BLOCK`), single texts (`DE`), then sentences with numbers (`DE_PAT`, regular expressions). Untranslated text stays English. **New or changed English text needs a matching German entry**; the source dictionaries are in `i18n/` in the working files (generated into the `DE…` constants).\n10. Boot: starts sync, the lock and the first render. It must stay the final script.\n\n### Data model\n\nStored in localStorage under `ledgerline:data:v2` (UI state under `ledgerline:ui:v2`, collapsed boxes and layout under their own keys). Shape:\n\n- `schema`: version number. Bump it in `defaultState` and add a step in `migrate()` whenever the stored shape changes; old data must keep working.\n- `settings`: the recurring plan (`recurring.income`, `bills`, `annual`, `savings`), `categories` (with optional `limit`), `fixedGroups`, `cash` (`amount`, `date`, `mode: 'accounts'`), `cashAccounts`, `savingsGoals`, `goalInBudget`, `assetClasses`, `projection`, sync and price settings.\n- `months`: `{ \"YYYY-MM\": plan }`, a copy of the plan per month so changes to one month don't affect others.\n- `transactions`: `{ id: { name, amount, date, type, category, … } }`. `type` is `out` (spending), `in` (money in), `invest` (with `accountId` and `source` budget, bonus or savings), `debt` (with `debtId`), or `sell` (with shares, gross, tax and fees).\n- `holdings`: `{ id: { name, isin, symbol, kind, assetClass, broker, base: { shares, date, at }, manualPrice, coingeckoId } }`. Share counts are `base` plus plan executions and transactions after `base.date`.\n- `debts`: `{ id: { name, original, rate, plan: { on, amount, day, start }, base: { balance, date }, target } }`.\n\nCurrencies (`4m_fx` block): every amount is stored in the home currency (`settings.currency`); an entry in another currency also keeps `cur` and `orig` (original cents). Plan items, holdings (`cur`, else the price file's `currency`, else a guess from the symbol), cash accounts and debts can carry `cur` and are converted when read (`fxPlan`, `quoteOf`/`priceOn` wrappers, `debtTxAmount`, `totalDebt`). Rates: `FX.rate(cur, iso)` (EUR-based, latest published day on or before the date), `fxConv(cents, from, to, iso)`. With no foreign `cur` anywhere, conversion returns its input unchanged; keep it that way. `fetch_prices.py` stores each quote's `currency` (London pence converted to pounds).\n\nRules: amounts are integers in cents; dates are stored as ISO `YYYY-MM-DD`; every object carries `updatedAt`; deleting sets `deleted: true` (needed for sync, which merges per object, last write wins). Never rename storage keys.\n\n### Price pipeline\n\nGitHub Actions runs `fetch_prices.py` every 2 hours on weekdays, and `fetch_compositions.py` monthly and on manual runs, then commits `prices.json` (quotes plus about 400 days of daily closes) and `compositions.json`. The app shows each file's timestamp. To support a new fund, add it to `tickers.json`.\n\n### Testing a change\n\n1. In the repository folder, run `python3 -m http.server 8765` and open http://localhost:8765/.\n2. **Settings → Backup & export → Preview with demo data** fills ten months of entries so every chart has content.\n3. Check every page at desktop width and at phone width (390 px), in light and dark mode. Check that no page scrolls sideways and that no date shows month/day.\n4. Check that the money-flow diagram balances: everything into \"Money in\" equals everything out of it.\n5. Check that an existing backup still loads (migration).\n\n### Handing back a change\n\nReturn the complete updated `index.html`, plus any other changed files, with upload steps. **Every new version adds an entry at the top of `CHANGELOG`** (shown once as \"What's new\"). **Significant new features also update the tour** (`TOUR_STEPS`, English and German) and, where relevant, the setup help (`SETUP_HELP_EN`, `SETUP_HELP_DE`); small fixes don't. **Every change to the app must come with an updated manual**: edit `MANUAL.md` and the copy embedded in `index.html` (the `MANUAL_MD` constant) together, raise `APP_VERSION` (shown in Settings) and the version line at the top of this manual to the same value. Keep features working that the owner relies on: the importer, the Apple Pay inbox, sync, app lock, the savings-rate goal in the budget, day/month/year dates, and collapsed and arranged boxes.\n";
function mdToHtml(md) {
  const inline = t => esc(t).replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>').replace(/(https?:\/\/[^\s<)]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>');
  const lines = md.split('\n'), out = []; let list = null, para = [], code = null;
  const flushP = () => { if (para.length) { out.push(`<p>${inline(para.join(' '))}</p>`); para = []; } };
  const flushL = () => { if (list) { out.push(`<${list.t}>${list.items.map(i => `<li>${inline(i)}</li>`).join('')}</${list.t}>`); list = null; } };
  for (const raw of lines) {
    const l = raw.replace(/\s+$/, '');
    if (code !== null) { if (/^\s*```/.test(l)) { out.push(`<pre><code>${esc(code.join('\n'))}</code></pre>`); code = null; } else code.push(l.trim()); continue; }
    if (/^\s*```/.test(l)) { flushP(); code = []; continue; }
    let m;
    if ((m = /^(#{1,3})\s+(.*)$/.exec(l))) { flushP(); flushL(); const n = m[1].length, id = 'm-' + m[2].toLowerCase().replace(/[^a-z0-9]+/g, '-'); out.push(`<h${n + 1} id="${id}">${inline(m[2])}</h${n + 1}>`); continue; }
    if ((m = /^\s*(\d+)\.\s+(.*)$/.exec(l)) || (m = /^\s*-\s+(.*)$/.exec(l))) { flushP(); const t = /^\s*\d+\./.test(l) ? 'ol' : 'ul', txt = m[2] ?? m[1]; if (!list || list.t !== t) { flushL(); list = { t, items: [] }; } list.items.push(txt); continue; }
    if (!l.trim()) { flushP(); if (list && !/^\s/.test(raw)) { /* blank line inside a list: keep the list open */ } continue; }
    if (list && /^\s{2,}/.test(raw)) { list.items[list.items.length - 1] += ' ' + l.trim(); continue; }
    flushL(); para.push(l.trim());
  }
  flushP(); flushL();
  return out.join('');
}
function viewManual() {
  const MD = uiLang() === 'de' ? MANUAL_DE.replace('VERSION', APP_VERSION) : MANUAL_MD;
  const html = mdToHtml(MD), toc = [...MD.matchAll(/^##\s+(.*)$/gm)].map(m => `<a href="#m-${m[1].toLowerCase().replace(/[^a-z0-9]+/g, '-')}">${esc(m[1])}</a>`).join('');
  return `<div class="page-head"><div><h1>${uiLang() === 'de' ? 'Anleitung' : 'Manual'}</h1><p class="sub">${uiLang() === 'de' ? 'Wie du Ledgerline nutzt, aktualisierst und erweiterst. Die englische Fassung liegt als <code>MANUAL.md</code> auf GitHub, für KI-Assistenten.' : 'How to use, update and extend Ledgerline. The same text is in <code>MANUAL.md</code> on GitHub, for any AI assistant you work with.'}</p></div><div class="right"><button class="btn" data-act="setup-help">${uiLang() === 'de' ? 'Einrichtungshilfe für deine KI' : 'Setup help for your AI'}</button><button class="btn" data-act="manual-download">${uiLang() === 'de' ? 'Anleitung herunterladen' : 'Download MANUAL.md'}</button></div></div>
  <div class="panel manual-toc">${toc}</div><div class="panel manual">${html.replace(/^<h2[^>]*>.*?<\/h2>/, '')}</div>`;
}
Object.assign(ACTIONS, { 'manual-download': () => uiLang() === 'de' ? download('ANLEITUNG.md', MANUAL_DE.replace('VERSION', APP_VERSION), 'text/markdown') : download('MANUAL.md', MANUAL_MD, 'text/markdown') });
</script>
<script>
'use strict';
/* =========================================================================
   1. Apple Pay inbox. An iPhone Shortcuts automation runs after each Wallet payment and posts
      "ledgerline|<amount>|<merchant>" as a comment on your sync Gist. Ledgerline collects these,
      shows them for confirmation (or adds them straight away), then deletes the comments.
   ========================================================================= */
const Inbox = {
  items: [], lastCheck: 0, busy: false,
  url() { return Sync.cfg?.gistId ? `https://api.github.com/gists/${Sync.cfg.gistId}/comments` : ''; },
  parseAmount(t) {
    let s = String(t || '').replace(/[^\d,.\-]/g, ''); if (!s) return NaN;
    const lc = s.lastIndexOf(','), ld = s.lastIndexOf('.');
    if (lc > ld) s = s.replace(/\./g, '').replace(',', '.'); else s = s.replace(/,/g, '');
    const v = Math.round(Math.abs(parseFloat(s)) * 100); return Number.isFinite(v) ? v : NaN;
  },
  async check(force = false) {
    if (!Sync.on || !Sync.cfg?.gistId || this.busy || (!force && Date.now() - this.lastCheck < 60000)) return this.items;
    this.busy = true; this.lastCheck = Date.now();
    try {
      const list = await Sync.api(`/gists/${Sync.cfg.gistId}/comments?per_page=100`) || [];
      this.items = list.map(c => { const m = /^\s*ledgerline\s*\|([^|]*)\|([^|]*)(?:\|(.*))?$/is.exec(c.body || ''); if (!m) return null;
        const amount = this.parseAmount(m[1]), d = new Date(c.created_at); return Number.isFinite(amount) && amount > 0 ? { cid: c.id, amount, rawAmount: (m[1] || '').trim(), merchant: (m[2] || 'Apple Pay').trim() || 'Apple Pay', card: (m[3] || '').trim(), date: isoDate(d), time: `${pad2(d.getHours())}:${pad2(d.getMinutes())}` } : null; }).filter(Boolean);
      if (this.items.length && state.settings.applePayMode === 'auto') this.addAll();
    } catch (e) { console.warn('Inbox', e); } finally { this.busy = false; }
    if (typeof render === 'function' && ['overview', 'today', 'settings'].includes(ui.view)) render();
    return this.items;
  },
  proposals() { const imp = buildProposals([{ label: 'Apple Pay', isPdf: false, tx: this.items.map(i => ({ date: i.date, time: i.time, amount: i.amount, dir: 'out', name: i.merchant, raw: i.merchant, account: i.card || 'Apple Pay' })) }]); imp.inboxIds = this.items.map(i => i.cid); return imp; },
  review() { if (!this.items.length) { toast('No new Apple Pay payments.'); return; } ui.imp = this.proposals(); ui.imp.files = []; paintReview(); },
  async addAll() { const imp = this.proposals(), r = applyImport(imp); await this.clear(imp.inboxIds); toast(`Added ${r.nTx} Apple Pay payment${r.nTx === 1 ? '' : 's'}. Tap one on the Month page to change it.`); render(); },
  async clear(ids) { for (const id of ids || []) { try { await Sync.api(`/gists/${Sync.cfg.gistId}/comments/${id}`, { method: 'DELETE' }); } catch (e) { console.warn(e); } } this.items = this.items.filter(i => !(ids || []).includes(i.cid)); },
};
// clear the inbox comments once a review that came from it has been applied
const _impApply = ACTIONS['imp-apply'];
ACTIONS['imp-apply'] = (...a) => { const ids = ui.imp?.inboxIds; _impApply(...a); if (ids && ids.length) Inbox.clear(ids).then(() => render()); };
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') setTimeout(() => Inbox.check(), 1500); });
setTimeout(() => Inbox.check(true), 2500);

function automationsPanel() {
  const on = !!(Sync.on && Sync.cfg?.gistId), mode = state.settings.applePayMode || 'ask', url = Inbox.url() || 'https://api.github.com/gists/YOUR-SYNC-ID/comments';
  return `<div class="panel"><h2>Apple Pay automation</h2>
    <p class="sub">Your iPhone can send every Apple Pay payment to Ledgerline by itself. You set this up once in Apple’s <b>Shortcuts</b> app; it takes about five minutes. Do it on the iPhone, with this page open in Ledgerline so you can copy the two values below.</p>
    <div class="facts" style="margin:10px 0"><div class="f"><span>Needs</span><span style="text-align:right;font-weight:500">iOS 17 or later · your card in Apple Wallet · sync working on this iPhone</span></div>
      <div class="f"><span>Sync on this device</span><span>${on ? '<b class="pos">Connected</b>' : '<b class="neg">Not set up yet</b>'}</span></div></div>

    <h3 style="margin:14px 0 6px">1. Choose what happens with payments</h3>

       a paste box for iPhone's long-press Paste, and ⌘V anywhere on a Mac.

async function importBlobs(blobs) {
  const files = blobs.map((b, i) => b instanceof File && b.name ? b : new File([b], `Pasted screenshot${blobs.length > 1 ? ' ' + (i + 1) : ''}.${(b.type.split('/')[1] || 'png').replace('jpeg', 'jpg')}`, { type: b.type || 'image/png' }));
  if (!files.length) return false;
  if (!$('#impProgress')) openImport();
  await runImport(files); return true;
}
ACTIONS['imp-paste'] = async () => {
  try {
    if (!navigator.clipboard?.read) throw new Error('no clipboard');
    const items = await navigator.clipboard.read(), blobs = [];
    for (const it of items) { const t = it.types.find(x => x.startsWith('image/')); if (t) blobs.push(await it.getType(t)); }
    if (!blobs.length) { toast('There’s no picture on the clipboard. Copy the screenshot first.'); return; }
    await importBlobs(blobs);
  } catch { toast('Tap the box next to the button and choose Paste.'); $('#pasteZone')?.focus(); }
};
document.addEventListener('paste', e => {
  const files = [...(e.clipboardData?.files || [])].filter(f => f.type.startsWith('image/') || f.type === 'application/pdf');
  const inZone = e.target && e.target.id === 'pasteZone', inField = e.target && /^(INPUT|TEXTAREA)$/.test(e.target.tagName);
  if (!files.length) { if (inZone) { e.preventDefault(); toast('That wasn’t a picture. Copy the screenshot first.'); } return; }
  if (inField && !inZone) return;

});

const Undo = {

    clearTimeout(this.t); this.t = setTimeout(() => { bar.classList.remove('show'); this.snap = null; }, 7000);
  },
  restore() {

      for (const id of new Set([...Object.keys(o), ...Object.keys(cur)])) { if (JSON.stringify(o[id]) !== JSON.stringify(cur[id])) { if (o[id]) o[id].updatedAt = ts; else { o[id] = { ...cur[id], deleted: true, updatedAt: ts }; } } } }
    if (JSON.stringify(old.settings) !== JSON.stringify(state.settings)) old.settings.updatedAt = ts;

  },
};
for (const [name, label] of [['tx-del', 'Entry deleted.'], ['hold-del', 'Holding deleted.'], ['debt-del', 'Debt deleted.'], ['imp-apply', 'Import added.'], ['sample-remove', 'Demo data removed.'], ['ways-reset', 'Suggestions restored.']]) {

ngs aside before my spending budget (recommended)": "Ersparnis vor meinem Ausgabebudget zurücklegen (empfohlen)", "You’re set up": "Alles eingerichtet", "Start using Ledgerline": "Ledgerline verwenden", "Goal": "Ziel", "Your spending budget": "Dein Ausgabebudget", "A private budget and wealth tracker. Your data is stored on your device, not on a server, and nobody else can see it.": "Ein privater Budget- und Vermögens-Tracker. Deine Daten liegen auf deinem Gerät, nicht auf einem Server, und niemand sonst kann sie sehen.", "DD/MM/YYYY": "TT.MM.JJJJ", "Date (day/month/year)": "Datum (Tag.Monat.Jahr)", "No data yet.": "Noch keine Daten.", "Edit": "Bearbeiten", "Search": "Suchen", "Main": "Haupt", "Optional: enter each account and the total adds up by itself. Opened a savings account? Just add it here; all accounts count towards one cash total.": "Optional: Trag jedes Konto ein, die Summe ergibt sich von selbst. Ein Sparkonto eröffnet? Füg es einfach hier hinzu; alle Konten zählen zu einer gemeinsamen Summe.", "Add an account": "Konto hinzufügen", "Add up what’s in all your accounts right now (current, savings and broker cash accounts). Ledgerline keeps aside what this month still needs and counts the rest as savings.": "Zähle zusammen, was gerade auf all deinen Konten liegt (Giro-, Spar- und Verrechnungskonten). Ledgerline legt zurück, was dieser Monat noch braucht, und zählt den Rest als Ersparnisse.", "Day’s budget": "Tagesbudget", "Add file": "Add file", "Add income for this month to get a daily budget: Month, then “Edit this month’s plan”.": "Trag ein Einkommen für diesen Monat ein, um ein Tagesbudget zu bekommen: Monat, dann „Plan dieses Monats bearbeiten“.", "Cumulative spending with projected range": "Kumulierte Ausgaben mit Prognosebereich", "Daily spending against daily budget": "Tägliche Ausgaben im Vergleich zum Tagesbudget", "Flow of money from income to its destinations": "Geldfluss vom Einkommen zu seinen Zielen", "For automatic prices, also add this line
