<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ledgerline">
<meta name="theme-color" content="#F2F4F3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F1720" media="(prefers-color-scheme: dark)">
<meta name="referrer" content="no-referrer">
<title>Ledgerline</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%2316212E'/><path d='M14 44h36M14 34h24M14 24h14' stroke='%233DBA8D' stroke-width='6' stroke-linecap='round'/></svg>">
<link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' fill='%2316212E'/><path d='M14 44h36M14 34h24M14 24h14' stroke='%233DBA8D' stroke-width='6' stroke-linecap='round'/></svg>">
<style>
:root{
  --paper:#F2F4F3; --surface:#FFFFFF; --surface-2:#E7ECEA; --ink:#16212E; --muted:#5B6775; --line:#D6DCDF;
  --pine:#1F7A5C; --pine-soft:#DCEFE7; --crimson:#C62F3E; --crimson-soft:#F8E1E3; --amber:#A36C00; --amber-soft:#F6EBD3;
  --cobalt:#3346C9; --cobalt-soft:#E3E6FA; --fixed:#55626F; --pot:#B7791F; --halo:#FFFFFF;
  --font:-apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --display:-apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  color-scheme:light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#0F1720; --surface:#17212C; --surface-2:#1F2B38; --ink:#E8EDF2; --muted:#96A3B1; --line:#2A3644;
    --pine:#3DBA8D; --pine-soft:#173A31; --crimson:#F0606C; --crimson-soft:#40202A; --amber:#E7B13A; --amber-soft:#3A2F17;
    --cobalt:#8794FF; --cobalt-soft:#232B55; --fixed:#8C99A7; --pot:#E0A84A; --halo:#17212C; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0F1720; --surface:#17212C; --surface-2:#1F2B38; --ink:#E8EDF2; --muted:#96A3B1; --line:#2A3644;
  --pine:#3DBA8D; --pine-soft:#173A31; --crimson:#F0606C; --crimson-soft:#40202A; --amber:#E7B13A; --amber-soft:#3A2F17;
  --cobalt:#8794FF; --cobalt-soft:#232B55; --fixed:#8C99A7; --pot:#E0A84A; --halo:#17212C; color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.45;font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--cobalt)}
:focus-visible{outline:2px solid var(--cobalt);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.app{display:grid;grid-template-columns:minmax(0,1fr);min-height:100vh}
.app>div,.grid>*{min-width:0}
.rail{display:none}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--paper) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);display:flex;align-items:center;gap:12px;padding:12px 18px;border-bottom:1px solid var(--line)}
.brand{font-family:var(--display);font-weight:800;letter-spacing:-.03em;font-size:20px;display:flex;align-items:center;gap:8px}
.brand svg{width:22px;height:22px}
.sync-pill{margin-left:auto;font-size:13px;color:var(--muted);background:none;border:1px solid var(--line);border-radius:999px;padding:4px 10px;cursor:pointer;display:flex;align-items:center;gap:6px}
.sync-pill .dot{width:7px;height:7px;border-radius:50%;background:var(--muted)}
.sync-pill.ok .dot{background:var(--pine)} .sync-pill.err .dot{background:var(--crimson)} .sync-pill.busy .dot{background:var(--amber)}
main{padding:18px 16px 110px;max-width:1120px;width:100%;margin:0 auto}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabbar button{flex:1;background:none;border:0;padding:9px 2px 8px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;min-width:0;color:var(--muted);cursor:pointer}
.tabbar button svg{width:22px;height:22px}
.tabbar button[aria-current="page"]{color:var(--ink);font-weight:700}
.tabbar button[aria-current="page"] svg{color:var(--cobalt)}
@media (min-width:900px){
  .app{grid-template-columns:232px minmax(0,1fr)}
  .rail{display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh;padding:22px 14px;border-right:1px solid var(--line);background:var(--surface)}
  .rail .brand{padding:0 10px 18px}
  .rail button{display:flex;align-items:center;gap:10px;background:none;border:0;border-radius:8px;padding:10px 12px;cursor:pointer;color:var(--muted);font-size:15px;text-align:left}
  .rail button svg{width:20px;height:20px}
  .rail button:hover{background:var(--surface-2);color:var(--ink)}
  .rail button[aria-current="page"]{background:var(--ink);color:var(--paper);font-weight:600}
  .rail .rail-foot{margin-top:auto;font-size:12px;color:var(--muted);padding:0 10px}
  .tabbar{display:none} .topbar .brand{display:none}
  main{padding:26px 34px 60px}
}

h1{font-family:var(--display);font-size:clamp(26px,4vw,36px);letter-spacing:-.025em;line-height:1.1;margin:0;font-weight:800}
h2{font-family:var(--display);font-size:18px;letter-spacing:-.01em;margin:0 0 4px;font-weight:700}
h3{font-size:15px;margin:0 0 6px;font-weight:700}
.sub{color:var(--muted);font-size:14px;margin:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px}
.panel+.panel,.grid+.panel,.panel+.grid,.grid+.grid,.kpis+.panel,.kpis+.grid,.tips+.panel,.kpis+.tips{margin-top:16px}
.panel-head{display:flex;align-items:baseline;gap:8px 12px;flex-wrap:wrap;margin-bottom:12px}
.panel-head .right{margin-left:auto}
.grid{display:grid;gap:16px}
.grid>.panel,.grid>div>.panel:first-child{margin-top:0}
.grid>div>.panel+.panel{margin-top:16px}
@media (min-width:760px){.g2{grid-template-columns:1fr 1fr}.g-wide{grid-template-columns:1.4fr 1fr}}
@media (min-width:900px){.g3{grid-template-columns:repeat(3,1fr)}}
.page-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.page-head .right{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.scroll-x{overflow-x:auto;-webkit-overflow-scrolling:touch}
.chart svg{display:block;width:100%;height:auto}
.chart.min600 svg{min-width:600px}
.muted{color:var(--muted)} .pos{color:var(--pine)} .neg{color:var(--crimson)} .warn{color:var(--amber)}
.small{font-size:13px}
.empty{padding:22px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:12px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 14px;cursor:pointer;font-weight:600;font-size:14px;white-space:nowrap;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.btn.danger{color:var(--crimson);border-color:color-mix(in srgb,var(--crimson) 40%,var(--line))}
.btn.ghost{border-color:transparent;background:none}
.btn.icon{padding:8px;border-radius:50%;width:38px;height:38px}
.btn svg{width:18px;height:18px}
.btn:disabled{opacity:.5;cursor:not-allowed}
label.field{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--muted);font-weight:500}
label.check{display:flex;gap:8px;align-items:center;font-size:14px;cursor:pointer}
label.check input{width:18px;height:18px;accent-color:var(--cobalt)}
.input,select.input{width:100%;border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:10px 12px;font-size:16px;color:var(--ink);min-width:0}
.input:focus{outline:2px solid var(--cobalt);outline-offset:0;border-color:transparent}
.input.money{text-align:right}
.seg{display:inline-flex;background:var(--surface-2);border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;border-radius:8px;padding:7px 12px;font-size:14px;cursor:pointer;color:var(--muted);font-weight:600}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(10,20,30,.12)}
.seg.pot button[aria-pressed="true"][data-fund="savings"],.seg.pot button[aria-pressed="true"][data-dest="savings"]{color:var(--pot)}
.month-nav{display:flex;align-items:center;gap:6px}
.month-nav .label{min-width:150px;text-align:center;font-weight:700;font-size:17px}
.form-grid{display:grid;gap:10px;grid-template-columns:1fr 1fr}
@media (max-width:520px){.form-grid{grid-template-columns:1fr}}

.hero{position:relative;padding:22px 20px 20px;border-radius:20px;background:var(--surface);border:1px solid var(--line);overflow:hidden}
.hero .label{font-size:15px;color:var(--muted);font-weight:600}
.figure{font-family:var(--display);display:flex;align-items:baseline;gap:2px;font-weight:800;letter-spacing:-.045em;line-height:.95;margin:8px 0 4px;font-size:clamp(64px,15vw,112px)}
.figure .cur{font-size:.42em;font-weight:700;letter-spacing:-.02em;margin-right:4px;align-self:flex-start;margin-top:.12em;color:var(--muted)}
.figure .dec{font-size:.36em;font-weight:700;letter-spacing:-.01em;color:var(--muted)}
.hero.s-over-today .figure,.hero.s-overdrawn .figure,.hero.s-unrecoverable .figure{color:var(--crimson)}
.hero.s-tight .figure{color:var(--amber)}
.hero-meta{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:14px;color:var(--muted)}
.hero-meta b{color:var(--ink);font-weight:700}
.odds{display:flex;align-items:center;gap:12px;margin-top:16px}
.odds .ring{flex:none;width:52px;height:52px}
.odds .t{font-size:14px;color:var(--muted);line-height:1.35}
.odds .t b{color:var(--ink);font-size:16px}
.runway{margin-top:16px;display:grid;gap:7px}
.runway .row{display:grid;grid-template-columns:86px 1fr 56px;align-items:center;gap:10px;font-size:13px;color:var(--muted)}
.runway .track{height:10px;border-radius:5px;background:var(--surface-2);overflow:hidden;position:relative}
.runway .fill{position:absolute;inset:0 auto 0 0;border-radius:5px}
.runway .row span:last-child{text-align:right;color:var(--ink);font-weight:600}
.status{margin-top:16px;padding:12px 14px;border-radius:12px;font-size:15px;line-height:1.4;display:flex;gap:10px;align-items:flex-start}
.status svg{flex:none;width:20px;height:20px;margin-top:1px}
.status.on-track,.status.good{background:var(--pine-soft)} .status.on-track svg,.status.good svg{color:var(--pine)}
.status.tight,.status.warn{background:var(--amber-soft)} .status.tight svg,.status.warn svg{color:var(--amber)}
.status.over-today,.status.overdrawn,.status.unrecoverable,.status.bad{background:var(--crimson-soft)} .status.over-today svg,.status.overdrawn svg,.status.unrecoverable svg,.status.bad svg{color:var(--crimson)}
.status.neutral,.status.info{background:var(--surface-2)} .status.info svg{color:var(--cobalt)}

.safety{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px 4px 4px;cursor:pointer;font-size:13px;color:var(--muted)}
.safety svg{width:30px;height:30px}
.safety b{color:var(--ink)}

.qa{display:grid;gap:12px}
.qa-row{display:grid;grid-template-columns:1fr 130px;gap:10px}
.qa .big{font-size:18px;padding:13px 14px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 11px;font-size:13px;cursor:pointer;font-weight:600;color:var(--ink)}
.chip .sw{width:9px;height:9px;border-radius:50%}
.chip[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--paper)}
.chip .conf{font-weight:500;opacity:.7;font-size:12px}
.guess-note{font-size:12px;color:var(--muted)}
.qa-foot{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.qa-foot .btn.primary{margin-left:auto;padding:12px 20px;font-size:15px}
.fund-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:13px;color:var(--muted)}

.tx-list{display:flex;flex-direction:column}
.tx-day{font-size:13px;font-weight:700;color:var(--muted);padding:12px 2px 4px;display:flex;justify-content:space-between}
.tx{display:grid;grid-template-columns:10px 1fr auto;gap:12px;align-items:center;padding:10px 4px;border:0;border-bottom:1px solid var(--line);cursor:pointer;background:none;text-align:left;width:100%}
.tx:hover{background:var(--surface-2)}
.tx .sw{width:10px;height:10px;border-radius:3px}
.tx .name{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tx .meta{font-size:12px;color:var(--muted)}
.tx .amt{font-weight:700;text-align:right}
.tx .amt.in{color:var(--pine)} .tx .amt.inv{color:var(--cobalt)} .tx .amt.pot{color:var(--pot)}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:1px 6px;border-radius:5px;background:color-mix(in srgb,var(--pot) 18%,transparent);color:var(--pot);margin-left:6px;vertical-align:1px}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media (min-width:760px){.kpis{grid-template-columns:repeat(3,1fr)}.kpis.k4{grid-template-columns:repeat(4,1fr)}}
@media (min-width:1100px){.kpis.k6{grid-template-columns:repeat(6,1fr)}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.kpi .k{font-size:13px;color:var(--muted)}
.kpi .v{font-family:var(--display);font-size:22px;font-weight:800;letter-spacing:-.02em;margin-top:2px}
.kpi .d{font-size:12px;color:var(--muted);margin-top:2px}
.cat-rows{display:grid;gap:9px}
.cat-split{display:grid;gap:18px;align-items:center;grid-template-columns:minmax(0,1fr)}
@media (min-width:520px){.cat-split{grid-template-columns:minmax(0,170px) minmax(0,1fr)}}
.cat-row{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center;font-size:14px}
.cat-row .bar{grid-column:1/-1;height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden;display:flex}
.cat-row .bar i{display:block;height:100%}
.cat-row .nm{display:flex;align-items:center;gap:8px;font-weight:600}
.cat-row .nm .sw{width:9px;height:9px;border-radius:50%}
.cat-row .vv{font-weight:700}
.cat-row .vv small{color:var(--muted);font-weight:500;margin-left:6px}

.tips{display:grid;gap:10px}
@media (min-width:760px){.tips{grid-template-columns:repeat(3,1fr)}}
.tip{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:12px;font-size:14px;line-height:1.4;background:var(--surface);border:1px solid var(--line)}
.tip svg{flex:none;width:18px;height:18px;margin-top:1px}
.tip.good svg{color:var(--pine)} .tip.warn svg{color:var(--amber)} .tip.info svg{color:var(--cobalt)}

.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .dow{font-size:11px;color:var(--muted);text-align:center;padding-bottom:2px}
.cal button.day{aspect-ratio:1/1;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:4px;display:flex;flex-direction:column;justify-content:space-between;cursor:pointer;font-size:11px;min-width:0;overflow:hidden;text-align:left}
.cal .day .n{font-weight:700;font-size:12px}
.cal .day .s{font-size:10px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal .day.under{background:var(--pine-soft);border-color:transparent}
.cal .day.over{background:var(--crimson-soft);border-color:transparent}
.cal .day.today{outline:2px solid var(--cobalt);outline-offset:-2px}
.cal .day.sel{border-color:var(--ink);border-width:2px}
.cal .day.future .n{color:var(--muted)}
.day-detail{margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted);margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}

details.plan>summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:10px}
details.plan>summary::-webkit-details-marker{display:none}
details.plan>summary .chev{margin-left:auto;transition:transform .2s}
details.plan[open]>summary .chev{transform:rotate(180deg)}
.rows{display:grid;gap:8px;margin:8px 0 4px}
.erow{display:grid;grid-template-columns:1fr 64px 110px 38px;gap:8px;align-items:center}
.erow.sav,.erow.fx{grid-template-columns:1fr 1fr 64px 110px 38px}
.erow.fx.annual{grid-template-columns:1fr 1fr 96px 110px 38px}
.erow.cat{grid-template-columns:34px 1fr 96px auto 38px}
.erow .input{padding:8px 10px;font-size:15px}
.erow input[type=color]{width:34px;height:34px;border:0;padding:0;background:none;border-radius:8px;cursor:pointer}
.col-head{display:grid;font-size:12px;color:var(--muted);gap:8px}
.col-head span.r{text-align:right}
.plan-sec{padding:14px 0;border-bottom:1px solid var(--line)}
.plan-sec:last-child{border-bottom:0;padding-bottom:0}
.plan-total{font-size:13px;color:var(--muted);text-align:right;margin-top:4px}
@media (max-width:560px){
  .erow.sav,.erow.fx{grid-template-columns:1fr 56px 100px 38px}.erow.fx.annual{grid-template-columns:1fr 84px 100px 38px}
  .erow.sav .acc,.erow.fx .acc{grid-column:1/-1;grid-row:2}
  .col-head.wide{display:none}
  .erow.cat{grid-template-columns:34px minmax(0,1fr) 38px}.erow.cat .limit{grid-column:2/3;grid-row:2}.erow.cat .potflag{grid-column:2/3;grid-row:3}
}

table.t{width:100%;border-collapse:collapse;font-size:14px;min-width:640px}
table.t th{text-align:right;font-weight:600;color:var(--muted);font-size:12px;padding:8px 10px;border-bottom:1px solid var(--line)}
table.t td{text-align:right;padding:9px 10px;border-bottom:1px solid var(--line)}
table.t th:first-child,table.t td:first-child{text-align:left}
table.t tr.total td{font-weight:800;border-bottom:0}
table.t tr.click{cursor:pointer} table.t tr.click:hover td{background:var(--surface-2)}
table.t td .nm{font-weight:600} table.t td .mt{font-size:12px;color:var(--muted)}

dialog{border:0;border-radius:18px;padding:0;background:var(--surface);color:var(--ink);width:min(520px,calc(100vw - 24px));max-height:calc(100vh - 40px)}
dialog.wide{width:min(680px,calc(100vw - 24px))}
dialog::backdrop{background:rgba(8,14,22,.55)}
.dlg{padding:20px;display:grid;gap:14px}
.dlg-foot{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.dlg-foot .btn.danger{margin-right:auto}
.dlg-sec{border-top:1px solid var(--line);padding-top:14px;display:grid;gap:10px}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);opacity:0;background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:10px;font-size:14px;z-index:60;transition:all .25s;pointer-events:none;max-width:90vw}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media (min-width:900px){.toast{bottom:28px}}

.bd{display:grid;gap:0}
.bd .r{display:grid;grid-template-columns:1fr auto;gap:10px;padding:7px 0;font-size:14px;border-bottom:1px solid var(--line)}
.bd .r span:last-child{font-weight:600;text-align:right}
.bd .r.sub2{color:var(--muted)}
.bd .r.tot{font-weight:800;border-bottom:2px solid var(--ink)}
.bd .r.tot span:last-child{font-weight:800}
.bd .r.final{border-bottom:0;padding-top:12px;align-items:baseline}
.bd .r.final span:first-child{font-weight:700;font-size:15px}

  <div class="panel"><div class="panel-head"><h2>Where this could lead</h2><p class="sub">2,000 simulated futures in today’s euros. A scenario, not a forecast.</p></div>

    <p class="small muted" style="margin:8px 0 0">“Raise it by” is how much you increase your monthly investment each year, on top of inflation: 0% keeps €${(pr.monthly / 100).toFixed(0)} worth the same in today’s money, 2% is roughly typical real wage growth. Return and volatility are suggested from your mix: ${pr.sug.ret}% and ${pr.sug.vol}%, weighted by what you hold now and where your plans will invest over the next ten years.${p.ret != null || p.vol != null ? ` <a href="#" data-act="proj-reset">Use the suggested values</a>` : ''}</p>

    <div style="display:flex;gap:6px 20px;flex-wrap:wrap;margin-top:10px"><label class="check"><input type="checkbox" data-bind="proj:withCash" ${p.withCash !== false ? 'checked' : ''}>Add my cash savings (${fmt(w.cash.balance, { whole: true })}, held flat)</label>
    ${w.debt ? `<label class="check"><input type="checkbox" data-bind="proj:withDebt" ${p.withDebt !== false ? 'checked' : ''}>Subtract my remaining debt (${fmt(w.debt, { whole: true })})</label>` : ''}</div>

      <div class="rows">${(p.withdrawals || []).map(x => `<div class="erow" style="grid-template-columns:110px 1fr 38px"><input class="input" type="number" min="${p.age + 1}" max="${p.toAge}" step="1" data-bind="projw:${x.id}:age" value="${x.age}" aria-label="Age">${moneyInput(`projw:${x.id}:amount`, x.amount)}<button class="btn icon ghost" data-act="projw-del" data-id="${x.id}" aria-label="Remove">${ICONS.x}</button></div>`).join('')}</div>
      ${(p.withdrawals || []).length ? '<div class="col-head" style="grid-template-columns:110px 1fr 38px"><span>At age</span><span class="r">Amount, in today’s euros</span><span></span></div>' : ''}
      <button class="btn ghost small" data-act="projw-add">${ICONS.plus}Add a withdrawal</button>

    <div class="ages" style="margin-top:12px">${ages.map(r => `<div class="a" ${r.custom ? 'style="outline:2px solid var(--pine)"' : ''}><div class="k">At ${r.age}</div><div class="v">${fmt(r.p50, { whole: true })}</div><div class="r">${fmt(r.p10, { whole: true })} to ${fmt(r.p90, { whole: true })}</div>${r.wd ? `<div class="r" style="color:var(--pot);font-weight:700">after taking out ${fmt(r.wd.amount, { whole: true })}</div>` : ''}
      <div class="r" style="margin-top:6px;border-top:1px solid var(--line);padding-top:6px">Paid in <b style="color:var(--ink)">${fmt(r.paid, { whole: true })}</b></div><div class="r">Growth <b class="${r.p50 - r.paid < 0 ? 'neg' : 'pos'}">${fmt(r.p50 - r.paid, { sign: true, whole: true })}</b>${r.paid > 0 ? ` (${(r.p50 / r.paid).toFixed(1)}×)` : ''}</div></div>`).join('')}</div>

}

function divPie(entries, label) {
  const total = sum(entries, e => e[1]); if (!total) return '<p class="sub" style="text-align:center">No data yet.</p>';
  const withCol = entries.map((e, i) => [e[0], e[1], e[2] || (/^(Other countries|Other sectors|Not known)$/.test(e[0]) ? '#9AA3AD' : PIE_COLORS[i % PIE_COLORS.length])]);
  return `${pie(withCol, 150, label)}<div class="facts" style="margin-top:10px">${withCol.map(([n, v, c]) => `<div class="f"><span style="display:flex;gap:8px;align-items:center"><i style="width:10px;height:10px;border-radius:3px;background:${c};display:inline-block;flex:none"></i>${esc(n)}</span><span>${(v / total * 100).toFixed(1)}%</span></div>`).join('')}</div>`;
}
function divSources(dv) {
  const live = dv.sources.filter(s => s.src === 'ishares' || s.src === 'dws'), fact = dv.sources.filter(s => s.src === 'factsheet'), none = dv.sources.filter(s => s.src === 'none');
  const asOf = live.map(s => s.asOf).filter(Boolean).sort().at(-1);
  return [live.length ? `${live.length} fund${live.length === 1 ? '' : 's'} from the providers’ full holdings lists${asOf ? `, updated ${fmtDate(asOf)}` : ''} (refreshed monthly).` : '',
    fact.length ? `${fact.map(s => esc(s.h.name)).join(', ')}: approximate factsheet values${live.length ? '' : ' until the monthly updater first runs'}.` : '',
    none.length ? `No composition data for ${none.map(s => esc(s.h.name)).join(', ')}, shown as “Not known”.` : '', 'Only stocks are broken down by sector and country; cash, bonds, crypto and other asset classes appear in Asset types.'].filter(Boolean).join(' ');
}

/* ---------- Debt ---------- */
function viewDebt() {
  const ds = liveDebts().map(debtStatus), total = sum(ds, x => x.remaining), w = wealth();
  if (!ds.length) return `<div class="page-head"><div><h1>Debt</h1></div><div class="right"><button class="btn primary" data-act="debt-add">${ICONS.plus}Add a debt</button></div></div><div class="empty">No debts. Nice.</div>`;
  return `<div class="page-head"><div><h1>Debt</h1><p class="sub">${fmt(total)} left to repay. Net worth ${fmt(w.net, { whole: true })} after debt, ${fmt(w.assets, { whole: true })} before.</p></div><div class="right"><button class="btn" data-act="debt-add">${ICONS.plus}Add a debt</button></div></div>
  ${ds.map(st => debtCard(st)).join('')}`;
}
function debtCard(st) {
  const d = st.d, sn = safetyNet(), chunks = st.needMonthly ? [3, 6, 12].filter(n => n <= st.monthsLeft).map(n => `${fmt(st.needMonthly * n, { whole: true })} every ${n} months`) : [];
  const status = st.remaining <= 0 ? `<div class="status good">${ICONS.check}<span>Paid off. Well done.</span></div>`
    : st.needMonthly && !st.plan ? `<div class="status ${st.onTrack ? 'good' : 'warn'}">${st.onTrack ? ICONS.check : ICONS.info}<span>To be debt-free by ${fmtDate(d.target)}, you need ${fmt(st.needMonthly)} a month on average${chunks.length ? `, for example ${chunks.join(' or ')}` : ''}. ${st.onTrack ? (st.ahead > 100 ? `You’re ${fmt(st.ahead, { whole: true })} ahead of a steady schedule.` : 'You’re on schedule.') : `You’re ${fmt(-st.ahead, { whole: true })} behind a steady schedule.`}${st.payoffMonth ? ` At your pace so far you’d finish around ${monthLabel(st.payoffMonth)}.` : ''}</span></div>`
    : st.plan && st.forecast.never ? `<div class="status bad">${ICONS.alert}<span>Your instalment of ${fmt(st.plan.amount)} is less than the ${fmt(st.forecast.monthlyInterest)} of interest added each month, so this debt keeps growing. Raise the instalment under Edit.</span></div>`
    : st.plan && st.forecast.payoffMonth ? `<div class="status good">${ICONS.check}<span>On your repayment plan you’re debt-free in ${monthLabel(st.forecast.payoffMonth)}. Extra one-off repayments bring that forward.</span></div>`
    : `<div class="status info">${ICONS.info}<span>Set a target date or a repayment plan under Edit to see when you’ll be debt-free${st.pace ? `. At your pace so far that’s around ${monthLabel(st.payoffMonth)}` : ''}.</span></div>`;
  return `<div class="grid g-wide">
    <div class="panel"><div class="panel-head"><h2>${esc(d.name)}</h2><span class="sub">${esc(d.note || '')}</span><button class="btn ghost right small" data-act="debt-edit" data-id="${d.id}">Edit</button></div>
      <div style="display:flex;gap:16px;flex-wrap:wrap;align-items:flex-end"><div><div class="sub">Left to repay</div><div style="font-family:var(--display);font-size:clamp(40px,8vw,60px);font-weight:800;letter-spacing:-.045em;line-height:1;color:#7A4E9E">${fmt(st.remaining, { whole: st.remaining % 100 === 0 })}</div></div>
        <div class="sub" style="padding-bottom:6px">of ${fmt(st.original, { whole: true })}, ${Math.round(st.pct * 100)}% paid off</div></div>
      <div class="comp" style="margin-top:14px"><i style="width:${(st.pct * 100).toFixed(2)}%;background:#7A4E9E"></i></div>
      ${status}
      ${debtTerms(st)}
      <div class="chart" style="margin-top:14px">${debtChart(st)}</div>
      <div class="legend"><span><i style="background:#7A4E9E;height:3px"></i>Balance</span>${st.plan && st.remaining > 0 ? '<span><i style="background:#7A4E9E;height:2px;opacity:.7"></i>With your repayment plan</span>' : ''}${d.target ? '<span><i style="background:var(--amber);height:2px"></i>Straight line to your target</span>' : ''}</div></div>
    <div><div class="panel"><h2>Record a repayment</h2>
      <div class="rows" style="margin-top:10px"><div class="qa-row"><input class="input money big" id="dpAmt-${d.id}" data-debt="${d.id}" inputmode="decimal" placeholder="0.00" aria-label="Amount"><input class="input" type="date" id="dpDate-${d.id}" value="${todayISO()}" aria-label="Date"></div>
        <div class="seg pot" role="group" id="dpFrom-${d.id}">${[['savings', 'From cash savings'], ['budget', 'From this month’s budget']].map(([v, l], i) => `<button data-act="dp-from" data-debt="${d.id}" data-dest="${v}" aria-pressed="${i === 0}">${l}</button>`).join('')}</div>
        <div id="dpPrev-${d.id}" class="facts"></div>
        <button class="btn primary" data-act="debt-pay" data-id="${d.id}">${ICONS.plus}Record repayment</button></div></div>
      <div class="panel"><h2>Repayments</h2>${st.pays.length ? txList([...st.pays].reverse(), false) : '<p class="sub">None yet. Each repayment you record lowers the balance and, if paid from savings, your cash savings.</p>'}</div></div>
  </div>`;
}
function debtTerms(st) {
  const f = st.forecast, rows = [];
  rows.push(['Interest', st.rate ? `${st.rate.toLocaleString('en-US', { maximumFractionDigits: 2 })}% a year, added monthly` : 'Interest-free']);
  if (st.rate && st.interestSoFar) rows.push(['Interest added since ' + fmtDate(st.d.base.date), fmt(st.interestSoFar)]);
  if (st.plan) {
    rows.push(['Repayment plan', `${fmt(st.plan.amount)} on the ${ord(st.plan.day || 1)} of each month, from ${monthLabel(st.plan.start || curMonth())}`]);
    if (st.next) rows.push(['Next instalment', `${fmt(st.next.amount)} on ${fmtDate(st.next.iso)}`]);
    if (f.never) rows.push(['Heads up', `<span class="neg">The instalment doesn’t cover the ${fmt(f.monthlyInterest)} monthly interest, so the balance would never go down.</span>`]);

function paintDebtPreview(id) {

/* ---------- cash-flow outlook: the next 60 days, from your plan’s payment dates ---------- */
function cashflowOutlook(days = 60) {
  const today = todayISO(), cmNow = computeMonth(curMonth()), w = wealth(), start = w.cash.balance + budgetCashNow();
  const wm = weekdayModel(), out = []; let bal = start, low = { v: start, iso: today };
  const d0 = new Date(today + 'T12:00');
  for (let k = 1; k <= days; k++) {
    const d = new Date(d0); d.setDate(d.getDate() + k); const iso = isoDate(d), mk = monthOf(iso), day = d.getDate();
    const p = state.months[mk] || planFromRecurring(), items = [];
    const at = x => Math.min(x.day || 1, daysIn(mk)) === day;
    (p.income || []).filter(at).forEach(x => items.push({ name: x.name, v: x.amount, kind: 'Income' }));
    (p.bills || []).filter(at).forEach(x => items.push({ name: x.name, v: -x.amount, kind: groupById(groupOf(x)).name }));
    (p.savings || []).filter(at).forEach(x => items.push({ name: x.name, v: -x.amount, kind: 'Investment plan' }));
    (p.annual || []).filter(x => Number(x.month) === d.getMonth() + 1 && at(x)).forEach(x => items.push({ name: x.name, v: -x.amount, kind: 'Annual cost' }));
    debtPlansFor(mk).filter(x => x.day === day).forEach(x => items.push({ name: x.name, v: -x.amount, kind: 'Debt repayment plan' }));
    const cm = mk === curMonth() ? cmNow : null;
    const spend = cm ? Math.max(0, cm.days[day - 1]?.allowance || 0) : (() => { const nm = nextMonthPlan(addMonths(mk, -1)); const w8 = wm.w[d.getDay()]; return Math.max(0, nm.budget) / daysIn(mk) * w8; })();
    bal += sum(items, x => x.v) - spend;
    if (bal < low.v) low = { v: bal, iso };
    out.push({ iso, items, spend, bal });
  }
  return { start, points: out, low };
}
/* Money in your accounts that still belongs to this month: what’s left to spend plus scheduled payments still to come, minus income still to arrive. */
function budgetCashAt(iso) {
  const mk = monthOf(iso), cm = computeMonth(mk), day = Number(iso.slice(8, 10)), p = cm.m, after = x => (x.day || 1) > day;
  const rem = cm.days[day - 1] ? cm.days[day - 1].endRem : cm.pool;
  const outLater = sum(debtPlansFor(mk).filter(x => x.day > day), x => x.amount) + sum((p.bills || []).filter(after), x => x.amount) + sum((p.savings || []).filter(after), x => x.amount) + sum((p.annual || []).filter(x => Number(x.month) === Number(mk.slice(5)) && after(x)), x => x.amount);
  const inLater = sum((p.income || []).filter(after), x => x.amount);
  return Math.max(0, rem) + outLater - inLater;
}
const budgetCashNow = () => budgetCashAt(todayISO());
function outlookChart(o) {
  const W = 760, H = 210, ml = 64, mr = 12, mt = 14, mb = 26, iw = W - ml - mr, ih = H - mt - mb, pts = [{ iso: todayISO(), bal: o.start, items: [] }, ...o.points], n = pts.length - 1;
  const vs = pts.map(p => p.bal), mn = Math.min(0, ...vs), mx = Math.max(...vs), step = niceMax(Math.max(mx - mn, 10000) / 4), lo = Math.floor(mn / step) * step, hi = Math.ceil(mx / step) * step || step;
  const x = i => ml + i / n * iw, y = v => mt + ih - (v - lo) / (hi - lo) * ih;
  let g = ''; for (let v = lo; v <= hi + 1; v += step) { const yy = ax(y(v)); g += `<line x1="${ml}" x2="${W - mr}" y1="${yy}" y2="${yy}" style="stroke:var(--line)"/><text x="${ml - 6}" y="${ax(yy + 4)}" text-anchor="end" style="fill:var(--muted);font-size:11px">${fmt(v, { whole: true })}</text>`; }
  const line = pts.map((p, i) => `${ax(x(i))},${ax(y(p.bal))}`).join(' ');
  let marks = '', lbl = '';
  pts.forEach((p, i) => { const big = sum(p.items.filter(it => Math.abs(it.v) >= 5000), it => it.v); if (p.items.length) marks += `<circle cx="${ax(x(i))}" cy="${ax(y(p.bal))}" r="${big ? 4 : 2.5}" style="fill:${sum(p.items, it => it.v) >= 0 ? 'var(--cobalt)' : 'var(--fixed)'}"><title>${fmtDate(p.iso)}: ${p.items.map(it => `${it.name} ${fmt(it.v, { sign: true })}`).join(', ')}</title></circle>`;
    if (i === 0 || p.iso.slice(8) === '01' || (i === n && pts[n].iso.slice(8) > '08')) lbl += `<text x="${ax(x(i))}" y="${H - 8}" text-anchor="${i === n ? 'end' : i === 0 ? 'start' : 'middle'}" style="fill:var(--muted);font-size:11px">${fmtDate(p.iso).slice(0, 5)}</text>`; });

}
function outlookPanel() {

    <p class="small muted" style="margin:4px 0 0">When on, each month’s budget is what’s left after your plans and the extra cash needed for the goal, so staying within budget means hitting it.</p></div>`;

<script>
'use strict';
/* =========================================================================
   Arrange mode. Every box (and every row of boxes) gets a handle; drag it to a new place.
   The order is saved per page on this device and re-applied after every render.
   ========================================================================= */
const LAYOUT_KEY = 'ledgerline:layout';
const Layout = { order: (() => { try { return JSON.parse(localStorage.getItem(LAYOUT_KEY) || '{}'); } catch { return {}; } })(), editing: false };
const saveLayout = () => { try { localStorage.setItem(LAYOUT_KEY, JSON.stringify(Layout.order)); } catch { } };
/* A stable name for a block: a box is named by its title; a row by the boxes inside it; anything else by its kind. */
function blockKey(el, i) {
  if (el.dataset.pkey) return el.dataset.pkey;
  const inner = [...el.querySelectorAll(':scope > .panel[data-pkey], :scope > div > .panel[data-pkey]')].map(p => p.dataset.pkey);
  if (inner.length) return 'row[' + inner.join('|') + ']';
  return (el.className || el.tagName).toString().split(/\s+/)[0] + ':' + i;
}
const containers = () => { const main = $('#main'); return main ? [main, ...$$('#main > .grid, #main > .set-cols')] : []; };
function applyLayout() {
  for (const c of containers()) {
    const kids = [...c.children].filter(el => !el.classList.contains('page-head') && !el.classList.contains('arrange-bar') && !el.classList.contains('nudge') && el.id !== 'setTools');
    kids.forEach((el, i) => { el.dataset.bkey = blockKey(el, i); });
    const ck = `${ui.view}::${c === $('#main') ? 'main' : blockKey(c, 0)}`, saved = Layout.order[ck];
    if (saved && saved.length) {
      const rank = new Map(saved.map((k, i) => [k, i]));
      // keep unknown (new) blocks next to the block they followed originally
      const sorted = [...kids].sort((a, b) => (rank.has(a.dataset.bkey) ? rank.get(a.dataset.bkey) : kids.indexOf(a) + .5) - (rank.has(b.dataset.bkey) ? rank.get(b.dataset.bkey) : kids.indexOf(b) + .5));
      sorted.forEach(el => c.appendChild(el));
    }
    c.dataset.lkey = ck;
  }
  document.body.classList.toggle('arranging', Layout.editing);
  if (Layout.editing) addHandles();
  const main = $('#main');
  if (main && !main.querySelector('.arrange-bar')) {
    const bar = document.createElement('div'); bar.className = 'arrange-bar';
    bar.innerHTML = Layout.editing
      ? `<span>Use <b>↑ ↓</b> or drag <b>⠿</b> to move a box. Rows of two have their own handle.</span><button class="btn" data-act="layout-reset">Reset this page</button><button class="btn primary" data-act="layout-done">Done</button>`
      : `<button class="btn ghost small" data-act="layout-edit">⠿ Rearrange boxes</button>`;
    main.appendChild(bar);
  }
}
function addHandles() {
  for (const c of containers()) for (const el of c.children) {
    if (!el.dataset.bkey || el.querySelector(':scope > .drag-h, :scope > summary > .drag-h')) continue;
    // A small toolbar: move up, drag handle, move down. The arrows work everywhere, also where dragging is awkward.
    const bar = document.createElement('div'); bar.className = 'drag-h';
    bar.innerHTML = `<button type="button" class="mv" data-dir="-1" aria-label="Move up">↑</button><span class="grip" aria-label="Drag to move" role="button">⠿</span><button type="button" class="mv" data-dir="1" aria-label="Move down">↓</button>`;
    bar.querySelector('.grip').addEventListener('pointerdown', startDrag);
    bar.querySelectorAll('.mv').forEach(m => m.addEventListener('click', ev => { ev.preventDefault(); ev.stopPropagation(); moveBlock(el, Number(m.dataset.dir)); }));
    bar.addEventListener('click', ev => { ev.preventDefault(); ev.stopPropagation(); });
    const host = el.tagName === 'DETAILS' && el.querySelector(':scope > summary') ? el.querySelector(':scope > summary') : el;
    host.prepend(bar); el.classList.add('draggable'); if (host !== el) host.style.position = 'relative';
  }
}
function saveOrder(parent) { Layout.order[parent.dataset.lkey] = [...parent.children].map(c => c.dataset.bkey).filter(Boolean); saveLayout(); }
function moveBlock(el, dir) {
  const parent = el.parentElement, sibs = [...parent.children].filter(c => c.dataset.bkey), i = sibs.indexOf(el), j = i + dir;
  if (j < 0 || j >= sibs.length) { toast(dir < 0 ? 'Already at the top.' : 'Already at the bottom.'); return; }
  if (dir < 0) parent.insertBefore(el, sibs[j]); else parent.insertBefore(el, sibs[j].nextSibling);
  saveOrder(parent); el.classList.add('moved'); setTimeout(() => el.classList.remove('moved'), 500);
  const r = el.getBoundingClientRect(); if (r.top < 80 || r.top > innerHeight - 120) window.scrollBy({ top: r.top - 120, behavior: 'smooth' });
}
function startDrag(e) {
  e.preventDefault(); e.stopPropagation();
  const h = e.currentTarget, blk = h.closest('[data-bkey]'), parent = blk.parentElement;
  try { h.setPointerCapture(e.pointerId); } catch { } blk.classList.add('dragging');
  const isGrid = parent.classList.contains('grid') && getComputedStyle(parent).gridTemplateColumns.split(' ').length > 1;
  let raf = 0, lastY = e.clientY, lastX = e.clientX;
  const move = ev => {
    lastY = ev.clientY; lastX = ev.clientX;
    const sibs = [...parent.children].filter(c => c !== blk && c.dataset.bkey);
    for (const s of sibs) {
      const r = s.getBoundingClientRect();
      if (lastY >= r.top && lastY <= r.bottom && (!isGrid || (lastX >= r.left && lastX <= r.right))) {
        const before = isGrid ? lastX < r.left + r.width / 2 : lastY < r.top + r.height / 2;
        parent.insertBefore(blk, before ? s : s.nextSibling); break;
      }
    }
    if (!raf) raf = requestAnimationFrame(function scroll() { raf = 0; const m = 70; if (lastY < m) { window.scrollBy(0, -12); raf = requestAnimationFrame(scroll); } else if (lastY > innerHeight - m) { window.scrollBy(0, 12); raf = requestAnimationFrame(scroll); } });
  };
  const up = () => {
    window.removeEventListener('pointermove', move); window.removeEventListener('pointerup', up); window.removeEventListener('pointercancel', up);
    blk.classList.remove('dragging'); cancelAnimationFrame(raf);
    saveOrder(parent);
  };
  window.addEventListener('pointermove', move); window.addEventListener('pointerup', up); window.addEventListener('pointercancel', up);
}
Object.assign(ACTIONS, {
  'layout-edit': () => { Layout.editing = true; render(); toast('Drag the handles to move boxes. Tap Done when finished.'); },
  'layout-done': () => { Layout.editing = false; render(); },
  'layout-reset': () => { for (const k of Object.keys(Layout.order)) if (k.startsWith(ui.view + '::')) delete Layout.order[k]; saveLayout(); render(); },
});
</script>
<script>
'use strict';
/* =========================================================================
   Date fields always show day/month/year. A browser's built-in date box follows the
   computer's region setting (often month/day/year), so each one is shown as a text box
   in DD/MM/YYYY with a calendar button; the original box stays underneath and keeps the value.
   ========================================================================= */
const DATE_PROTO = Object.getOwnPropertyDescriptor(HTMLInputElement.prototype, 'value');
function parseDMY(t) {
  const m = /^\s*(\d{1,2})[./\-\s](\d{1,2})[./\-\s](\d{2}|\d{4})\s*$/.exec(t || ''); if (!m) return null;
  const d = +m[1], mo = +m[2], y = m[3].length === 2 ? 2000 + +m[3] : +m[3];
  const dt = new Date(y, mo - 1, d); if (dt.getMonth() !== mo - 1 || dt.getDate() !== d) return null;
  return `${y}-${pad2(mo)}-${pad2(d)}`;
}
function enhanceDate(inp) {
  if (inp.dataset.dmy) return; inp.dataset.dmy = '1';
  const wrap = document.createElement('span'); wrap.className = 'dmy';
  const txt = document.createElement('input'); txt.type = 'text'; txt.className = inp.className.replace(/\bbig\b/, ''); txt.inputMode = 'numeric'; txt.placeholder = 'DD/MM/YYYY'; txt.setAttribute('aria-label', inp.getAttribute('aria-label') || 'Date (day/month/year)'); txt.autocomplete = 'off';
  const cal = document.createElement('span'); cal.className = 'dmy-cal'; cal.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15.5" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>';
  inp.parentNode.insertBefore(wrap, inp); wrap.append(txt, cal); cal.appendChild(inp);
  inp.classList.add('dmy-native'); inp.tabIndex = -1;
  const show = () => { const v = DATE_PROTO.get.call(inp); txt.value = v ? fmtDate(v) : ''; };
  // keep the text box in step when code sets the date (e.g. "Yesterday" buttons)
  Object.defineProperty(inp, 'value', { configurable: true, get() { return DATE_PROTO.get.call(inp); }, set(v) { DATE_PROTO.set.call(inp, v); show(); } });
  show();
  inp.addEventListener('input', show); inp.addEventListener('change', show);
  txt.addEventListener('change', () => {
    const iso = parseDMY(txt.value);
    if (txt.value.trim() && !iso) { txt.classList.add('bad'); toast('Enter the date as day/month/year, e.g. 05/10/2026.'); return; }
    txt.classList.remove('bad'); DATE_PROTO.set.call(inp, iso || ''); show();
    inp.dispatchEvent(new Event('input', { bubbles: true })); inp.dispatchEvent(new Event('change', { bubbles: true }));
  });
}
const enhanceDates = root => (root.querySelectorAll ? root.querySelectorAll('input[type="date"]:not([data-dmy])') : []).forEach(enhanceDate);
new MutationObserver(ms => { for (const m of ms) for (const n of m.addedNodes) if (n.nodeType === 1) { if (n.matches?.('input[type="date"]')) enhanceDate(n); else enhanceDates(n); } }).observe(document.body, { childList: true, subtree: true });
enhanceDates(document);
</script>
<script>
'use strict';
/* =========================================================================
   Manual page. The same text is in MANUAL.md in the repository, so an AI assistant can read it too.
   ========================================================================= */
const MANUAL_MD = "# Ledgerline manual\n\n*Version 2026-10-06 · 21. This manual is updated together with every new version of the app; the version number in **Settings → Backup & export** should match.*\n\nLedgerline is your personal budget and wealth app. It is one web page (`index.html`) hosted on GitHub Pages, plus a small price updater that runs on GitHub. Your entries never leave your devices except as an encrypted sync file in your own GitHub account.\n\nThis manual has two parts. Sections 1 to 11 are step-by-step instructions for you. Section 12 is a technical description for an AI assistant or a developer who works on the app.\n\n## 1. What lives where\n\nYour GitHub repository (`aaron-sn01/ledgerline`) contains:\n\n- `index.html`: the whole app.\n- `MANUAL.md`: this manual.\n- `fetch_prices.py`: downloads ETF prices from Yahoo Finance.\n- `fetch_compositions.py`: downloads what each ETF holds (sectors and countries), once a month.\n- `tickers.json`: the list of ETFs the updater fetches.\n- `.github/workflows/update-prices.yml`: tells GitHub when to run the two scripts.\n- `prices.json` and `compositions.json`: written by the updater. Never edit these by hand.\n\nYour data (entries, plan, holdings, debts, settings) is stored inside the app on each device. If sync is on, an encrypted copy is kept in a private GitHub Gist. The app's code contains **no personal data**: a new device starts empty (with a welcome note) and gets your data when you connect sync or restore a backup. Because the repository is public, nothing personal should ever be written into `index.html` or the other files.\n\n## 2. Everyday use\n\n1. **Add spending** on the Today page: type a name and amount. Ledgerline suggests a category; tap another one if it's wrong. It learns from every correction.\n2. **Import instead of typing**: tap **Import** and choose screenshots or PDF statements (Trade Republic, Sparkasse, flatex, Coinbase). Check the review list, untick what you don't want, then tap **Add selected**.\n   - **Duplicates**: an entry that's already in Ledgerline, or that appears in two of the files you import, is unticked with a note saying which entry it matches. Repeated purchases (several €3.00 tickets) are counted separately: each entry can only match one other, payments in the same file never count as duplicates, and different times of day (Apple Pay) mean different payments. If something is unticked wrongly, tick it.\n   - **Paste instead of saving**: take a screenshot, tap its thumbnail, then **Done → Copy and Delete**. In Ledgerline tap **Import → Paste screenshot** (if the iPhone asks, tap **Allow Paste**). If the button doesn't work, tap the dashed box next to it and choose **Paste**. On a Mac, ⌘V works while the Import window is open.\n3. **Browse days**: the app always opens on the Overview. On Today, use the arrows next to the date to see earlier or later days. New entries go on the day you're looking at.\n4. **Monthly review**: opens by itself after a month ends. Correct share counts and your cash total there.\n5. **Apple Pay, automatically**: set up the Shortcuts automation once (**Settings → Apple Pay automation**, steps below) and every Apple Pay payment arrives in Ledgerline by itself, either for you to confirm or added straight away.\n6. **Undo**: after deleting something or importing, an **Undo** button appears for a few seconds.\n7. **Help**: every box has a **?** next to its title that explains what it shows.\n8. **Back up**: after each monthly review, go to **Settings → Backup & export → Download backup** and keep the file in iCloud Drive or similar.\n\n### Setting up the Apple Pay automation (iPhone, once)\n\n**You need:** iOS 17 or later, your card in Apple Wallet, and sync working on the iPhone (section 9). The same steps are in the app under **Settings → Apple Pay automation** (type \"Apple Pay\" in the Settings search box), with buttons to copy the two values you need. Keep that page open while you work in Shortcuts.\n\n**In Ledgerline**\n\n1. Go to **Settings → Apple Pay automation**. Choose **Ask me to confirm** or **Add straight away**.\n2. Note the two values there: the **web address** (ending in `/comments`) and the **Authorization** value (starting with `Bearer`). You'll copy each one when needed.\n\n**In the Shortcuts app**\n\n1. Open **Shortcuts** and tap **Automation** in the bar at the bottom (not \"Shortcuts\"). Tap **+** at the top right (or **New Automation**).\n2. A list of triggers appears (Time of Day, Alarm, Email, …). Scroll down and tap **Transaction**, the one with the Wallet icon (\"When I tap my card\"). If you see actions such as *Open Card*, *Request Payment* or *Send Payment* instead, you're adding an action to a shortcut, not creating an automation: close it and start again from the Automation tab.\n3. Under **Card**, select the card(s) you pay with. Leave Merchant and Category as they are. Choose **Run Immediately**; switch off **Notify When Run** if you prefer. Tap **Next**.\n4. Tap **New Blank Automation**, then **Add Action**. Search for **Get Contents of URL** and tap it.\n\n   *On newer iOS versions* the automation opens as a shortcut beginning with **\"When Any Card is tapped\"**, followed by Categories, Merchants and switches for **Automation** (leave on) and **Notify**. That is the right screen. Tap **Any Card** to pick your card if you like, then add the action with the **Search** box at the bottom. There, the payment details are called **Transaction** or **Shortcut Input**; use whichever appears in steps 10 and 11. When finished, tap the back arrow at the top left to save.\n5. Tap the blue word **URL** and paste the web address from Ledgerline.\n6. Tap the small arrow **›** next to it. Set **Method** to **POST**.\n7. Under **Headers**, tap **Add new header**. Key: `Authorization`. Text: paste the Authorization value from Ledgerline.\n8. Under **Request Body**, choose **JSON**, tap **Add new field → Text**, and type `body` as the key.\n9. In the value box type `ledgerline|` (on the iPhone keyboard the `|` is under **123 → #+=**).\n10. In the bar above the keyboard tap **Shortcut Input**. Tap the inserted bubble and choose **Amount**.\n11. Type `|`, insert **Shortcut Input** again, tap it and choose **Merchant**. The value now reads `ledgerline|Amount|Merchant`.\n12. Tap **Done**.\n\n**Test it**: pay for something small with Apple Pay, then open Ledgerline. A banner shows the payment, or it's already added. Running the automation by hand doesn't work, because without a real payment there's no amount or shop.\n\n**If nothing arrives**: on the iPhone open **Settings → Apps → Wallet** and turn on **Mobile Data**; check the automation still says **Run Immediately**; use **Check for payments now** in Ledgerline; and if you ever replace your GitHub token, paste the new one into the automation as well. While a payment waits for Ledgerline it sits unencrypted on your sync file (amount and shop only), and it's deleted as soon as it's picked up.\n\n## 3. Updating the app to a new version\n\n1. Download the new `index.html`.\n2. In your repository, click **Add file → Upload files**, drop the file in (the name must be exactly `index.html`) and click **Commit changes**.\n3. Open the **Actions** tab and wait for **pages build and deployment** to show a green tick (1 to 2 minutes, longer if GitHub is busy).\n4. Close the app fully and open it again. On a Mac, ⌘R reloads.\n\nYour data carries over automatically. New versions upgrade old data on first launch.\n\nTo change any other file (for example `tickers.json`): open the file on GitHub, click the **pencil** icon, edit, then **Commit changes**.\n\n## 4. Prices\n\n- ETF prices update every 2 hours on weekdays between 09:23 and 23:23 German time. Nothing updates at night or on weekends because exchanges are closed.\n- **Refresh prices** on the Wealth page checks for a newer price file; it can't make GitHub fetch new prices sooner.\n- To fetch now: **Actions → Update prices → Run workflow**. A run by hand also refreshes the ETF compositions.\n- Ethereum and other crypto prices come live from CoinGecko.\n- If a price shows \"—\": open **Settings → Price updater**, which lists any fund the last run failed for. Check that fund's Yahoo symbol in `tickers.json`.\n\n## 5. Adding a new investment\n\n### An ETF, stock or bond ETF with automatic prices\n\n1. Find its **Yahoo Finance symbol**. For Xetra listings it usually ends in `.DE` (for example `EUNL.DE`). Search the ISIN on finance.yahoo.com to find it.\n2. In Ledgerline: **Wealth → Add holding**. Choose **ETF or stock**, then enter the name, ISIN, Yahoo symbol, broker and number of shares. Pick the **asset class** (Stocks, Bonds, Real estate, and so on).\n3. On GitHub, edit `tickers.json` and add a line inside the list, separated from the others by a comma:\n\n   ```\n   { \"symbol\": \"VAGF.DE\", \"isin\": \"IE00BG47KH54\", \"name\": \"Vanguard Global Aggregate Bond\" }\n   ```\n\n4. Run the workflow by hand (section 4) so the price appears straight away.\n5. Optional, for the sector and country charts (stocks only): iShares and Xtrackers funds can get automatic compositions. Copy an existing iShares or Xtrackers entry in `tickers.json` and adjust it. Without this, the fund still counts in Asset types but shows as \"Not known\" in sectors and countries.\n\n### Crypto\n\n**Add holding → Crypto**, then enter the CoinGecko id (the word in the CoinGecko web address, for example `bitcoin`). Prices come automatically.\n\n### Anything without an automatic price (private equity, a pension, a property share)\n\n**Add holding → Other investment** or **Private equity**, and enter the price yourself. Update the price when you get a new statement, or import the statement.\n\n### A new asset class\n\nIn the holding dialog, choose **Asset class → + New asset class…** and type a name. It appears as its own slice in Asset types and gets a cautious default return assumption in the projection.\n\n### Savings plans\n\n**Settings → Recurring plan → Investment plans**: add the plan, link it to the holding and set the day of the month. Ledgerline then adds the shares automatically each month.\n\n## 6. Changing your plan and settings\n\n- **Income, fixed costs, annual costs, investment plans**: **Settings → Recurring plan**. Set the real deduction day of each item; the cash outlook and the budget use it. To change one month only, use **Month → Edit this month's plan**.\n- **Savings-rate goal**: **Settings → Savings-rate goal**. Add a goal change from a given month (for example 20% from 03/2027). The switch below it decides whether the cash part of the goal is set aside before your spending budget.\n- **Spending categories**: **Settings → Categories**. Add, rename, recolor or delete them. The amount box next to each is an optional monthly limit; leave it empty for none.\n- **Fixed-cost groups** (Housing, Insurance and so on): **Settings → Fixed-cost groups**.\n- **Wealth over time**: the summary above the chart counts only from the day you started tracking. Anything earlier (the dashed line) is an estimate made from your current holdings at past prices, so it shows how the market moved, not how much you actually had.\n- **Finding a setting**: use the search box or the group buttons (Plan, Money, Investments, Devices, Advanced) at the top of Settings.\n- **Settings layout**: Recurring plan spans the full width; the other boxes flow in two columns (one on a phone).\n- **Box layout**: tap a box's title to collapse it. **Rearrange boxes** at the bottom of each page lets you drag boxes around. Both are remembered per device.\n\n## 7. Cash and accounts\n\nLedgerline treats all your accounts as one cash total. A month's budget is kept aside from that total until the month ends; the rest counts as cash savings.\n\n- To correct the total: **Wealth → Cash savings → Update balance**. You can list each account separately and the total adds up by itself.\n- **Opening a savings account** changes nothing in how Ledgerline works: add it as another account row in **Update balance**. Moving money between your own accounts is never spending; the importer skips such transfers.\n- Interest goes in as **Money in → Cash savings**. The importer does this automatically for interest lines.\n\n## 8. Debt\n\n- **Debt → Add a debt**: enter the amount left, the interest rate (0 for interest-free) and optionally a target date.\n- **Repayment plan**: tick \"Repay with a fixed monthly instalment\" and set the amount and day. It becomes a fixed cost in each month's budget and comes off the balance automatically, after interest.\n- One-off repayments: **Record repayment** on the Debt page, from cash savings or from that month's budget.\n\n## 9. Sync between devices\n\n- **Only the first device** creates the sync file: leave Sync ID empty, enter your GitHub token and a passphrase, and click **Create sync file**.\n- **Every other device**: enter the same token, **that** Sync ID and the same passphrase, then click **Connect**.\n- All devices must show the **same Sync ID**. If one differs, click **Disconnect this device** there and connect with the right ID; its data is merged in.\n- Keep the token, Sync ID and passphrase in your password manager. The passphrase cannot be recovered.\n- The token is a classic GitHub token with only the **gist** permission.\n\n## 10. App lock\n\n**Settings → App lock**: Face ID / Touch ID with a PIN as fallback, set separately on each device. The app locks after 2 minutes in the background.\n\n## 11. Troubleshooting\n\n- **Prices look old**: see section 4. A red **Update prices** run in Actions shows the reason when you open it; the next run usually fixes itself.\n- **App didn't update after uploading**: check the file is named exactly `index.html`, wait for the green tick on **pages build and deployment**, then reload. If deployments stay \"Queued\", check githubstatus.com; GitHub may be having problems.\n- **\"Sync problem, see Settings\"**: open **Settings → Sync between devices** for the exact reason. \"Slow down\" means GitHub's rate limit, which clears on its own. \"Refused access\" means the token is missing the gist permission.\n- **Something looks wrong after an import**: open the entry from the Month page and edit or delete it.\n- **Apple Pay payments don't arrive**: see the end of section 2.\n- **Start over on a device**: **Settings → Backup & export** to save a backup first, then restore it later with **Restore from backup**.\n\n## 12. For an AI assistant or developer\n\nRead this section before changing anything. The owner is not a programmer: give back complete files that can be uploaded as they are, and explain any GitHub steps one click at a time.\n\n### Constraints\n\n- The app is a single self-contained `index.html`: vanilla JavaScript, no framework, no build step, no package manager. Keep it that way.\n- External code is only loaded lazily, when needed, from cdnjs.cloudflare.com or cdn.jsdelivr.net: PDF.js for PDF text and Tesseract.js for screenshot OCR. Everything else is inline.\n- Network access is limited to: the GitHub API (encrypted Gist sync), `prices.json` and `compositions.json` from the same repository (raw.githubusercontent.com first, then the same origin), CoinGecko for crypto, and the two CDNs. No analytics and no other servers.\n- Personal data stays on the device. Imports are parsed locally.\n- **The repository is public. Never write personal data into the code** (no names, amounts, holdings or share counts in seed data, defaults or examples). `seedPlan`, `seedHoldings` and `seedDebts` are deliberately empty; a new device is filled by sync or a backup.\n- UI text is American English. **Dates are always displayed day/month/year** (05/10/2026), via `fmtDate`, `fmtDateTime` and the date-box enhancer. Never show month/day.\n\n### Code layout of index.html\n\nThe file is a sequence of blocks, in this order. Later blocks may use earlier ones; the boot block must stay last.\n\n1. `<head>` and `<style>`: design tokens as CSS variables (light and dark), layout, components, print styles for the PDF summary.\n2. Core script: constants and storage keys, formatting helpers (money in integer cents, `fmt`, `fmtDate`), icons, categories and seed data, `defaultState` and `migrate`, the budget engine (`computeMonth`, `aggregate`, weekday model, odds simulation), cash (`cashSavings`, cash outlook), wealth (`wealth`, `wealthSeries`, prices via `Prices`), debt (`debtLedger`, `debtStatus`, `debtPlansFor`), projection (Monte Carlo), diversification, charts (`sankeySVG`, `flowNodes`, and others), sync (`Sync`, AES-GCM with a PBKDF2 key) and app lock (`Lock`, WebAuthn and PIN).\n3. UI script: `render()`, one `view…()` function per page, dialogs, the `ACTIONS` map (every button has `data-act=\"name\"`), input binding, collapsible boxes (`decoratePanels`).\n4. Importer: `ImportCore.parse` (pure parsers per document type: Trade Republic, Sparkasse, flatex, Coinbase), classification in `buildProposals` (transfers, fixed-cost and plan matching, refunds, duplicates, categories), and the review dialog. Duplicates are found with `align()`, an order-preserving one-to-one pairing of same-amount, similar-name entries within 2 days (and 15 minutes when both have a time); entries from the same file are never paired. Don't replace this with a simple \"same amount within a few days\" check: it merges repeated purchases.\n5. PDF summary: section builders and fit-to-one-page printing.\n6. Overview: savings rate and goal, typical month, category trends and limits, Ways to save, net-worth change, the More sheet.\n   Extras (after the date boxes and the manual): the Apple Pay inbox (`Inbox`: reads and deletes comments of the form `ledgerline|amount|merchant` on the sync Gist and feeds them through the normal import review), \"?\" help (`HELP`, one text per box title, plus `HELP_BY_VIEW` for boxes titled with the user's own text; every new box needs an entry), Settings search and groups, `Undo`, nudges, and milestone celebrations. They hook in through `window.AFTER_RENDER`, a list of functions that runs after every render.\n7. Arrange mode: drag-and-drop box order (`applyLayout`).\n8. Date boxes: replaces native date inputs with day/month/year text boxes.\n9. Manual (this text) and extras (see above).\n10. Boot: starts sync, the lock and the first render. It must stay the final script.\n\n### Data model\n\nStored in localStorage under `ledgerline:data:v2` (UI state under `ledgerline:ui:v2`, collapsed boxes and layout under their own keys). Shape:\n\n- `schema`: version number. Bump it in `defaultState` and add a step in `migrate()` whenever the stored shape changes; old data must keep working.\n- `settings`: the recurring plan (`recurring.income`, `bills`, `annual`, `savings`), `categories` (with optional `limit`), `fixedGroups`, `cash` (`amount`, `date`, `mode: 'accounts'`), `cashAccounts`, `savingsGoals`, `goalInBudget`, `assetClasses`, `projection`, sync and price settings.\n- `months`: `{ \"YYYY-MM\": plan }`, a copy of the plan per month so changes to one month don't affect others.\n- `transactions`: `{ id: { name, amount, date, type, category, … } }`. `type` is `out` (spending), `in` (money in), `invest` (with `accountId` and `source` budget, bonus or savings), `debt` (with `debtId`), or `sell` (with shares, gross, tax and fees).\n- `holdings`: `{ id: { name, isin, symbol, kind, assetClass, broker, base: { shares, date, at }, manualPrice, coingeckoId } }`. Share counts are `base` plus plan executions and transactions after `base.date`.\n- `debts`: `{ id: { name, original, rate, plan: { on, amount, day, start }, base: { balance, date }, target } }`.\n\nRules: amounts are integers in cents; dates are stored as ISO `YYYY-MM-DD`; every object carries `updatedAt`; deleting sets `deleted: true` (needed for sync, which merges per object, last write wins). Never rename storage keys.\n\n### Price pipeline\n\nGitHub Actions runs `fetch_prices.py` every 2 hours on weekdays, and `fetch_compositions.py` monthly and on manual runs, then commits `prices.json` (quotes plus about 400 days of daily closes) and `compositions.json`. The app shows each file's timestamp. To support a new fund, add it to `tickers.json`.\n\n### Testing a change\n\n1. In the repository folder, run `python3 -m http.server 8765` and open http://localhost:8765/.\n2. **Settings → Backup & export → Preview with demo data** fills ten months of entries so every chart has content.\n3. Check every page at desktop width and at phone width (390 px), in light and dark mode. Check that no page scrolls sideways and that no date shows month/day.\n4. Check that the money-flow diagram balances: everything into \"Money in\" equals everything out of it.\n5. Check that an existing backup still loads (migration).\n\n### Handing back a change\n\nReturn the complete updated `index.html`, plus any other changed files, with upload steps. **Every change to the app must come with an updated manual**: edit `MANUAL.md` and the copy embedded in `index.html` (the `MANUAL_MD` constant) together, raise `APP_VERSION` (shown in Settings) and the version line at the top of this manual to the same value. Keep features working that the owner relies on: the importer, the Apple Pay inbox, sync, app lock, the savings-rate goal in the budget, day/month/year dates, and collapsed and arranged boxes.\n";
function mdToHtml(md) {
  const inline = t => esc(t).replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>').replace(/(https?:\/\/[^\s<)]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>');
  const lines = md.split('\n'), out = []; let list = null, para = [], code = null;
  const flushP = () => { if (para.length) { out.push(`<p>${inline(para.join(' '))}</p>`); para = []; } };
  const flushL = () => { if (list) { out.push(`<${list.t}>${list.items.map(i => `<li>${inline(i)}</li>`).join('')}</${list.t}>`); list = null; } };
  for (const raw of lines) {
    const l = raw.replace(/\s+$/, '');
    if (code !== null) { if (/^\s*```/.test(l)) { out.push(`<pre><code>${esc(code.join('\n'))}</code></pre>`); code = null; } else code.push(l.trim()); continue; }
    if (/^\s*```/.test(l)) { flushP(); code = []; continue; }
    let m;
    if ((m = /^(#{1,3})\s+(.*)$/.exec(l))) { flushP(); flushL(); const n = m[1].length, id = 'm-' + m[2].toLowerCase().replace(/[^a-z0-9]+/g, '-'); out.push(`<h${n + 1} id="${id}">${inline(m[2])}</h${n + 1}>`); continue; }
    if ((m = /^\s*(\d+)\.\s+(.*)$/.exec(l)) || (m = /^\s*-\s+(.*)$/.exec(l))) { flushP(); const t = /^\s*\d+\./.test(l) ? 'ol' : 'ul', txt = m[2] ?? m[1]; if (!list || list.t !== t) { flushL(); list = { t, items: [] }; } list.items.push(txt); continue; }
    if (!l.trim()) { flushP(); if (list && !/^\s/.test(raw)) { /* blank line inside a list: keep the list open */ } continue; }
    if (list && /^\s{2,}/.test(raw)) { list.items[list.items.length - 1] += ' ' + l.trim(); continue; }
    flushL(); para.push(l.trim());
  }
  flushP(); flushL();
  return out.join('');
}
function viewManual() {
  const html = mdToHtml(MANUAL_MD), toc = [...MANUAL_MD.matchAll(/^##\s+(.*)$/gm)].map(m => `<a href="#m-${m[1].toLowerCase().replace(/[^a-z0-9]+/g, '-')}">${esc(m[1])}</a>`).join('');
  return `<div class="page-head"><div><h1>Manual</h1><p class="sub">How to use, update and extend Ledgerline. The same text is in <code>MANUAL.md</code> on GitHub, for any AI assistant you work with.</p></div><div class="right"><button class="btn" data-act="manual-download">Download MANUAL.md</button></div></div>
  <div class="panel manual-toc">${toc}</div><div class="panel manual">${html.replace(/^<h2[^>]*>.*?<\/h2>/, '')}</div>`;
}
Object.assign(ACTIONS, { 'manual-download': () => download('MANUAL.md', MANUAL_MD, 'text/markdown') });
</script>
<script>
'use strict';
/* =========================================================================
   1. Apple Pay inbox. An iPhone Shortcuts automation runs after each Wallet payment and posts
      "ledgerline|<amount>|<merchant>" as a comment on your sync Gist. Ledgerline collects these,
      shows them for confirmation (or adds them straight away), then deletes the comments.
   ========================================================================= */
const Inbox = {
  items: [], lastCheck: 0, busy: false,
  url() { return Sync.cfg?.gistId ? `https://api.github.com/gists/${Sync.cfg.gistId}/comments` : ''; },
  parseAmount(t) {
    let s = String(t || '').replace(/[^\d,.\-]/g, ''); if (!s) return NaN;
    const lc = s.lastIndexOf(','), ld = s.lastIndexOf('.');
    if (lc > ld) s = s.replace(/\./g, '').replace(',', '.'); else s = s.replace(/,/g, '');
    const v = Math.round(Math.abs(parseFloat(s)) * 100); return Number.isFinite(v) ? v : NaN;
  },
  async check(force = false) {
    if (!Sync.on || !Sync.cfg?.gistId || this.busy || (!force && Date.now() - this.lastCheck < 60000)) return this.items;
    this.busy = true; this.lastCheck = Date.now();
    try {
      const list = await Sync.api(`/gists/${Sync.cfg.gistId}/comments?per_page=100`) || [];
      this.items = list.map(c => { const m = /^\s*ledgerline\s*\|([^|]*)\|([^|]*)(?:\|(.*))?$/is.exec(c.body || ''); if (!m) return null;
        const amount = this.parseAmount(m[1]), d = new Date(c.created_at); return Number.isFinite(amount) && amount > 0 ? { cid: c.id, amount, merchant: (m[2] || 'Apple Pay').trim() || 'Apple Pay', card: (m[3] || '').trim(), date: isoDate(d), time: `${pad2(d.getHours())}:${pad2(d.getMinutes())}` } : null; }).filter(Boolean);
      if (this.items.length && state.settings.applePayMode === 'auto') this.addAll();
    } catch (e) { console.warn('Inbox', e); } finally { this.busy = false; }
    if (typeof render === 'function' && ['overview', 'today', 'settings'].includes(ui.view)) render();
    return this.items;
  },
  proposals() { const imp = buildProposals([{ label: 'Apple Pay', isPdf: false, tx: this.items.map(i => ({ date: i.date, time: i.time, amount: i.amount, dir: 'out', name: i.merchant, raw: i.merchant, account: i.card || 'Apple Pay' })) }]); imp.inboxIds = this.items.map(i => i.cid); return imp; },
  review() { if (!this.items.length) { toast('No new Apple Pay payments.'); return; } ui.imp = this.proposals(); ui.imp.files = []; paintReview(); },
  async addAll() { const imp = this.proposals(), r = applyImport(imp); await this.clear(imp.inboxIds); toast(`Added ${r.nTx} Apple Pay payment${r.nTx === 1 ? '' : 's'}. Tap one on the Month page to change it.`); render(); },
  async clear(ids) { for (const id of ids || []) { try { await Sync.api(`/gists/${Sync.cfg.gistId}/comments/${id}`, { method: 'DELETE' }); } catch (e) { console.warn(e); } } this.items = this.items.filter(i => !(ids || []).includes(i.cid)); },
};
// clear the inbox comments once a review that came from it has been applied
const _impApply = ACTIONS['imp-apply'];
ACTIONS['imp-apply'] = (...a) => { const ids = ui.imp?.inboxIds; _impApply(...a); if (ids && ids.length) Inbox.clear(ids).then(() => render()); };
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') setTimeout(() => Inbox.check(), 1500); });
setTimeout(() => Inbox.check(true), 2500);

function automationsPanel() {
  const on = !!(Sync.on && Sync.cfg?.gistId), mode = state.settings.applePayMode || 'ask', url = Inbox.url() || 'https://api.github.com/gists/YOUR-SYNC-ID/comments';
  return `<div class="panel"><h2>Apple Pay automation</h2>
    <p class="sub">Your iPhone can send every Apple Pay payment to Ledgerline by itself. You set this up once in Apple’s <b>Shortcuts</b> app; it takes about five minutes. Do it on the iPhone, with this page open in Ledgerline so you can copy the two values below.</p>
    <div class="facts" style="margin:10px 0"><div class="f"><span>Needs</span><span style="text-align:right;font-weight:500">iOS 17 or later · your card in Apple Wallet · sync working on this iPhone</span></div>
      <div class="f"><span>Sync on this device</span><span>${on ? '<b class="pos">Connected</b>' : '<b class="neg">Not set up yet</b>'}</span></div></div>
    ${on ? '' : '<div class="status warn">' + ICONS.alert + '<span>Set up sync on this iPhone first (Settings → Sync between devices). The address and token below fill in once sync is connected.</span></div>'}
    <h3 style="margin:14px 0 6px">1. Choose what happens with payments</h3>
    <div class="seg" role="group">${[['ask', 'Ask me to confirm'], ['auto', 'Add straight away']].map(([v, l]) => `<button data-act="ap-mode" data-mode="${v}" aria-pressed="${mode === v}">${l}</button>`).join('')}</div>
    <h3 style="margin:14px 0 6px">2. The two values you’ll paste</h3>
    <div class="facts"><div class="f"><span>Web address</span><span class="copyrow"><code>${esc(url)}</code>${on ? `<button class="btn small" data-act="copy" data-text="${esc(url)}">Copy</button>` : ''}</span></div>
      <div class="f"><span>Authorization</span><span class="copyrow"><code>Bearer ${on ? '••••' + esc((Sync.cfg.token || '').slice(-4)) : 'your token'}</code>${on ? `<button class="btn small" data-act="copy" data-text="Bearer ${esc(Sync.cfg.token || '')}">Copy</button>` : ''}</span></div></div>
    <h3 style="margin:14px 0 6px">3. Build the automation in Shortcuts</h3>
    <div class="status info" style="margin-bottom:8px">${ICONS.info}<span><b>On newer iPhones</b> the automation opens as a shortcut that starts with <b>“When Any Card is tapped”</b>, with switches for <b>Automation</b> (leave it on) and <b>Notify</b>. That’s the right place: skip to step 4 and add the action with the <b>Search</b> box at the bottom. The payment details are then called <b>Transaction</b> or <b>Shortcut Input</b>; either works in steps 10 and 11.</span></div>
    <ol class="steps">
      <li>Open the <b>Shortcuts</b> app and tap <b>Automation</b> in the bar at the bottom (not “Shortcuts”). Tap <b>+</b> at the top right (or <b>New Automation</b> if you have none yet).</li>
      <li>A list of triggers appears: Time of Day, Alarm, Email, … Scroll down and tap <b>Transaction</b>, the one with the Wallet icon and the text “When I tap my card”. If you instead see actions like <i>Open Card</i>, <i>Request Payment</i> or <i>Send Payment</i>, you’re in the wrong place: close it and start again from the Automation tab.</li>
      <li>Under <b>Card</b>, select the card(s) you pay with. Leave Merchant and Category as they are. Choose <b>Run Immediately</b>, and switch off <b>Notify When Run</b> if you don’t want a notice each time. Tap <b>Next</b>.</li>
      <li>Tap <b>New Blank Automation</b>, then <b>Add Action</b>, search for <b>Get Contents of URL</b> and tap it.</li>
      <li>Tap the blue word <b>URL</b> and paste the <b>web address</b> from step 2.</li>
      <li>Tap the small arrow <b>›</b> next to the address to show more options. Set <b>Method</b> to <b>POST</b>.</li>
      <li>Under <b>Headers</b>, tap <b>Add new header</b>. Type <code>Authorization</code> as the key, and paste the <b>Authorization</b> value from step 2 (it starts with “Bearer”) as the text.</li>
      <li>Under <b>Request Body</b>, choose <b>JSON</b>. Tap <b>Add new field</b> → <b>Text</b>. Type <code>body</code> as the key.</li>
      <li>Tap the value box next to it and type <code>ledgerline|</code> (on the iPhone keyboard the <code>|</code> is under <b>123</b> → <b>#+=</b>).</li>
      <li>In the bar above the keyboard, tap <b>Shortcut Input</b> to insert it. Tap the inserted <b>Shortcut Input</b> bubble and choose <b>Amount</b>.</li>
      <li>Type another <code>|</code>, insert <b>Shortcut Input</b> again, tap it and choose <b>Merchant</b>. The field now reads: <code>ledgerline|Amount|Merchant</code>.</li>
      <li>Tap <b>Done</b> at the top right. The automation is saved.</li>
    </ol>
    <h3 style="margin:14px 0 6px">4. Test it</h3>
    <ol class="steps"><li>Pay for something small with Apple Pay. (Running the automation by hand doesn’t work: without a real payment there’s no amount or shop.)</li>
      <li>Open Ledgerline. A banner says “1 Apple Pay payment to confirm”, or the payment is already added. You can also tap <b>Check for payments now</b> below.</li></ol>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px">${on ? '<button class="btn" data-act="ap-check">Check for payments now</button>' : ''}${Inbox.items.length ? `<button class="btn primary" data-act="ap-review">Review ${Inbox.items.length} payment${Inbox.items.length === 1 ? '' : 's'}</button>` : ''}</div>
    <p class="small muted" style="margin:10px 0 0"><b>If nothing arrives:</b> on the iPhone open <b>Settings → Apps → Wallet</b> and make sure <b>Mobile Data</b> is on; check the automation still says Run Immediately; and if you ever replace your GitHub token, paste the new one into the automation too. While a payment waits for Ledgerline it sits unencrypted on your sync file (amount and shop only) and is deleted as soon as it’s picked up.</p></div>`;
}
Object.assign(ACTIONS, {
  'ap-mode': el => { state.settings.applePayMode = el.dataset.mode; touchSettings(); persist(); render(); },
  'ap-check': async () => { toast('Checking…'); const r = await Inbox.check(true); toast(r.length ? `${r.length} new payment${r.length === 1 ? '' : 's'}.` : 'No new payments.'); },
  'ap-review': () => Inbox.review(),
  copy: async el => { try { await navigator.clipboard.writeText(el.dataset.text); toast('Copied.'); } catch { prompt('Copy this:', el.dataset.text); } },
});

/* =========================================================================
   1b. Paste a screenshot instead of saving it first: a Paste button (asks the system clipboard),
       a paste box for iPhone's long-press Paste, and ⌘V anywhere on a Mac.
   ========================================================================= */
async function importBlobs(blobs) {
  const files = blobs.map((b, i) => b instanceof File && b.name ? b : new File([b], `Pasted screenshot${blobs.length > 1 ? ' ' + (i + 1) : ''}.${(b.type.split('/')[1] || 'png').replace('jpeg', 'jpg')}`, { type: b.type || 'image/png' }));
  if (!files.length) return false;
  if (!$('#impProgress')) openImport();
  await runImport(files); return true;
}
ACTIONS['imp-paste'] = async () => {
  try {
    if (!navigator.clipboard?.read) throw new Error('no clipboard');
    const items = await navigator.clipboard.read(), blobs = [];
    for (const it of items) { const t = it.types.find(x => x.startsWith('image/')); if (t) blobs.push(await it.getType(t)); }
    if (!blobs.length) { toast('There’s no picture on the clipboard. Copy the screenshot first.'); return; }
    await importBlobs(blobs);
  } catch { toast('Tap the box next to the button and choose Paste.'); $('#pasteZone')?.focus(); }
};
document.addEventListener('paste', e => {
  const files = [...(e.clipboardData?.files || [])].filter(f => f.type.startsWith('image/') || f.type === 'application/pdf');
  const inZone = e.target && e.target.id === 'pasteZone', inField = e.target && /^(INPUT|TEXTAREA)$/.test(e.target.tagName);
  if (!files.length) { if (inZone) { e.preventDefault(); toast('That wasn’t a picture. Copy the screenshot first.'); } return; }
  if (inField && !inZone) return;
  e.preventDefault(); if (inZone) e.target.textContent = '';

});

/* =========================================================================
   2. "?" help on the boxes whose meaning isn't obvious.
   ========================================================================= */
