e verschiebt deine Daten in eine neue verschlüsselte Datei und löscht die alte, damit keine lesbare Kopie auf GitHub bleibt.", "a day.": "pro Tag.", "from savings": "aus Ersparnissen", "on GitHub, inside the list:": "auf GitHub, innerhalb der Liste:", "simulated from your own spending": "simuliert aus deinen eigenen Ausgaben", "travel, gifts and similar": "Reisen, Geschenke und Ähnliches", "what’s left of the budget": "was vom Budget übrig ist", "“Invested a month” defaults to your plans plus recent round-ups and saveback. “Paid in” is your starting amount plus every euro you add, minus anything you take out, so the gap to the middle outcome is what compounding earns. Returns are after inflation; cash is held flat.": "„Monatlich investiert“ entspricht standardmäßig deinen Plänen plus den letzten Aufrundungen und Saveback. „Eingezahlt“ ist dein Startbetrag plus jeder Euro, den du hinzufügst, minus Entnahmen; der Abstand zum mittleren Ergebnis ist also, was der Zinseszins erwirtschaftet. Renditen sind nach Inflation; Bargeld wird konstant gehalten.", "Not spent yet": "Noch nicht ausgegeben", "Left over": "Übrig", "Debt repayment": "Tilgung", "Saveback (paid into funds)": "Saveback (in Fonds gezahlt)", "Set aside for your goal": "Für dein Ziel zurückgelegt", "Saved for your goal": "Für dein Ziel gespart", "Housing": "Wohnen", "Insurance": "Versicherungen", "Phone": "Telefon", "Subscriptions & media": "Abos & Medien", "Donations": "Spenden", "Memberships": "Mitgliedschaften", "Other fixed costs": "Sonstige Fixkosten", "On track.": "Im Plan.", "On track": "Im Plan", "Getting tight.": "Wird knapp.", "Not spent": "Nicht ausgegeben", "Planned": "Geplant", "Payments to come": "Anstehende Zahlungen", "Income to come": "Anstehendes Einkommen", "A small script on GitHub fetches ETF prices from Yahoo Finance every two hours on weekdays and saves them next to the app. Crypto prices come live from CoinGecko. One-time setup:": "Ein kleines Skript auf GitHub lädt werktags alle zwei Stunden ETF-Kurse von Yahoo Finance und speichert sie neben der App. Kryptokurse kommen live von CoinGecko. Einmalige Einrichtung:", "Take the tour": "Tour starten", "Setup help for your AI": "Einrichtungshilfe für deine KI", "Show me around": "Zeig mir die App", "Look around first (with sample data)": "Erst mal umsehen (mit Beispieldaten)", "Estimated": "Geschätzt", "estimated": "geschätzt", "Est.": "Gesch.", "Today, ": "Heute, "};
const DE_BLOCK = {"Took a screenshot? Tap its thumbnail, then Done → Copy and Delete. Back here, tap Paste screenshot. On a Mac, ⌘V works anywhere in this window.": "Screenshot gemacht? Tippe auf die Vorschau, dann <b>Fertig → Kopieren und löschen</b>. Hier tippst du dann auf <b>Screenshot einfügen</b>. Auf dem Mac funktioniert ⌘V überall in diesem Fenster.", "A list of triggers appears: Time of Day, Alarm, Email, … Scroll down and tap Transaction, the one with the Wallet icon and the text “When I tap my card”. If you instead see actions like Open Card, Request Payment or Send Payment, you’re in the wrong place: close it and start again from the Automation tab.": "Eine Liste von Auslösern erscheint: Tageszeit, Wecker, E-Mail, … Scrolle nach unten und tippe auf <b>Transaktion</b>, den Eintrag mit dem Wallet-Symbol und dem Text „Wenn ich meine Karte verwende“. Siehst du stattdessen Aktionen wie <i>Karte öffnen</i>, <i>Zahlung anfordern</i> oder <i>Zahlung senden</i>, bist du an der falschen Stelle: schließe das und beginne erneut im Tab „Automation“.", "Add what you spend on the Today page, or import screenshots and statements with Import.": "Erfasse deine Ausgaben auf der Seite <b>Heute</b> oder importiere Screenshots und Auszüge mit <b>Importieren</b>.", "Add your investments on the Wealth page and any loans on the Debt page.": "Trag deine Investments auf der Seite <b>Vermögen</b> und Kredite auf der Seite <b>Schulden</b> ein.", "Want it on your phone too? Set up sync in Settings. The Manual explains everything step by step, and every box has a ?.": "Auch auf dem Handy? Richte <b>Sync</b> in den Einstellungen ein. Die <b>Anleitung</b> erklärt alles Schritt für Schritt, und jede Box hat ein <b>?</b>.", "How your data is stored (tap to read)": "<b>Wie deine Daten gespeichert werden</b> (zum Lesen tippen)", "On your device only. Everything you enter is saved in this browser’s storage on this device. There is no Ledgerline server and no account; the person who shared the app with you can’t see your data.": "<b>Nur auf deinem Gerät.</b> Alles, was du eingibst, wird im Speicher dieses Browsers auf diesem Gerät gesichert. Es gibt keinen Ledgerline-Server und kein Konto; die Person, die dir die App geschickt hat, kann deine Daten nicht sehen.", "Not encrypted on the device itself. It’s protected by your device’s own lock. Anyone who can use your unlocked device could open it, so you can add Face ID, Touch ID or a PIN in Settings → App lock.": "<b>Auf dem Gerät selbst nicht verschlüsselt.</b> Geschützt ist es durch die Sperre deines Geräts. Wer dein entsperrtes Gerät benutzen kann, könnte die App öffnen; deshalb kannst du unter Einstellungen → App-Sperre Face ID, Touch ID oder eine PIN hinzufügen.", "Sync is optional and encrypted. If you turn it on, your data is encrypted on your device with your passphrase before it’s stored in your own GitHub account. GitHub can’t read it, and nobody can recover it if you lose the passphrase.": "<b>Sync ist optional und verschlüsselt.</b> Wenn du ihn aktivierst, werden deine Daten auf deinem Gerät mit deiner Passphrase verschlüsselt, bevor sie in deinem eigenen GitHub-Konto gespeichert werden. GitHub kann sie nicht lesen, und niemand kann sie wiederherstellen, wenn du die Passphrase verlierst.", "Imports stay on your device. Screenshots and PDFs are read on your device and never uploaded. The text-recognition tools are downloaded once from public code servers (cdnjs, jsDelivr), which see that a download happened, not your files.": "<b>Importe bleiben auf deinem Gerät.</b> Screenshots und PDFs werden auf deinem Gerät gelesen und nie hochgeladen. Die Texterkennung wird einmalig von öffentlichen Code-Servern (cdnjs, jsDelivr) geladen; die sehen, dass etwas heruntergeladen wurde, aber nicht deine Dateien.", "Prices. To show prices, the app loads a public price file from GitHub and crypto prices from CoinGecko. Those requests don’t contain your data, but like any website visit they reveal your internet address.": "<b>Kurse.</b> Für Kurse lädt die App eine öffentliche Kursdatei von GitHub und Kryptokurse von CoinGecko. Diese Anfragen enthalten keine Daten von dir, verraten aber wie jeder Webseitenbesuch deine Internetadresse.", "Apple Pay automation (optional): a payment’s amount and shop name wait unencrypted in your own GitHub sync file for a short time, until the app picks them up and deletes them.": "<b>Apple-Pay-Automation</b> (optional): Betrag und Händler einer Zahlung liegen kurz unverschlüsselt in deiner eigenen GitHub-Sync-Datei, bis die App sie abholt und löscht.", "Your responsibility: clearing this browser’s data or deleting the app from your home screen deletes your data on this device. Download a backup now and then (Settings → Backup & export).": "<b>Deine Verantwortung:</b> Wenn du die Browserdaten löschst oder die App vom Home-Bildschirm entfernst, sind deine Daten auf diesem Gerät weg. Lade ab und zu ein Backup herunter (Einstellungen → Backup & Export).", "Trust: the app’s code is public and can be read by anyone. Updates come from the person who shared it with you; like any app, you rely on them not to change it to send data elsewhere.": "<b>Vertrauen:</b> Der Code der App ist öffentlich und für alle lesbar. Updates kommen von der Person, die sie dir geschickt hat; wie bei jeder App verlässt du dich darauf, dass sie sie nicht so ändert, dass Daten woandershin gesendet werden.", "Create a token with only the gist permission at github.com/settings/tokens/new.": "Erstelle unter <b>github.com/settings/tokens/new</b> ein Token nur mit der Berechtigung <code>gist</code>.", "First device: paste the token, choose a passphrase, then Create sync file. Other devices: token, sync ID and the same passphrase, then Connect.": "Erstes Gerät: Token einfügen, eine Passphrase wählen, dann <b>Sync-Datei erstellen</b>. Weitere Geräte: Token, Sync-ID und dieselbe Passphrase, dann <b>Verbinden</b>.", "If nothing arrives: on the iPhone open Settings → Apps → Wallet and make sure Mobile Data is on; check the automation still says Run Immediately; and if you ever replace your GitHub token, paste the new one into the automation too. While a payment waits for Ledgerline it sits unencrypted on your sync file (amount and shop only) and is deleted as soon as it’s picked up.": "<b>Wenn nichts ankommt:</b> Öffne auf dem iPhone <b>Einstellungen → Apps → Wallet</b> und prüfe, ob <b>Mobile Daten</b> aktiv sind; prüfe, ob die Automation noch auf „Sofort ausführen“ steht; und wenn du dein GitHub-Token ersetzt, trag das neue auch in der Automation ein. Solange eine Zahlung auf Ledgerline wartet, liegt sie unverschlüsselt in deiner Sync-Datei (nur Betrag und Händler) und wird gelöscht, sobald sie abgeholt ist.", "In the bar above the keyboard, tap Shortcut Input to insert it. Tap the inserted Shortcut Input bubble and choose Amount.": "Tippe in der Leiste über der Tastatur auf <b>Kurzbefehleingabe</b>, um sie einzufügen. Tippe auf die eingefügte Blase und wähle <b>Betrag</b>.", "In the repository choose Add file, then Create new file. Name it .github/workflows/update-prices.yml, paste in the contents of update-prices.yml, and commit.": "Wähle im Repository <b>Add file</b>, dann <b>Create new file</b>. Nenne die Datei <code>.github/workflows/update-prices.yml</code>, füge den Inhalt von <code>update-prices.yml</code> ein und bestätige mit Commit.", "On a Mac, choose Save as PDF in the print window. On iPhone, tap the share icon in the print preview, then Save to Files.": "Auf dem Mac wählst du im Druckfenster <b>Als PDF sichern</b>. Auf dem iPhone tippst du in der Druckvorschau auf das Teilen-Symbol und dann auf <b>In Dateien sichern</b>.", "On newer iPhones the automation opens as a shortcut that starts with “When Any Card is tapped”, with switches for Automation (leave it on) and Notify. That’s the right place: skip to step 4 and add the action with the Search box at the bottom. The payment details are then called Transaction or Shortcut Input; either works in steps 10 and 11.": "<b>Auf neueren iPhones</b> öffnet sich die Automation als Kurzbefehl, der mit <b>„Wenn eine beliebige Karte verwendet wird“</b> beginnt, mit Schaltern für <b>Automation</b> (eingeschaltet lassen) und <b>Mitteilen</b>. Das ist richtig: springe zu Schritt 4 und füge die Aktion über das <b>Suchfeld</b> unten hinzu. Die Zahlungsdaten heißen dann <b>Transaktion</b> oder <b>Kurzbefehleingabe</b>; beides funktioniert in den Schritten 10 und 11.", "Open Ledgerline. A banner says “1 Apple Pay payment to confirm”, or the payment is already added. You can also tap Check for payments now below.": "Öffne Ledgerline. Ein Hinweis zeigt „1 Apple-Pay-Zahlung zu bestätigen“, oder die Zahlung ist schon eingetragen. Du kannst auch unten auf <b>Jetzt nach Zahlungen suchen</b> tippen.", "Open the Actions tab, choose Update prices, then Run workflow, to fetch prices right away.": "Öffne den Tab <b>Actions</b>, wähle <b>Update prices</b> und dann <b>Run workflow</b>, um sofort Kurse zu laden.", "Open the Shortcuts app and tap Automation in the bar at the bottom (not “Shortcuts”). Tap + at the top right (or New Automation if you have none yet).": "Öffne die App <b>Kurzbefehle</b> und tippe unten in der Leiste auf <b>Automation</b> (nicht „Kurzbefehle“). Tippe oben rechts auf <b>+</b> (oder auf <b>Neue Automation</b>, falls du noch keine hast).", "Tap Done at the top right. The automation is saved.": "Tippe oben rechts auf <b>Fertig</b>. Die Automation ist gespeichert.", "Tap New Blank Automation, then Add Action, search for Get Contents of URL and tap it.": "Tippe auf <b>Neue leere Automation</b>, dann auf <b>Aktion hinzufügen</b>, suche nach <b>Inhalte von URL abrufen</b> und tippe darauf.", "Tap the blue word URL and paste the web address from step 2.": "Tippe auf das blaue Wort <b>URL</b> und füge die <b>Webadresse</b> aus Schritt 2 ein.", "Tap the small arrow › next to the address to show more options. Set Method to POST.": "Tippe auf den kleinen Pfeil <b>›</b> neben der Adresse, um weitere Optionen zu sehen. Stelle <b>Methode</b> auf <b>POST</b>.", "Type another |, insert Shortcut Input again, tap it and choose Merchant. The field now reads: ledgerline|Amount|Merchant.": "Tippe ein weiteres <code>|</code>, füge erneut <b>Kurzbefehleingabe</b> ein, tippe darauf und wähle <b>Händler</b>. Das Feld lautet jetzt: <code>ledgerline|Betrag|Händler</code>.", "Under Card, select the card(s) you pay with. Leave Merchant and Category as they are. Choose Run Immediately, and switch off Notify When Run if you don’t want a notice each time. Tap Next.": "Wähle unter <b>Karte</b> die Karte(n), mit denen du zahlst. Händler und Kategorie bleiben, wie sie sind. Wähle <b>Sofort ausführen</b> und schalte <b>Bei Ausführung mitteilen</b> aus, wenn du nicht jedes Mal einen Hinweis willst. Tippe auf <b>Weiter</b>.", "Under Headers, tap Add new header. Type Authorization as the key, and paste the Authorization value from step 2 (it starts with “Bearer”) as the text.": "Tippe unter <b>Header</b> auf <b>Neuen Header hinzufügen</b>. Gib <code>Authorization</code> als Schlüssel ein und füge den <b>Authorization</b>-Wert aus Schritt 2 (beginnt mit „Bearer“) als Text ein.", "Under Request Body, choose JSON. Tap Add new field → Text. Type body as the key.": "Wähle unter <b>Anfragetext</b> die Option <b>JSON</b>. Tippe auf <b>Neues Feld hinzufügen</b> → <b>Text</b>. Gib <code>body</code> als Schlüssel ein.", "Upload fetch_prices.py, fetch_compositions.py and tickers.json to your repository, the same way as index.html.": "Lade <code>fetch_prices.py</code>, <code>fetch_compositions.py</code> und <code>tickers.json</code> genauso in dein Repository hoch wie <code>index.html</code>.", "Your iPhone can send every Apple Pay payment to Ledgerline by itself. You set this up once in Apple’s Shortcuts app; it takes about five minutes. Do it on the iPhone, with this page open in Ledgerline so you can copy the two values below.": "Dein iPhone kann jede Apple-Pay-Zahlung selbst an Ledgerline senden. Das richtest du einmal in Apples App <b>Kurzbefehle</b> ein; es dauert etwa fünf Minuten. Mach es auf dem iPhone, mit dieser Seite in Ledgerline offen, damit du die beiden Werte unten kopieren kannst.", "Tap the value box next to it and type ledgerline| (on the iPhone keyboard the | is under 123 → #+=).": "Tippe auf das Wertfeld daneben und gib <code>ledgerline|</code> ein (auf der iPhone-Tastatur liegt der <code>|</code> unter <b>123</b> → <b>#+=</b>).", "Pay for something small with Apple Pay. (Running the automation by hand doesn’t work: without a real payment there’s no amount or shop.)": "Bezahle etwas Kleines mit Apple Pay. (Die Automation von Hand auszuführen funktioniert nicht: Ohne echte Zahlung gibt es keinen Betrag und keinen Händler.)", "Set up sync on this iPhone first (Settings → Sync between devices). The address and token below fill in once sync is connected.": "Richte zuerst Sync auf diesem iPhone ein (Einstellungen → Sync zwischen Geräten). Adresse und Token unten erscheinen, sobald Sync verbunden ist."};
const HELP_DE = {"savings rate": "Der Anteil deines Einkommens, den du diesen Monat gespart hast: Sparpläne, Aufrundungen, aus dem Einkommen getilgte Schulden, Zinsen und was am Monatsende übrig ist, abzüglich Ausgaben aus Ersparnissen. Solange der Monat läuft, ist es eine Prognose.", "safety net": "Wie viele Monate deiner Kosten (Fixkosten, Sparpläne und übliche Ausgaben) deine Ersparnisse decken würden, wenn dein Einkommen wegfiele. ETFs und Krypto zählen nicht, weil ein Verkauf im falschen Moment teuer werden kann.", "monthly budget": "Dein Einkommen minus Fixkosten, Sparpläne und den Bargeld-Anteil deines Sparziels. Was bleibt, kannst du ausgeben, verteilt auf die Tage nach deinem üblichen Wochenmuster.", "where the money goes": "Jedes Band ist Geld, das von seiner Herkunft (links) zu seinem Ziel (rechts) fließt. Saveback ist separat eingezeichnet, weil es direkt in einen Fonds geht.", "where the money went": "Dasselbe Diagramm für das bisherige Jahr.", "next days": "Deine erwartete Summe über alle Konten in den nächsten Wochen: der heutige Stand plus Einkommen am Zahltag, minus Fixkosten, Sparpläne und deine üblichen Tagesausgaben. Auf den Tiefpunkt solltest du achten.", "wealth over time": "Dein Vermögen Tag für Tag. Vor Beginn deiner Aufzeichnung ist es eine Schätzung aus deinen damaligen Positionen. Innerhalb jedes Monats sinkt die Linie mit deinen Ausgaben und steigt, wenn Einkommen eingeht.", "diversification": "Was deine ETFs enthalten, gewichtet nach deinem Anteil an jedem. Nur Aktien werden nach Sektor und Land aufgeschlüsselt.", "cash savings": "Alle deine Konten zusammen, abzüglich dessen, was der laufende Monat noch braucht (Restbudget und anstehende Zahlungen).", "where this could lead": "Eine Simulation von 2.000 möglichen Verläufen deiner Investments in heutigem Geld. Das Band umfasst 80 % der Ergebnisse; nichts davon ist garantiert.", "ways to save": "Vorschläge aus deinem eigenen Plan und deinen Einträgen. Was du ausblendest oder behältst, wird /* Translation engine. The interface is written in English; when German is chosen, every rendered
   text is swapped for its German version: whole formatted paragraphs first (DE_BLOCK), then single
   texts (DE), then sentences with numbers (DE_PAT). Anything without a translation stays English.
   User data (names of entries, holdings, debts) is never touched unless it equals a default label. */
const norm = s => String(s).replace(/\s+/g, ' ').trim();
function deStr(raw) {
  const k = norm(raw); if (!k || k.length > 600) return null;
  if (Object.prototype.hasOwnProperty.call(DE, k)) return DE[k];
  for (const [re, out] of DE_PAT) { const m = re.exec(k); if (m) return typeof out === 'function' ? out(m) : k.replace(re, out); }

const SETUP_HELP_EN = `# Help me set up Ledgerline

You are helping me set up **Ledgerline**, a free personal budget and wealth web app. I'm not technical. Please:

- Go **one step at a time**. After each step, ask me what I see on my screen before giving the next one.
- Use the exact button names below, in the language my app shows (English or German).
- Explain technical words (GitHub, token, Gist, Shortcuts) in one plain sentence when they first come up.
- Never ask me to share my token, passphrase or bank data with you.
- If something looks different from these instructions, ask me for a screenshot description and adapt.

## What Ledgerline is

A web page I add to my home screen. My data stays on my device (no account, no server). Optional: sync between my devices through an encrypted file in my own GitHub account, and an iPhone automation that sends Apple Pay payments to the app.

## 1. Install it (2 minutes)

- iPhone: open the app's link in **Safari** → **Share** → **Add to Home Screen** → open it from the home screen.
- Mac: open the link in **Safari** → **File** → **Add to Dock**.

## 2. Set up the budget (3 minutes)

The setup wizard opens by itself. Steps: language, name (as on bank transfers), home currency (more currencies can be switched on later under Settings → Budget → “I use more than one currency”), monthly income with pay day, fixed monthly costs (rent, insurance, contracts, subscriptions), optional investment plans, today's total across all accounts, savings goal (10–20% is common). Every step can be skipped and changed later in **Settings**. To restart it: **Settings → Backup & export → Run the setup again**.

## 3. Sync between devices (optional, 10 minutes)

1. Create a free account at **github.com** if I don't have one.
2. Create a token: **github.com/settings/tokens/new** → classic token → name "Ledgerline" → expiration "No expiration" → tick **only "gist"** → **Generate token** → copy it into my password manager.
3. On my **first** device: **Settings → Sync between devices** → paste the token → choose a passphrase (at least 8 characters, saved in my password manager; it can't be recovered) → leave Sync ID empty → **Create sync file**. The **Sync ID** then appears there with a **Copy** button.
4. On **every other** device: the same token, that **Sync ID** and the same passphrase → **Connect**. On a new device the wizard's "I already use Ledgerline on another device" leads there.
5. All devices must show the same Sync ID.

## 4. Apple Pay automation (optional, iPhone, 5 minutes)

Needs iOS 17+, the card in Apple Wallet and sync set up. In Ledgerline open **Settings → Apple Pay automation**: it shows the **web address** and the **Authorization** value with Copy buttons. Then in the **Shortcuts** app:

1. Tap **Automation** in the bottom bar (not "Shortcuts") → **+** → scroll to **Transaction** (Wallet icon). If I see actions like "Open Card" or "Send Payment", I'm in the wrong place.
2. Select my card(s) → **Run Immediately** → **Next** → **New Blank Automation**. (Newer iOS: it opens as a shortcut starting "When Any Card is tapped" — that's right; keep "Automation" switched on.)
3. Add the action **Get Contents of URL** → tap **URL** → paste the web address.
4. Tap the arrow **›** → Method **POST** → Headers: **Add new header**, key \`Authorization\`, text = the Authorization value.
5. Request Body: **JSON** → **Add new field → Text** → key \`body\` → in the box labelled "Text" type \`ledgerline|\`, insert the payment variable (**Transaction** or **Shortcut Input**) and choose **Amount**, type \`|\`, insert it again and choose **Merchant**.
6. Save. Test with a small Apple Pay payment, then open Ledgerline.

If nothing arrives: iPhone **Settings → Apps → Wallet → Mobile Data** on; automation still on "Run Immediately"; in Ledgerline **Check for payments now**.

## 5. Daily use

Add purchases on **Today**, or **Import** screenshots (also by pasting) and PDF statements; check each entry before adding. Every box has a **?**. The **Manual** page explains everything; **Settings → Backup & export → Download backup** now and then.
`;

  const f = $('#holdForm'); if (f && !f.querySelector('[name="cur"]')) {
    const id = $('[data-act="hold-save"]')?.dataset.id, h = id ? state.holdings[id] : null, sym = f.querySelector('[name="symbol"]');
    const label = document.createElement('label'); label.className = 'field'; label.innerHTML = `${L2('Price currency', 'Kurswährung')}<select class="input" name="cur">${CURRENCIES.map(c => `<option ${(h ? holdingCur(h) : homeCur()) === c ? 'selected' : ''}>${c}</option>`).join('')}</select>`;
    (sym ? sym.closest('label') : f.querySelector('.field')).after(label);
  }
  const d = $('#debtForm'); if (d && !d.querySelector('[name="cur"]')) {
    const id = $('[data-act="debt-save"]')?.dataset.id, x = id ? state.debts[id] : null;
    const label = document.createElement('label'); label.className = 'field'; label.innerHTML = `${L2('Currency of the debt', 'Währung der Schuld')}<select class="input" name="cur">${CURRENCIES.map(c => `<option ${((x && x.cur) || homeCur()) === c ? 'selected' : ''}>${c}</option>`).join('')}</select>`;
    d.querySelector('[name="name"]').closest('label').after(label);
  }
}).observe(document.body, { childList: true, subtree: true });
document.addEventListener('change', e => {
  const c = e.target.dataset?.caccCur; if (c) { const a = (state.settings.cashAccounts || []).find(x => x.id === c); if (a) { a.cur = e.target.value; touchSettings(); } sumCashAccounts(); }
});
document.addEventListener('input', e => { if (e.target.dataset?.cacc?.endsWith(':amount')) setTimeout(sumCashAccounts, 0); });
function sumCashAccounts() {
  if (!multiCur()) return; const tot = $('#cashAmt'); if (!tot) return;
  let any = false, total = 0;
  $$('[data-cacc$=":amount"]').forEach(inp => { const v = parseAmount(inp.value); if (!Number.isFinite(v)) return; any = true; const id = inp.dataset.cacc.split(':')[0], cur = $(`[data-cacc-cur="${id}"]`)?.value || homeCur(); total += fxConv(v, cur); });
  if (any) tot.value = toMajor(total);
}
// saving a holding or a debt keeps the chosen currency
const _holdSave = ACTIONS['hold-save'], _debtSave = ACTIONS['debt-save'];
ACTIONS['hold-save'] = el => { const cur = $('#holdForm [name="cur"]')?.value, before = new Set(Object.keys(state.holdings)); _holdSave(el); const id = el.dataset.id && el.dataset.id !== 'null' ? el.dataset.id : Object.keys(state.holdings).find(k => !before.has(k)); const h = id && state.holdings[id]; if (h && cur) { const guess = (() => { const c = h.cur; delete h.cur; const g = holdingCur(h); if (c) h.cur = c; return g; })(); if (cur !== guess) h.cur = cur; else delete h.cur; h.updatedAt = now(); persist(); render(); } };
ACTIONS['debt-save'] = el => { const cur = $('#debtForm [name="cur"]')?.value, before = new Set(Object.keys(state.debts)); _debtSave(el); const id = el.dataset.id || Object.keys(state.debts).find(k => !before.has(k)); const d = id && state.debts[id]; if (d && cur) { if (cur !== homeCur()) d.cur = cur; else delete d.cur; d.updatedAt = now(); persist(); render(); } };
// debt cards show their own currency
(window.AFTER_RENDER ||= []).push(() => {
  if (ui.view !== 'debt') return;
  $$('#main [data-act="debt-edit"]').forEach(b => { const d = state.debts[b.dataset.id]; if (!d || !d.cur || d.cur === homeCur()) return; const card = b.closest('.panel'); if (!card || card.querySelector('.cur-note')) return; const st = debtStatus(d);
    card.querySelector('.panel-head')?.insertAdjacentHTML('afterend', `<p class="small muted cur-note" style="margin:-4px 0 8px">${L2('Amounts in', 'Beträge in')} ${d.cur}. ${L2('In', 'In')} ${homeCur()}: ${fmt(fxConv(st.remaining, d.cur), { whole: true })} ${L2('at today’s rate', 'zum heutigen Kurs')}</p>`); });
});

/* ---------- Wealth: converted or side by side, and currency exposure ---------- */
function byCurrency() {
  const w = wealth(), out = {};
  const add = (cur, k, v) => { (out[cur] ||= { assets: 0, debt: 0 })[k] += v; };
  for (const x of w.hs) { const c = holdingCur(x.h), q = _quoteOf(x.h); add(c, 'assets', q ? Math.round(x.shares * q.price) : fxConv(x.value, homeCur(), c)); }
  const accs = (state.settings.cashAccounts || []).filter(a => a.amount != null);
  if (accs.length) accs.forEach(a => add(a.cur || homeCur(), 'assets', a.amount));   // account balances as you entered them
  else add(homeCur(), 'assets', w.cash.balance);
  for (const d of liveDebts()) add(d.cur || homeCur(), 'debt', debtStatus(d).remaining);
  return out;
}
(window.AFTER_RENDER ||= []).push(() => {
  if (ui.view !== 'wealth' || !multiCur()) return;
  const hero = $('#main .nw-hero'); if (!hero || hero.querySelector('.cur-seg')) return;
  const bc = byCurrency(), curs = Object.keys(bc); if (curs.length < 2 && !ui.fxSide) return;
  hero.insertAdjacentHTML('afterbegin', `<div class="seg cur-seg" role="group" style="margin-bottom:10px">${[['conv', L2(`All in ${homeCur()}`, `Alles in ${homeCur()}`)], ['side', L2('Each currency', 'Je Währung')]].map(([v, l]) => `<button data-act="fx-mode" data-mode="${v}" aria-pressed="${(ui.fxSide ? 'side' : 'conv') === v}">${l}</button>`).join('')}</div>`);
  if (ui.fxSide) hero.insertAdjacentHTML('beforeend', `<div class="facts cur-side" style="margin-top:12px">${curs.sort((a, b) => fxConv(bc[b].assets, b) - fxConv(bc[a].assets, a)).map(c => `<div class="f"><span><b>${c}</b></span><span>${fmt(bc[c].assets - bc[c].debt, { cur: c, whole: true })}${bc[c].debt ? ` <span class="small muted">(${fmt(bc[c].assets, { cur: c, whole: true })} − ${fmt(bc[c].debt, { cur: c, whole: true })})</span>` : ''}</span></div>`).join('')}</div><p class="small muted" style="margin:6px 0 0">${L2('Each currency on its own, not converted: holdings in the currency they’re priced in, accounts as entered under Update balance, debts in their own currency.', 'Jede Währung für sich, nicht umgerechnet: Positionen in ihrer Kurswährung, Konten wie unter „Saldo aktualisieren“ eingetragen, Schulden in ihrer eigenen Währung.')}</p>`);
});
ACTIONS['fx-mode'] = el => { ui.fxSide = el.dataset.mode === 'side'; render(); };
// currency exposure in the asset-type box
(window.AFTER_RENDER ||= []).push(() => {
  if (ui.view !== 'wealth' || !multiCur()) return;
  const box = $$('#main .panel[data-pkey]').find(p => p.dataset.pkey === 'wealth:asset types'); if (!box || box.querySelector('.cur-pie')) return;
  const bc = byCurrency(), entries = Object.entries(bc).map(([c, v]) => [c, Math.max(0, fxConv(v.assets, c))]).filter(e => e[1] > 0).sort((a, b) => b[1] - a[1]);
  if (entries.length < 2) return;
  box.insertAdjacentHTML('beforeend', `<div class="cur-pie" style="margin-top:14px"><h3 style="text-align:center;margin:0 0 6px">${L2('Currencies', 'Währungen')}</h3>${divPie(entries, L2('Currencies', 'Währungen'))}</div>`);
});

/* ---------- Apple Pay amounts in another currency ---------- */
const SYM = { '€': 'EUR', '£': 'GBP', '$': 'USD', 'US$': 'USD', 'CHF': 'CHF', 'Fr.': 'CHF', 'kr': 'SEK', 'zł': 'PLN', 'Kč': 'CZK', '¥': 'JPY' };
const _inboxProps = Inbox.proposals.bind(Inbox);
Inbox.proposals = function () {
  const imp = _inboxProps();
  imp.tx.forEach((p, i) => { const it = this.items[i]; if (!it || !it.rawAmount) return; const cur = CURRENCIES.find(c => it.rawAmount.toUpperCase().includes(c)) || Object.entries(SYM).find(([s]) => it.rawAmount.includes(s))?.[1]; if (cur && cur !== homeCur()) { p.cur = cur; p.orig = p.amount; p.amount = fxConv(p.amount, cur, homeCur(), p.date); p.notes.push({ tone: 'info', text: `${fmt(p.orig, { cur })} ${L2('converted at the rate of', 'umgerechnet zum Kurs vom')} ${fmtDate(p.date)}.` }); } });
  return imp;
};

const _openEdit = openEdit, _txSave = ACTIONS['tx-save'];
openEdit = function (id) {
  const r = _openEdit(id), t = state.transactions[id], f = $('#editForm'); if (!t || !f || !f.amount) return r;
  if (multiCur() || (t.cur && t.cur !== homeCur())) { f.amount.value = toMajor(t.cur && t.cur !== homeCur() ? t.orig : t.amount); { const w = document.createElement('span'); w.className = 'mcur'; f.amount.before(w); w.insertAdjacentHTML('beforeend', curSelect('_editcur', t.cur || homeCur(), 'mini').replace('data-bind="_editcur"', 'id="editCur"')); w.appendChild(f.amount); } }
  return r;
};
ACTIONS['tx-save'] = (el, e) => {
  const f = $('#editForm'), sel = $('#editCur'), id = el.dataset.id, t = state.transactions[id];
  if (f && sel && t) { const cur = sel.value, v = parseAmount(f.amount.value), date = f.date?.value || t.date;
    if (Number.isFinite(v) && cur !== homeCur()) { f.amount.value = toMajor(fxConv(v, cur, homeCur(), date)); _txSave(el, e); const x = state.transactions[id]; if (x) { x.cur = cur; x.orig = v; x.updatedAt = now(); persist(); render(); } return; }
    if (t.cur) { _txSave(el, e); const x = state.transactions[id]; if (x) { delete x.cur; delete x.orig; x.updatedAt = now(); persist(); render(); } return; } }
  return _txSave(el, e);
};
setTimeout(() => FX.refresh(), 3000);
</script>
<script>
'use strict';
/* ---------- boot ---------- */
ui._lastDay = todayISO();
(async () => {
  await Sync.init();
  if (Lock.on) Lock.show(); else afterUnlock();
  if (Sync.on) Sync.run(); else Sync.set('off', '');
})();
</script>
